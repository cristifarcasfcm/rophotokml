name: iOS - verificare compilare (fără semnare)

on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']
    paths: ['ios/**', 'index.html', 'package.json', 'capacitor.config.json', '.github/workflows/ios-check.yml']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run sync:ios
      - name: Compilare Release pentru iPhone, fără semnare
        run: |
          set +e
          xcodebuild -version | head -1
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > "$RUNNER_TEMP/ios.log" 2>&1
          code=$?
          esc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
          echo "::notice title=Xcode::$(xcodebuild -version | esc)"
          if [ $code -ne 0 ]; then
            echo "::error title=Xcode errors::$(grep -E 'error:|\*\* BUILD FAILED|fatal' "$RUNNER_TEMP/ios.log" | head -30 | esc)"
            echo "::error title=Xcode tail::$(tail -40 "$RUNNER_TEMP/ios.log" | esc)"
          else
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name App.app -path '*Release-iphoneos*' | head -1)
            PL="$APP/Info.plist"
            echo "::notice title=Info.plist::$(plutil -p "$PL" | grep -E 'Bundle|MinimumOS|Usage|Encryption|DeviceFamily|Capabilities' | esc)"
            echo "::notice title=Bundle::$(ls "$APP" | head -30 | esc)"
          fi
          exit $code
