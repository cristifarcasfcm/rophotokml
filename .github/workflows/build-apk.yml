name: Build ROPhotoKml APK
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Create www
      run: mkdir -p www && cp index.html www/index.html
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli@6
    - name: Add Android
      run: npx cap add android
    - name: Sync Capacitor
      run: npx cap sync android
    - name: Write MainActivity
      run: 'mkdir -p android/app/src/main/java/ro/rophotokml/app

        > "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''package ro.rophotokml.app;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.os.Bundle;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.os.Build;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.webkit.JavascriptInterface;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.webkit.WebView;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.content.ContentValues;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.content.ContentResolver;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.net.Uri;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.provider.MediaStore;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import android.util.Base64;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import java.io.OutputStream;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import java.io.File;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import java.io.FileOutputStream;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''import com.getcapacitor.BridgeActivity;'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''public class MainActivity extends BridgeActivity {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    @Override'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    public void onCreate(Bundle savedInstanceState) {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        super.onCreate(savedInstanceState);'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        getBridge().getWebView().addJavascriptInterface(new NativeBridge(),
        "AndroidApp");'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    @Override'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    public void onBackPressed() {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        WebView wv = getBridge().getWebView();'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        wv.evaluateJavascript('' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''            "if(typeof window.onAndroidBack===''"''"''function''"''"''){window.onAndroidBack();''"''"''ok''"''"'';}else{''"''"''no''"''"'';}",''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''            val -> { if(val==null||!val.contains("ok")){runOnUiThread(()->MainActivity.super.onBackPressed());}
        }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        );'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    public class NativeBridge {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        @JavascriptInterface'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        public String savePhoto(String b64, String fn) {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''            try {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                byte[] b = Base64.decode(b64, Base64.DEFAULT);'' >>
        "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
        {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    ContentResolver r = getContentResolver();'' >>
        "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    ContentValues v = new ContentValues();'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    v.put(MediaStore.Images.Media.DISPLAY_NAME, fn);''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    v.put(MediaStore.Images.Media.RELATIVE_PATH, "DCIM/ROPhotoKml");''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    v.put(MediaStore.Images.Media.IS_PENDING, 1);''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    Uri u = r.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
        v);'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    if(u==null) return "ERROR:insert failed";'' >>
        "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    try(OutputStream o=r.openOutputStream(u)){o.write(b);}''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    v.clear(); v.put(MediaStore.Images.Media.IS_PENDING,
        0);'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    r.update(u,v,null,null);'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    return "OK:"+u.toString();'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                } else {'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    File d=new File(android.os.Environment.getExternalStorageDirectory(),"DCIM/ROPhotoKml");''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    if(!d.exists())d.mkdirs();'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    File f2=new File(d,fn);'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    FileOutputStream fs=new FileOutputStream(f2);''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    fs.write(b); fs.close();'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    sendBroadcast(new android.content.Intent(android.content.Intent.ACTION_MEDIA_SCANNER_SCAN_FILE,Uri.fromFile(f2)));''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                    return "OK:"+f2.getAbsolutePath();'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''                }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''            } catch(Exception e){return "ERROR:"+e.getMessage();}''
        >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        @JavascriptInterface'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''        public void exitApp(){ finishAffinity(); }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''    }'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo ''}'' >> "android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        echo "Done: $(wc -l < "android/app/src/main/java/ro/rophotokml/app/MainActivity.java")
        lines"'
    - name: Add permissions
      run: 'M="android/app/src/main/AndroidManifest.xml"

        sed -i ''s|</manifest>|    <uses-permission android:name=\"android.permission.CAMERA\"
        />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"
        />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"
        />\n    <uses-permission android:name=\"android.permission.HIGH_SAMPLING_RATE_SENSORS\"
        />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"
        android:maxSdkVersion=\"29\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"
        android:maxSdkVersion=\"32\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"
        />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"
        />\n    <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"true\"
        />\n</manifest>|'' "$M"'
    - name: Build APK
      run: 'cd android

        chmod +x gradlew

        ./gradlew assembleDebug --no-daemon'
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ROPhotoKml-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
