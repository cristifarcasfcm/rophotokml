name: Build ROPhotoKml APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create www directory and copy web asset
        run: mkdir -p www && cp index.html www/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate custom icons and copy MainActivity & icon assets
        run: |
          if [ -f "generate_icons.py" ]; then
            python3 generate_icons.py
            echo "Icons generated OK"
          fi
          if [ -f "write_main.py" ]; then
            python3 write_main.py
          else
            mkdir -p android/app/src/main/java/ro/rophotokml/app
            cp MainActivity.java android/app/src/main/java/ro/rophotokml/app/MainActivity.java
            echo "MainActivity copied OK via cp"
          fi

      - name: Update AndroidManifest permissions and intent-filters
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="true" />\n</manifest>|' "$M"
          sed -i 's|</activity>|        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <data android:mimeType="application/vnd.google-earth.kml+xml" />\n        </intent-filter>\n        <intent-filter>\n            <action android:name="android.intent.action.VIEW" />\n            <category android:name="android.intent.category.DEFAULT" />\n            <data android:scheme="content" android:host="*" android:pathPattern=".*\\\\.kml" />\n        </intent-filter>\n</activity>|' "$M"

      - name: Build APK with Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROPhotoKml-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
