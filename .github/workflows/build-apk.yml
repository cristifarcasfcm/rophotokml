name: Build ROPhotoKml APK
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Create www folder
      run: mkdir -p www && cp index.html www/index.html
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli@6
    - name: Add Android platform
      run: npx cap add android
    - name: Sync Capacitor
      run: npx cap sync android
    - name: Write MainActivity
      run: "python3 -c \"\nimport os\nlines = [\n    'package ro.rophotokml.app;',\n\
        \    '',\n    'import android.os.Bundle;',\n    'import android.os.Build;',\n\
        \    'import android.webkit.JavascriptInterface;',\n    'import android.webkit.WebView;',\n\
        \    'import android.content.ContentValues;',\n    'import android.content.ContentResolver;',\n\
        \    'import android.net.Uri;',\n    'import android.provider.MediaStore;',\n\
        \    'import android.util.Base64;',\n    'import java.io.OutputStream;',\n\
        \    'import java.io.File;',\n    'import java.io.FileOutputStream;',\n  \
        \  '',\n    'import com.getcapacitor.BridgeActivity;',\n    '',\n    'public\
        \ class MainActivity extends BridgeActivity {',\n    '',\n    '    @Override',\n\
        \    '    public void onCreate(Bundle savedInstanceState) {',\n    '     \
        \   super.onCreate(savedInstanceState);',\n    '        getBridge().getWebView().addJavascriptInterface(new\
        \ NativeBridge(), \"AndroidApp\");',\n    '    }',\n    '',\n    '    @Override',\n\
        \    '    public void onBackPressed() {',\n    '        WebView webView =\
        \ getBridge().getWebView();',\n    '        webView.evaluateJavascript(',\n\
        \    '            \"(function(){ if(typeof window.onAndroidBack===\\'function\\\
        '){ window.onAndroidBack(); return \\'handled\\'; } return \\'unhandled\\\
        '; })()\",',\n    '            value -> {',\n    '                if (!\"\\\
        'handled\\'\".equals(value) && !\"handled\".equals(value)) {',\n    '    \
        \                runOnUiThread(() -> MainActivity.super.onBackPressed());',\n\
        \    '                }',\n    '            }',\n    '        );',\n    '\
        \    }',\n    '',\n    '    public class NativeBridge {',\n    '',\n    '\
        \        @JavascriptInterface',\n    '        public String savePhoto(String\
        \ base64Data, String filename) {',\n    '            try {',\n    '      \
        \          byte[] imageBytes = Base64.decode(base64Data, Base64.DEFAULT);',\n\
        \    '                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)\
        \ {',\n    '                    ContentResolver resolver = getContentResolver();',\n\
        \    '                    ContentValues values = new ContentValues();',\n\
        \    '                    values.put(MediaStore.Images.Media.DISPLAY_NAME,\
        \ filename);',\n    '                    values.put(MediaStore.Images.Media.MIME_TYPE,\
        \ \"image/jpeg\");',\n    '                    values.put(MediaStore.Images.Media.RELATIVE_PATH,\
        \ \"DCIM/ROPhotoKml\");',\n    '                    values.put(MediaStore.Images.Media.IS_PENDING,\
        \ 1);',\n    '                    Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,\
        \ values);',\n    '                    if (uri == null) return \"ERROR:insert\
        \ failed\";',\n    '                    try (OutputStream out = resolver.openOutputStream(uri))\
        \ { out.write(imageBytes); }',\n    '                    values.clear();',\n\
        \    '                    values.put(MediaStore.Images.Media.IS_PENDING, 0);',\n\
        \    '                    resolver.update(uri, values, null, null);',\n  \
        \  '                    return \"OK:\" + uri.toString();',\n    '        \
        \        } else {',\n    '                    File dir = new File(android.os.Environment.getExternalStorageDirectory(),\
        \ \"DCIM/ROPhotoKml\");',\n    '                    if (!dir.exists()) dir.mkdirs();',\n\
        \    '                    File file = new File(dir, filename);',\n    '  \
        \                  FileOutputStream fos = new FileOutputStream(file);',\n\
        \    '                    fos.write(imageBytes); fos.close();',\n    '   \
        \                 sendBroadcast(new android.content.Intent(android.content.Intent.ACTION_MEDIA_SCANNER_SCAN_FILE,\
        \ Uri.fromFile(file)));',\n    '                    return \"OK:\" + file.getAbsolutePath();',\n\
        \    '                }',\n    '            } catch (Exception e) { return\
        \ \"ERROR:\" + e.getMessage(); }',\n    '        }',\n    '',\n    '     \
        \   @JavascriptInterface',\n    '        public void exitApp() { finishAffinity();\
        \ }',\n    '    }',\n    '}',\n]\nma = 'android/app/src/main/java/ro/rophotokml/app/MainActivity.java'\n\
        os.makedirs(os.path.dirname(ma), exist_ok=True)\nopen(ma, 'w').write('\\n'.join(lines)\
        \ + '\\n')\nprint('MainActivity written')\n\""
    - name: Add permissions to AndroidManifest
      run: 'M="android/app/src/main/AndroidManifest.xml"

        sed -i ''s|</manifest>|    <uses-permission android:name=\"android.permission.CAMERA\"
        />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"
        />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"
        />\n    <uses-permission android:name=\"android.permission.HIGH_SAMPLING_RATE_SENSORS\"
        />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"
        android:maxSdkVersion=\"29\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"
        android:maxSdkVersion=\"32\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"
        />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"
        />\n    <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"true\"
        />\n</manifest>|'' "$M"'
    - name: Build APK debug
      run: 'cd android

        chmod +x gradlew

        ./gradlew assembleDebug --no-daemon'
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ROPhotoKml-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
