name: Build ROPhotoKml APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create www folder
        run: mkdir -p www && cp index.html www/index.html

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Register Media plugin in MainActivity
        run: |
          MA="android/app/src/main/java/ro/rophotokml/app/MainActivity.java"
          cat > "$MA" << 'JAVA'
          package ro.rophotokml.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.capacitorjs.plugins.filesystem.FilesystemPlugin;
          import com.capacitorcommunityplugins.media.MediaPlugin;
          import java.util.ArrayList;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(FilesystemPlugin.class);
              registerPlugin(MediaPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

      - name: Add permissions to AndroidManifest
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="true" />\n    <uses-feature android:name="android.hardware.sensor.compass" android:required="false" />\n</manifest>|' "$M"

      - name: Build APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROPhotoKml-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
