name: Build ROPhotoKml APK
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    - name: Create www folder
      run: mkdir -p www && cp index.html www/index.html
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Install Capacitor CLI
      run: npm install -g @capacitor/cli@6
    - name: Add Android platform
      run: npx cap add android
    - name: Sync Capacitor
      run: npx cap sync android
    - name: Write MainActivity with JavascriptInterface
      run: 'MA="android/app/src/main/java/ro/rophotokml/app/MainActivity.java"

        printf ''package ro.rophotokml.app;\n\nimport android.os.Bundle;\nimport android.os.Build;\nimport
        android.webkit.JavascriptInterface;\nimport android.content.ContentValues;\nimport
        android.content.ContentResolver;\nimport android.net.Uri;\nimport android.provider.MediaStore;\nimport
        android.util.Base64;\nimport java.io.OutputStream;\nimport java.io.File;\nimport
        java.io.FileOutputStream;\n\nimport com.getcapacitor.BridgeActivity;\n\npublic
        class MainActivity extends BridgeActivity {\n    @Override\n    public void
        onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        getBridge().getWebView().addJavascriptInterface(new
        PhotoSaver(), "AndroidPhotoSaver");\n    }\n\n    public class PhotoSaver
        {\n        @JavascriptInterface\n        public String savePhoto(String base64Data,
        String filename) {\n            try {\n                byte[] imageBytes =
        Base64.decode(base64Data, Base64.DEFAULT);\n                if (Build.VERSION.SDK_INT
        >= Build.VERSION_CODES.Q) {\n                    ContentResolver resolver
        = getContentResolver();\n                    ContentValues values = new ContentValues();\n                    values.put(MediaStore.Images.Media.DISPLAY_NAME,
        filename);\n                    values.put(MediaStore.Images.Media.MIME_TYPE,
        "image/jpeg");\n                    values.put(MediaStore.Images.Media.RELATIVE_PATH,
        "DCIM/ROPhotoKml");\n                    values.put(MediaStore.Images.Media.IS_PENDING,
        1);\n                    Uri uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
        values);\n                    if (uri == null) return "ERROR:MediaStore insert
        failed";\n                    try (OutputStream out = resolver.openOutputStream(uri))
        {\n                        out.write(imageBytes);\n                    }\n                    values.clear();\n                    values.put(MediaStore.Images.Media.IS_PENDING,
        0);\n                    resolver.update(uri, values, null, null);\n                    return
        "OK:" + uri.toString();\n                } else {\n                    File
        dir = new File(android.os.Environment.getExternalStorageDirectory(), "DCIM/ROPhotoKml");\n                    if
        (!dir.exists()) dir.mkdirs();\n                    File file = new File(dir,
        filename);\n                    FileOutputStream fos = new FileOutputStream(file);\n                    fos.write(imageBytes);\n                    fos.close();\n                    sendBroadcast(new
        android.content.Intent(\n                        android.content.Intent.ACTION_MEDIA_SCANNER_SCAN_FILE,\n                        Uri.fromFile(file)));\n                    return
        "OK:" + file.getAbsolutePath();\n                }\n            } catch (Exception
        e) {\n                return "ERROR:" + e.getMessage();\n            }\n        }\n    }\n}\n''
        > "$MA"

        echo ''MainActivity written'''
    - name: Add permissions to AndroidManifest
      run: 'M="android/app/src/main/AndroidManifest.xml"

        sed -i ''s|</manifest>|    <uses-permission android:name=\"android.permission.CAMERA\"
        />\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"
        />\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"
        />\n    <uses-permission android:name=\"android.permission.HIGH_SAMPLING_RATE_SENSORS\"
        />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"
        android:maxSdkVersion=\"29\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"
        android:maxSdkVersion=\"32\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"
        />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\"
        />\n    <uses-feature android:name=\"android.hardware.location.gps\" android:required=\"true\"
        />\n    <uses-feature android:name=\"android.hardware.sensor.compass\" android:required=\"false\"
        />\n</manifest>|'' "$M"'
    - name: Build APK debug
      run: 'cd android

        chmod +x gradlew

        ./gradlew assembleDebug --no-daemon'
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ROPhotoKml-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
