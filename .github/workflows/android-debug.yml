name: Android - APK debug (test)

on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']
    paths-ignore: ['ios/**', 'store/**', 'docs/**', '*.md']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run sync:android
      - name: Build APK debug
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > "$RUNNER_TEMP/build.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            esc() { sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}'; }
            echo "::error title=Gradle what went wrong::$(grep -m1 -A25 'What went wrong' "$RUNNER_TEMP/build.log" | esc)"
            echo "::error title=Gradle errors::$(grep -E 'error:|FAILURE|Could not|not found|Unsupported|cannot find' "$RUNNER_TEMP/build.log" | head -30 | esc)"
            echo "::error title=Gradle tail::$(tail -40 "$RUNNER_TEMP/build.log" | esc)"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ROPhotoKml-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
