<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ROPhotoKml</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--g:#22c55e;--glow:rgba(34,197,94,.35);--a:#f59e0b;--r:#ef4444;--surf:rgba(8,18,8,.92);--bord:rgba(34,197,94,.22);--txt:#e8f5e8;--muted:#4a7a4a;--mono:'Courier New',monospace}
html,body{height:100%;overflow:hidden;background:#0d1a0d;color:var(--txt);font-family:system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:#1a2d1a!important}
.leaflet-control-zoom{display:none!important}

/* TOP BAR */
#top{position:fixed;top:0;left:52px;right:0;z-index:300;padding:6px 8px;
  display:flex;align-items:center;gap:6px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.88) 70%,transparent)}
#top>*{pointer-events:auto}
.logo{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--g);letter-spacing:.1em;flex-shrink:0}
#sb{flex:1;min-width:0;padding:5px 10px;border-radius:20px;border:1px solid var(--bord);background:rgba(0,0,0,.65);color:var(--txt);font-size:11px;outline:none;font-family:var(--mono)}
#sb::placeholder{color:var(--muted)}
#filter-sel{background:rgba(0,0,0,.6);border:1px solid var(--bord);color:var(--txt);font-family:var(--mono);font-size:10px;padding:4px 6px;border-radius:8px;outline:none;cursor:pointer;flex-shrink:0}
#pbg{flex-shrink:0;background:rgba(34,197,94,.12);border:1px solid var(--bord);color:var(--g);font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;white-space:nowrap;display:none}
#sdrop{position:fixed;top:42px;left:56px;right:8px;z-index:500;background:rgba(8,18,8,.97);border:1px solid var(--bord);border-radius:10px;max-height:180px;overflow-y:auto;display:none}
.si{padding:8px 12px;font-family:var(--mono);font-size:11px;cursor:pointer;border-bottom:1px solid rgba(34,197,94,.08);color:var(--txt)}
.si:active{background:rgba(34,197,94,.15);color:var(--g)}

/* SIDEBAR */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:50px;z-index:300;display:flex;flex-direction:column;align-items:center;padding:6px 0 12px;gap:3px;background:linear-gradient(to right,rgba(0,0,0,.82) 55%,transparent)}
.sb{width:40px;height:40px;border-radius:10px;border:1px solid var(--bord);background:var(--surf);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s;flex-shrink:0}
.sb:active{transform:scale(.91)}
.sb.on{border-color:var(--g);background:rgba(34,197,94,.18);color:var(--g);box-shadow:0 0 10px var(--glow)}
.sb.wb{border-color:var(--a)}.sb.wb.on{background:rgba(245,158,11,.18);color:var(--a)}
.sb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;pointer-events:none}
.sl{font-size:6.5px;color:var(--muted);font-family:var(--mono);text-align:center;line-height:1}
.sb.on .sl{color:var(--g)}.sb.wb.on .sl{color:var(--a)}
.sp{flex:1}

/* BOTTOM BAR */
#bot{position:fixed;bottom:0;left:50px;right:0;z-index:300;padding:6px 10px 18px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.94) 70%,transparent)}
#bot>*{pointer-events:auto}
#pills{display:flex;gap:4px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pl{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);color:var(--muted);white-space:nowrap;flex-shrink:0}
.pl.on{border-color:var(--g);color:var(--g)}.pl.wn{border-color:var(--a);color:var(--a)}

/* PCHIP - camp selector */
#pchip{display:none;background:rgba(0,0,0,.75);border:1px solid var(--bord);border-radius:8px;padding:6px 8px;margin-bottom:5px}
#pchip.show{display:block}
#pcid{font-family:var(--mono);font-size:11px;font-weight:700;color:#FAC775;margin-bottom:2px}
#pcmt{font-size:9px;color:var(--muted)}
.pcfrow{display:flex;align-items:center;gap:4px;margin-top:4px}
.pcflbl{font-size:9px;color:var(--g);white-space:nowrap;font-family:var(--mono);font-weight:600;min-width:44px}
.pcfsel{flex:1;background:rgba(0,0,0,.6);border:1px solid var(--g);color:var(--txt);font-family:var(--mono);font-size:11px;padding:4px 6px;border-radius:6px;outline:none;cursor:pointer}

/* BOTTOM ACTIONS ROW */
#arow{display:flex;align-items:center;gap:8px}
#linfo{flex:1;font-family:var(--mono);font-size:8.5px;color:var(--muted);line-height:1.8}
#linfo .lv{color:var(--txt)}
#sht{width:54px;height:54px;border-radius:50%;flex-shrink:0;border:3px solid #555;background:rgba(60,60,60,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s;position:relative}
#sht.rdy{border-color:var(--g);background:rgba(34,197,94,.22);box-shadow:0 0 20px var(--glow)}
#sht.rdy::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--g);animation:rp 1.6s infinite;opacity:.5}
@keyframes rp{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:0}}
#sdot{width:20px;height:20px;border-radius:50%;background:#666;transition:background .3s}
#sht.rdy #sdot{background:var(--g)}
#sht:disabled{opacity:.25;cursor:default}
#gbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--bord);background:var(--surf);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
#gbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
#gbtn span{font-size:7px;font-family:var(--mono);color:var(--muted)}
#prox{position:fixed;right:8px;bottom:92px;z-index:250;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid #444;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:#666;text-align:center;line-height:1.3;transition:all .4s;pointer-events:none;white-space:pre-line}
#prox.near{border-color:var(--g);color:var(--g);box-shadow:0 0 14px var(--glow)}

/* ═══════════════════════════════════
   PARCEL POPUP  — apare la tap parcel
   ═══════════════════════════════════ */
#pp-ov{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6)}
#pp-ov.on{display:block}
#pp-box{display:none;position:fixed;bottom:0;left:0;right:0;z-index:2001;
  background:#061206;border-top:2px solid var(--g);
  border-radius:18px 18px 0 0;padding:14px 14px 32px;
  box-shadow:0 -8px 30px rgba(0,0,0,.8)}
#pp-box.on{display:block}
#pp-name{font-family:var(--mono);font-size:13px;font-weight:700;color:#FAC775;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bord);
  display:flex;align-items:center;justify-content:space-between}
#pp-name button{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0 2px}
#pp-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ppb{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:14px 6px;border-radius:12px;cursor:pointer;border:2px solid;
  font-size:11px;font-family:system-ui;transition:all .15s;min-height:70px;background:transparent}
.ppb:active{transform:scale(.93)}
.ppb span:first-child{font-size:24px;line-height:1}
.ppb-attr{border-color:rgba(99,179,237,.6);color:#93c5fd}
.ppb-done{border-color:rgba(34,197,94,.5);color:var(--g)}
.ppb-done.fin{background:rgba(34,197,94,.2);border-color:var(--g);color:#fff;font-weight:700}
.ppb-del{border-color:rgba(239,68,68,.5);color:#fca5a5}

/* ═══════════════════════════════════
   ATTR WINDOW
   ═══════════════════════════════════ */
#aw-ov{display:none;position:fixed;inset:0;z-index:3499;background:rgba(0,0,0,.7)}
#aw-ov.on{display:block}
#aw-box{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3500;width:92%;max-width:370px;max-height:80vh;
  background:#061206;border:1px solid var(--bord);border-radius:14px;
  overflow:hidden;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.9)}
#aw-box.on{display:flex}
#aw-hd{background:rgba(34,197,94,.1);border-bottom:1px solid var(--bord);
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#aw-ti{font-family:var(--mono);font-size:12px;font-weight:700;color:#FAC775}
#aw-hd button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
#aw-bd{flex:1;overflow-y:auto;padding:4px 0}
.awr{display:flex;gap:6px;padding:6px 14px;border-bottom:1px solid rgba(34,197,94,.07);font-size:11px}
.awr:last-child{border-bottom:none}
.awk{font-family:var(--mono);color:var(--muted);min-width:85px;flex-shrink:0;font-size:10px}
.awv{font-family:var(--mono);color:var(--txt);word-break:break-all}
#aw-ft{padding:10px 12px;border-top:1px solid var(--bord);display:flex;gap:8px;flex-shrink:0}
#aw-ft button{flex:1;padding:9px;border-radius:8px;font-size:12px;font-family:var(--mono);cursor:pointer}
.aw-ok{background:rgba(34,197,94,.15);border:1px solid var(--g);color:var(--g)}
.aw-cl{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);color:var(--muted)}

/* ═══════════════════════════════════
   EXIT DIALOG
   ═══════════════════════════════════ */
#ex-ov{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.7)}
#ex-ov.on{display:block}
#ex-box{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3001;background:#061206;border:1px solid rgba(239,68,68,.4);
  border-radius:14px;padding:24px 20px;width:84%;max-width:290px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.9)}
#ex-box.on{display:block}
#ex-box .icon{font-size:36px;margin-bottom:10px}
#ex-box p{font-family:var(--mono);font-size:13px;color:var(--txt);margin-bottom:18px;line-height:1.6}
#ex-box .yes{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:9px;
  border:1px solid var(--r);background:rgba(239,68,68,.15);color:#fca5a5;
  font-size:13px;cursor:pointer;font-family:var(--mono);font-weight:700}
#ex-box .no{display:block;width:100%;padding:11px;border-radius:9px;
  border:1px solid var(--bord);background:rgba(34,197,94,.1);color:var(--g);
  font-size:13px;cursor:pointer;font-family:var(--mono)}

/* CAMERA */
#camo{position:fixed;inset:0;z-index:700;background:#000;display:none;flex-direction:column}
#camo.show{display:flex}
#vwr{position:relative;flex:1;overflow:hidden;background:#000}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#vst{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.5);padding:8px 11px;
  font-family:var(--mono);font-size:11px;line-height:1.75;color:#fff;
  border-top:3px solid #185FA5;pointer-events:none}
#vst .vi{font-size:13px;font-weight:700;color:#FAC775}
#bcc{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);color:#fff;
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
#zoom-slider-wrap{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10}
#zoom-val{font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.6);
  padding:2px 6px;border-radius:8px;min-width:32px;text-align:center}
#zoom-slider{-webkit-appearance:slider-vertical;appearance:slider-vertical;
  writing-mode:vertical-lr;direction:rtl;width:28px;height:160px;
  accent-color:var(--g);cursor:pointer;background:transparent}
#csr{padding:11px 16px 24px;background:#000;display:flex;justify-content:center}
#csb{width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:#185FA5;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 22px rgba(24,95,165,.5);transition:transform .1s}
#csb:active{transform:scale(.91)}
#csd{width:24px;height:24px;border-radius:50%;background:#fff}
canvas{display:none}

/* PREVIEW */
#prevo{position:fixed;inset:0;z-index:800;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#prevo.show{display:flex}
#pimg{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain}
#pact{position:absolute;bottom:26px;display:flex;gap:28px;align-items:center}
.cb{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .15s}
.cb:active{transform:scale(.9)}
.cb.ok{background:#15803d;border:2px solid #22c55e}
.cb.no{background:#991b1b;border:2px solid #ef4444}
.cb svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.5;pointer-events:none}
.cb span{font-size:8px;color:#fff;font-family:var(--mono)}

/* GALLERY */
#galo{position:fixed;inset:0;z-index:850;background:rgba(0,0,0,.97);display:none;flex-direction:column}
#galo.show{display:flex}
#galh{padding:10px 12px;background:rgba(8,18,8,.98);border-bottom:1px solid var(--bord);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#galh h2{font-family:var(--mono);font-size:12px;color:var(--g)}
#galh button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
#galg{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}
.gt{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--bord)}
.gt img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.gt .gd{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(153,27,27,.92);border:none;color:#fff;font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:2}

/* FULL VIEW */
#fullview{position:fixed;inset:0;z-index:900;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#fullview.show{display:flex}
#fullimg{max-width:100%;max-height:100vh;object-fit:contain}
#fvclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.4);color:#fff;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fvname{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);
  background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;
  white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

/* KML MANAGER */
#km-ov{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6)}
#km-ov.on{display:block}
#km-box{display:none;position:fixed;bottom:0;left:0;right:0;z-index:601;
  background:#061206;border-top:2px solid var(--bord);
  border-radius:16px 16px 0 0;max-height:75vh;flex-direction:column;
  box-shadow:0 -4px 20px rgba(0,0,0,.5)}
#km-box.on{display:flex}
#km-hd{padding:12px 14px;border-bottom:1px solid var(--bord);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#km-hd h2{font-family:var(--mono);font-size:13px;color:var(--g)}
#km-hd button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
#km-bd{flex:1;overflow-y:auto;padding:10px 12px}
#km-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.kmi{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--bord);background:rgba(34,197,94,.04);cursor:pointer}
.kmi.act{border-color:var(--g);background:rgba(34,197,94,.12)}
.kmi-inf{flex:1;min-width:0}
.kmi-nm{font-family:var(--mono);font-size:12px;color:var(--g);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kmi-st{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.kmi-act{display:flex;gap:4px;align-items:center;flex-shrink:0}
.kmi-eye{width:28px;height:28px;border-radius:50%;background:rgba(34,197,94,.1);border:1px solid var(--bord);color:var(--g);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kmi-eye.off{color:var(--muted);background:rgba(0,0,0,.2)}
.kmi-del{width:28px;height:28px;border-radius:50%;background:rgba(153,27,27,.3);border:1px solid rgba(239,68,68,.3);color:#ef4444;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.km-add{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;border:1px dashed var(--bord);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;width:100%;justify-content:center}

/* REMAIN POPUP */
#rem-box{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:700;background:#061206;border:1px solid var(--bord);border-radius:14px;
  padding:20px 22px;text-align:center;width:80%;max-width:300px;
  box-shadow:0 8px 32px rgba(0,0,0,.7)}
#rem-box.on{display:block}
#rem-box .ri{font-size:32px;margin-bottom:8px}
#rem-box p{font-family:var(--mono);font-size:13px;color:var(--txt);margin-bottom:14px;line-height:1.6}
#rem-box button{padding:8px 20px;border-radius:8px;border:1px solid var(--g);background:rgba(34,197,94,.15);color:var(--g);font-size:13px;cursor:pointer;font-family:var(--mono)}

/* EXPORT */
/* SPLASH */
#splash{position:fixed;inset:0;z-index:5000;background:#0d1a0d;display:flex;flex-direction:column;align-items:center;justify-content:center}
#spl-lens{position:relative;width:120px;height:120px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
#spl-r1{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(34,197,94,.15)}
#spl-r2{position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(34,197,94,.25)}
#spl-r3{position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(34,197,94,.35);background:radial-gradient(circle,rgba(34,197,94,.1) 0%,rgba(0,0,0,.5) 100%)}
#spl-bw{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:rgba(34,197,94,.15);border-radius:2px;overflow:hidden}
#spl-bar{height:100%;width:0%;background:var(--g);border-radius:2px;box-shadow:0 0 8px var(--glow);transition:width .05s linear}
#spl-pct{position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--g)}
#spl-ti{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--g);letter-spacing:.15em;text-shadow:0 0 20px var(--glow);margin-bottom:6px}
#spl-su{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:40px}

/* PROGRESS / TOAST */
#prog{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#prog.show{display:flex}
#prog p{font-family:var(--mono);font-size:13px;color:var(--g);text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:3px solid rgba(34,197,94,.2);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tst{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:4100;font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;white-space:nowrap;display:none;pointer-events:none;max-width:90%;text-align:center}
#tst.ok{background:rgba(21,128,61,.94);border:1px solid var(--g);color:#d1fae5}
#tst.wn{background:rgba(146,64,14,.94);border:1px solid var(--a);color:#fef3c7}
#tst.er{background:rgba(153,27,27,.94);border:1px solid var(--r);color:#fee2e2}
</style>
</head>
<body>

<div id="map"></div>

<div id="top">
  <span class="logo">ROPhotoKml</span>
  <input id="sb" type="text" placeholder="Cauta parcela..." oninput="onSrch(this.value)" autocomplete="off">
  <select id="filter-sel" onchange="onFilter()">
    <option value="all">Toate</option>
    <option value="done">✓ Finalizate</option>
    <option value="todo">○ Nefinalizate</option>
  </select>
  <span id="pbg" style="display:none">0 foto</span>
</div>
<div id="sdrop"></div>

<div id="sidebar">
  <button class="sb" onclick="openKM()"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/></svg><span class="sl">KML</span></button>
  <button class="sb" id="bgps" onclick="startGPS()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span class="sl">GPS</span></button>
  <button class="sb" id="bcomp" onclick="startCompass()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="12,2 14,9 12,12 10,9"/><polygon points="12,22 14,15 12,12 10,15" opacity=".3"/></svg><span class="sl">Busola</span></button>
  <button class="sb" id="bcam" onclick="toggleCam()"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="sl">Camera</span></button>
  <button class="sb wb on" id="bbuf" onclick="toggleBuf()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span class="sl">Buffer</span></button>

  <div class="sp"></div>
  <button class="sb" onclick="centerMap()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg><span class="sl">Centru</span></button>
  <button class="sb" id="blyr" onclick="toggleLayer()"><svg viewBox="0 0 24 24"><polygon points="12,2 22,8.5 12,15 2,8.5"/><polyline points="2,15.5 12,22 22,15.5" opacity=".4"/></svg><span class="sl">Strat</span></button>
</div>

<div id="bot">
  <div id="pills">
    <span class="pl" id="pgps">GPS: —</span>
    <span class="pl" id="pacc">Acc: —</span>
    <span class="pl" id="palt">Alt: —</span>
    <span class="pl" id="pdir">Dir: —</span>
    <span class="pl" id="ptim">—</span>
  </div>
  <div id="pchip">
    <div id="pcid">—</div>
    <div id="pcmt"></div>
    <div class="pcfrow" id="pfrow1" style="display:none">
      <span class="pcflbl">Camp 1:</span>
      <select class="pcfsel" id="pcfs1" onchange="onFC1()"></select>
    </div>
    <div class="pcfrow" id="pfrow2" style="display:none">
      <span class="pcflbl">Camp 2:</span>
      <select class="pcfsel" id="pcfs2" onchange="onFC2()"></select>
    </div>
  </div>
  <div id="arow">
    <div id="linfo">
      <span>Lat: <span class="lv" id="llat">—</span></span>
      <span>Lon: <span class="lv" id="llon">—</span></span>
      <span>Acc: <span class="lv" id="lacc">—</span> Alt: <span class="lv" id="lalt">—</span></span>
      <span>Dir: <span class="lv" id="ldir">—</span></span>
    </div>
    <button id="sht" disabled onclick="openCam()"><div id="sdot"></div></button>
    <button id="gbtn" onclick="openGallery()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg><span>Galerie</span></button>
  </div>
</div>
<div id="prox">—&#10;m</div>

<!-- PARCEL POPUP -->
<div id="pp-ov" onclick="closePP()"></div>
<div id="pp-box">
  <div id="pp-name">
    <span id="pp-ti">Parcela</span>
    <button onclick="closePP()">✕</button>
  </div>
  <div id="pp-btns">
    <button class="ppb ppb-attr" onclick="openAW()">
      <span>☰</span><span>Atribute</span>
    </button>
    <button class="ppb ppb-done" id="ppb-done" onclick="toggleDone()">
      <span id="ppb-done-ic">○</span><span id="ppb-done-tx">Finalizat</span>
    </button>
    <button class="ppb ppb-del" onclick="deleteParcel()">
      <span>🗑</span><span>Sterge</span>
    </button>
  </div>
</div>

<!-- ATTR WINDOW -->
<div id="aw-ov" onclick="closeAW()"></div>
<div id="aw-box">
  <div id="aw-hd">
    <span id="aw-ti">Atribute</span>
    <button onclick="closeAW()">✕</button>
  </div>
  <div id="aw-bd"></div>
  <div id="aw-ft">
    <button class="aw-ok" onclick="closeAW();openCam()">📷 Fotografiaza</button>
    <button class="aw-cl" onclick="closeAW()">Inchide</button>
  </div>
</div>

<!-- EXIT DIALOG -->
<div id="ex-ov"></div>
<div id="ex-box">
  <div class="icon">🚪</div>
  <p>Doriti sa iesiti din aplicatie?</p>
  <button class="yes" onclick="confirmExit()">Da, iesire</button>
  <button class="no" onclick="closeExit()">Ramane in aplicatie</button>
</div>

<!-- KML MANAGER -->
<div id="km-ov" onclick="closeKM()"></div>
<div id="km-box">
  <div id="km-hd"><h2>Fisiere KML</h2><button onclick="closeKM()">✕</button></div>
  <div id="km-bd">
    <div id="km-list"></div>
    <label class="km-add" for="kf">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adauga KML
    </label>
    <input type="file" id="kf" accept=".kml" onchange="addKML(this)" multiple style="display:none">
  </div>
</div>

<!-- REMAIN -->
<div id="rem-box">
  <div class="ri" id="rem-ic">📋</div>
  <p id="rem-tx"></p>
  <button onclick="document.getElementById('rem-box').classList.remove('on')">OK</button>
</div>

<!-- CAMERA -->
<div id="camo">
  <div id="vwr">
    <video id="vid" autoplay playsinline muted></video>
    <div id="vst">
      <div class="vi" id="vsi">—</div>
      <div id="vsc">—</div><div id="vsa">—</div><div id="vsd">—</div>
    </div>
    <button id="bcc" onclick="closeCam()">✕</button>
    <div id="zoom-slider-wrap">
      <span id="zoom-val">1×</span>
      <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1" oninput="onZoom(this.value)" orient="vertical">
    </div>
  </div>
  <div id="csr"><button id="csb" onclick="doCapture()"><div id="csd"></div></button></div>
  <canvas id="cnv"></canvas>
</div>

<!-- PREVIEW -->
<div id="prevo">
  <img id="pimg" alt="Preview">
  <div id="pact">
    <button class="cb no" onclick="discardP()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Renunta</span></button>
    <button class="cb ok" onclick="saveP()"><svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg><span>Salveaza</span></button>
  </div>
</div>

<!-- GALLERY -->
<div id="galo">
  <div id="galh"><h2>Galerie sesiune</h2><button onclick="closeGallery()">✕</button></div>
  <div id="galg"></div>
</div>
<div id="fullview">
  <img id="fullimg" alt="">
  <button id="fvclose" onclick="closeFull()">✕</button>
  <div id="fvname"></div>
</div>

<!-- SPLASH -->
<div id="splash">
  <div id="spl-lens">
    <div id="spl-r1"></div><div id="spl-r2"></div><div id="spl-r3"></div>
    <div id="spl-bw"><div id="spl-bar"></div></div>
    <div id="spl-pct">0%</div>
  </div>
  <div id="spl-ti">ROPhotoKml</div>
  <div id="spl-su">GPS · KML · Creat de Cristian Farcas</div>
</div>

<div id="prog"><div class="spin"></div><p id="prog-txt">Se proceseaza...</p></div>
<div id="tst"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
// Prinde orice eroare si nu bloca splash-ul
window.onerror=function(msg,src,line,col,err){
  console.error('App error:',msg,'at',line,col);
  // Forteaza inchiderea splash daca e blocat
  setTimeout(function(){
    var sp=document.getElementById('splash');
    if(sp&&sp.style.display!=='none'){
      sp.style.display='none';
      loadState();
    }
  },5000);
  return false;
};

function handleBack(){
  const layers=[
    ['ex-box','closeExit'],
    ['fullview','closeFull'],
    ['prevo','discardP'],
    ['camo','closeCam'],
    ['galo','closeGallery'],
    ['aw-box','closeAW'],
    ['pp-box','closePP'],
    ['km-box','closeKM'],
  ];
  for(const [id,fn] of layers){
    const el=document.getElementById(id);
    if(el&&(el.classList.contains('on')||el.classList.contains('show'))){
      window[fn]&&window[fn]();
      return;
    }
  }
  showExit();
}

// ── SPLASH ──
let _splashStarted=false;
function runSplash(){
  if(_splashStarted)return;
  _splashStarted=true;
  const bar=document.getElementById('spl-bar'),pct=document.getElementById('spl-pct'),sp=document.getElementById('splash');
  let p=0;
  const iv=setInterval(()=>{
    p+=Math.random()*4+1.5;if(p>=100){p=100;clearInterval(iv);
      bar.style.width='100%';pct.textContent='100%';
      setTimeout(()=>{sp.style.transition='opacity .5s';sp.style.opacity='0';setTimeout(()=>{sp.style.display='none';loadState();},500);},400);}
    bar.style.width=Math.min(p,100)+'%';pct.textContent=Math.round(Math.min(p,100))+'%';
  },50);
}
// In APK Capacitor, folosim ambele evenimente
document.addEventListener('DOMContentLoaded',()=>setTimeout(runSplash,300));

// Deschide KML primit prin Android Intent (tap pe fisier .kml din telefon)
window.openKMLFromIntent = function(fileName, fileContent) {
  try {
    const id='k'+Date.now();
    const name=fileName.replace(/\.kml$/i,'');
    const entry={id,name,xml:fileContent,feats:null,allF:[],doneIds:[],vis:true};
    kmlStore.push(entry);
    parseKMLEntry(entry);
    activateKML(id);
    saveState();
    toast('KML deschis: '+name,'ok');
  } catch(e) {
    toast('Eroare KML: '+e.message,'er');
  }
};

// ── PERSIST ──
function saveState(){
  try{
    localStorage.setItem(LS,JSON.stringify({
      kmlStore:kmlStore.map(k=>({id:k.id,name:k.name,xml:k.xml,vis:k.vis!==false,
        doneIds:(k.feats||[]).filter(f=>f._done).map(f=>fid(f)).filter(Boolean)})),
      activeKmlId
    }));
  }catch(e){}
}
function fid(f){return f['__nm__']||f[Object.keys(f).find(k=>!k.startsWith('_'))]||'';}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(LS)||'{}');
    if(d.kmlStore){
      d.kmlStore.forEach(k=>{
        if(!kmlStore.find(x=>x.id===k.id))
          kmlStore.push({id:k.id,name:k.name,xml:k.xml,vis:k.vis!==false,feats:null,allF:[],doneIds:k.doneIds||[]});
      });
      kmlStore.filter(k=>k.vis!==false).forEach(k=>{parseKMLEntry(k);drawKML(k);});
      if(d.activeKmlId){
        activeKmlId=d.activeKmlId;
        const k=kmlStore.find(x=>x.id===activeKmlId);
        if(k){feats=k.feats||[];kmlName=k.name;allF=k.allF||[];buildFS();}
      }
      if(feats.length)fitAll();
    }
  }catch(e){}
}

function renderKMList(){
  const list=document.getElementById('km-list');list.innerHTML='';

function parseKMLEntry(k){
  if(k.feats)return;
  const doc=new DOMParser().parseFromString(k.xml,'text/xml');
  const parsed=[],fs=new Set();

  // Stiluri
  const styles={},smap={};
  Array.from(doc.getElementsByTagName('Style')).forEach(s=>{
    const id=s.getAttribute('id');if(!id)return;
    const psa=s.getElementsByTagName('PolyStyle'),lsa=s.getElementsByTagName('LineStyle');
    let fc='#22c55e',sc='#22c55e',fo=0.12;
    if(psa.length>0){const ca=psa[0].getElementsByTagName('color');if(ca.length>0){const abgr=ca[0].textContent.trim();if(abgr.length===8){const a=parseInt(abgr.slice(0,2),16)/255,b=abgr.slice(2,4),g=abgr.slice(4,6),rv=abgr.slice(6,8);fc='#'+rv+g+b;fo=Math.min(.6,Math.max(.05,a*.6));}}}
    if(lsa.length>0){const ca=lsa[0].getElementsByTagName('color');if(ca.length>0){const abgr=ca[0].textContent.trim();if(abgr.length===8){const b=abgr.slice(2,4),g=abgr.slice(4,6),rv=abgr.slice(6,8);sc='#'+rv+g+b;}}}
    styles['#'+id]={fc,sc,fo};
  });
  Array.from(doc.getElementsByTagName('StyleMap')).forEach(sm=>{
    const id=sm.getAttribute('id');if(!id)return;
    Array.from(sm.getElementsByTagName('Pair')).forEach(p=>{
      const keys=p.getElementsByTagName('key'),urls=p.getElementsByTagName('styleUrl');
      if(keys.length>0&&keys[0].textContent.trim()==='normal'&&urls.length>0)
        smap['#'+id]=urls[0].textContent.trim();
    });
  });

  Array.from(doc.getElementsByTagName('Placemark')).forEach(pm=>{
    const f={_c:[],_ctr:null,_done:false,_sty:null};

    // ── NUMELE parcelei: incearca <name>, apoi <n> ──
    const nameEls=pm.getElementsByTagName('name');
    const nEls=pm.getElementsByTagName('n');
    let nm='';
    if(nameEls.length>0 && nameEls[0].parentNode===pm){
      nm=nameEls[0].textContent.trim();
    } else if(nEls.length>0 && nEls[0].parentNode===pm){
      nm=nEls[0].textContent.trim();
    }
    if(nm){f['__nm__']=nm;fs.add('__nm__');}

    // ── ATRIBUTE din SimpleData ──
    Array.from(pm.getElementsByTagName('SimpleData')).forEach(sd=>{
      const n=sd.getAttribute('name');
      if(n){f[n]=sd.textContent.trim();fs.add(n);}
    });

    // ── ATRIBUTE din Data/value ──
    Array.from(pm.getElementsByTagName('Data')).forEach(d=>{
      const n=d.getAttribute('name');
      const vs=d.getElementsByTagName('value');
      if(n&&vs.length>0){f[n]=vs[0].textContent.trim();fs.add(n);}
    });

    // ── ATRIBUTE din <description> HTML encodat ──
    // Format: <b>cheie</b>: valoare<br>
    const descEls=pm.getElementsByTagName('description');
    if(descEls.length>0){
      const descHtml=descEls[0].textContent||descEls[0].innerHTML||'';
      if(descHtml.trim()){
        // Decodifica HTML entities si parseaza
        const tmp=document.createElement('div');
        tmp.innerHTML=descHtml;
        const text=tmp.innerHTML;
        // Extrage perechi cheie:valoare din HTML
        const parts=text.split(/<br\s*\/?>/gi);
        parts.forEach(part=>{
          // Sterge tag-urile HTML ramase
          const clean=part.replace(/<[^>]+>/g,'').trim();
          if(!clean)return;
          const colonIdx=clean.indexOf(':');
          if(colonIdx>0){
            const key=clean.slice(0,colonIdx).trim().replace(/\s+/g,'_');
            const val=clean.slice(colonIdx+1).trim();
            if(key&&!f[key]){f[key]=val;fs.add(key);}
          }
        });
        // Salveaza si descrierea bruta
        f['_desc_raw']=descHtml;
      }
    }

    // ── STIL ──
    const sus=pm.getElementsByTagName('styleUrl');
    if(sus.length>0){
      let sid=sus[0].textContent.trim();
      if(smap[sid])sid=smap[sid];
      if(styles[sid])f._sty=styles[sid];
    }

    // ── COORDONATE (suporta si innerBoundaryIs - le ignora, doar outer) ──
    const outerEls=pm.getElementsByTagName('outerBoundaryIs');
    const coordEls=outerEls.length>0
      ? outerEls[0].getElementsByTagName('coordinates')
      : pm.getElementsByTagName('coordinates');
    const cs=[];
    if(coordEls.length>0){
      coordEls[0].textContent.trim().split(/\s+/).forEach(t=>{
        const p=t.split(',');
        if(p.length>=2){
          const lo=parseFloat(p[0]),la=parseFloat(p[1]);
          if(!isNaN(lo)&&!isNaN(la))cs.push([la,lo]);
        }
      });
    }
    f._c=cs;
    if(cs.length){
      const las=cs.map(c=>c[0]),los=cs.map(c=>c[1]);
      f._ctr=[(Math.min(...las)+Math.max(...las))/2,(Math.min(...los)+Math.max(...los))/2];
    }
    if(k.doneIds&&k.doneIds.includes(fid(f)))f._done=true;
    if(f._c.length>=3)parsed.push(f);
  });
  k.feats=parsed;k.allF=Array.from(fs).filter(k=>!k.startsWith('_'));
}

function parseKMLEntry(k){
  if(k.feats)return;
  const doc=new DOMParser().parseFromString(k.xml,'text/xml');
  const parsed=[],fs=new Set();
  // Parse styles
  const styles={};
  Array.from(doc.getElementsByTagName('Style')).forEach(s=>{
    const id=s.getAttribute('id');if(!id)return;
    const psa=s.getElementsByTagName('PolyStyle'),lsa=s.getElementsByTagName('LineStyle');
    let fc='#22c55e',sc='#22c55e',fo=0.12;
    if(psa.length>0){const ca=psa[0].getElementsByTagName('color');if(ca.length>0){const abgr=ca[0].textContent.trim();if(abgr.length===8){const a=parseInt(abgr.slice(0,2),16)/255,b=abgr.slice(2,4),g=abgr.slice(4,6),rv=abgr.slice(6,8);fc='#'+rv+g+b;fo=Math.min(.6,Math.max(.05,a*.6));}}}
    if(lsa.length>0){const ca=lsa[0].getElementsByTagName('color');if(ca.length>0){const abgr=ca[0].textContent.trim();if(abgr.length===8){const b=abgr.slice(2,4),g=abgr.slice(4,6),rv=abgr.slice(6,8);sc='#'+rv+g+b;}}}
    styles['#'+id]={fc,sc,fo};
  });
  const smap={};
  Array.from(doc.getElementsByTagName('StyleMap')).forEach(sm=>{
    const id=sm.getAttribute('id');if(!id)return;
    Array.from(sm.getElementsByTagName('Pair')).forEach(p=>{
      const keys=p.getElementsByTagName('key'),urls=p.getElementsByTagName('styleUrl');
      if(keys.length>0&&keys[0].textContent.trim()==='normal'&&urls.length>0)
        smap['#'+id]=urls[0].textContent.trim();
    });
  });
  // getElementsByTagName ignora namespace - merge cu orice KML
  const pms=doc.getElementsByTagName('Placemark');
  Array.from(pms).forEach(pm=>{
    const f={_c:[],_ctr:null,_done:false,_sty:null};

    // 1. SimpleData (ExtendedData/SchemaData)
    Array.from(pm.getElementsByTagName('SimpleData')).forEach(sd=>{
      const n=sd.getAttribute('name');
      if(n){f[n]=sd.textContent.trim();fs.add(n);}
    });
    // 2. Data (format alternativ ExtendedData)
    Array.from(pm.getElementsByTagName('Data')).forEach(d=>{
      const n=d.getAttribute('name');
      const vs=d.getElementsByTagName('value');
      if(n&&vs.length>0){f[n]=vs[0].textContent.trim();fs.add(n);}
    });
    // 3. Description HTML — format: <b>key</b>: value<br>
    const descs=pm.getElementsByTagName('description');
    if(descs.length>0){
      const raw=descs[0].textContent||descs[0].innerHTML||'';
      // Decode HTML entities si parseaza perechi key: value
      const div=document.createElement('div');
      div.innerHTML=raw;
      const html=div.innerHTML;
      // Extrage perechi <b>key</b>: value<br>
      const re=/<b>([^<]+)<\/b>\s*:\s*([^<]*)/gi;
      let m;
      while((m=re.exec(html))!==null){
        const key=m[1].trim();
        const val=m[2].trim();
        if(key&&!f[key]){f[key]=val;fs.add(key);}
      }
      // Alternativ: text simplu "key: value" pe randuri
      if(Object.keys(f).filter(k=>!k.startsWith('_')).length===0){
        div.querySelectorAll&&div.querySelectorAll('b').forEach(b=>{
          const key=b.textContent.trim();
          let val='';
          let next=b.nextSibling;
          while(next&&next.nodeName!=='B'&&next.nodeName!=='BR'){
            if(next.textContent)val+=next.textContent;
            next=next.nextSibling;
          }
          val=val.replace(/^\s*:\s*/,'').trim();
          if(key&&val&&!f[key]){f[key]=val;fs.add(key);}
        });
      }
    }

    // 4. Name element
    const names=pm.getElementsByTagName('name');
    if(names.length>0&&names[0].parentNode===pm){
      f['__nm__']=names[0].textContent.trim();fs.add('__nm__');
    }
    // 5. StyleUrl
    const sus=pm.getElementsByTagName('styleUrl');
    if(sus.length>0){
      let sid=sus[0].textContent.trim();
      if(smap[sid])sid=smap[sid];
      if(styles[sid])f._sty=styles[sid];
    }
    // 6. Coordinates
    const cs=[];
    Array.from(pm.getElementsByTagName('coordinates')).forEach(c=>{
      c.textContent.trim().split(/\s+/).forEach(t=>{
        const p=t.split(',');
        if(p.length>=2){
          const lo=parseFloat(p[0]),la=parseFloat(p[1]);
          if(!isNaN(lo)&&!isNaN(la))cs.push([la,lo]);
        }
      });
    });
    f._c=cs;
    if(cs.length){
      const las=cs.map(c=>c[0]),los=cs.map(c=>c[1]);
      f._ctr=[(Math.min(...las)+Math.max(...las))/2,(Math.min(...los)+Math.max(...los))/2];
    }
    if(k.doneIds&&k.doneIds.includes(fid(f)))f._done=true;
    parsed.push(f);
  });
  k.feats=parsed;k.allF=Array.from(fs);
}

function buildFS(){

  if(!show)return;
  if(allF.includes('__nm__')){const o=document.createElement('option');o.value='__nm__';o.textContent='Name';s1.appendChild(o);const o2=document.createElement('option');o2.value='__nm__';o2.textContent='Name';s2.appendChild(o2);}

function onFC2(){selField2=document.getElementById('pcfs2').value;}
function lbl(f){const k=selField1;if(!k)return f['__nm__']||'—';return (k==='__nm__'?'':k+': ')+(f[k]||'—');}
function ex(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function drawKML(k){
  if(!k.feats)return;
  // Remove old
  polyL=polyL.filter(pl=>{if(pl._kid===k.id){map.removeLayer(pl.ly);if(pl.mk)map.removeLayer(pl.mk);return false;}return true;});
  if(k.vis===false)return;
  k.feats.forEach((f,i)=>{
    if(f._c.length<3)return;
    const done=f._done,sel=(curF===f);
    const sc=(f._sty&&f._sty.sc)||'#22c55e';
    const fc=(f._sty&&f._sty.fc)||'#22c55e';
    let style;
    if(done){
      style={color:'#22c55e',weight:2,fillColor:'#22c55e',fillOpacity:.35,dashArray:'7,5'};
    }else if(sel){
      style={color:'#f59e0b',weight:3,fillColor:'#f59e0b',fillOpacity:.15,dashArray:null};
    }else{
      style={color:sc,weight:2,fillColor:fc,fillOpacity:.01,dashArray:null};
    }
    const ly=L.polygon(f._c,{...style,interactive:true,bubblingMouseEvents:false});
    ly._feat=f;ly._kid=k.id;
    ly._origStyle={color:sc,weight:2,fillColor:fc,fillOpacity:.01,dashArray:null};
    // CLICK + TOUCH
    ly.on('click',function(e){L.DomEvent.stopPropagation(e);selParcel(f,ly,i);});
    ly.addTo(map);
    let mk=null;
    if(f._ctr){
      const ico=L.divIcon({className:'',iconAnchor:[0,8],html:'<div style="background:rgba(0,0,0,.85);color:#FAC775;font-family:monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none">'+ex(lbl(f))+'</div>'});
      mk=L.marker(f._ctr,{icon:ico,interactive:false}).addTo(map);
    }
    polyL.push({ly,mk,f,i,_kid:k.id});
  });
}

function redrawActive(){

function fitAll(){
  const pts=feats.flatMap(f=>f._c);
  if(pts.length){const las=pts.map(c=>c[0]),los=pts.map(c=>c[1]);map.fitBounds([[Math.min(...las),Math.min(...los)],[Math.max(...las),Math.max(...los)]],{padding:[50,50]});}
}

function selParcel(f,ly,idx){
  // Restore previous
  if(selLy&&selLy!==ly){
    const pf=selLy._feat;
    if(pf&&pf._done){
      selLy.setStyle({color:'#22c55e',weight:2,fillColor:'#22c55e',fillOpacity:.35,dashArray:'7,5'});
    }else{
      const os=selLy._origStyle||{color:'#22c55e',weight:2,fillColor:'#22c55e',fillOpacity:.01};
      selLy.setStyle({...os,dashArray:null});
    }
  }
  curF=f;selLy=ly;ly._feat=f;
  if(!f._done){
    ly.setStyle({color:'#f59e0b',weight:3,fillColor:'#f59e0b',fillOpacity:.15,dashArray:null});
  }
  map.fitBounds(ly.getBounds(),{padding:[40,40],maxZoom:18});
  updChip();updSt();chkProx();
  // DESCHIDE POPUP
  openPP(f);
}

}

function doFinalize(){
  if(!curF)return;

    if(done){selLy.setStyle({color:'#22c55e',weight:2.5,fillColor:'#22c55e',fillOpacity:.35,dashArray:'7,5'});}

  document.getElementById('ppb-done').classList.toggle('fin',done);

}

// ── GEO MATH ──
function hav(la1,lo1,la2,lo2){
  const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function pip(la,lo,cs){
  let ins=false;
  for(let i=0,j=cs.length-1;i<cs.length;j=i++){
    const xi=cs[i][0],yi=cs[i][1],xj=cs[j][0],yj=cs[j][1];
    if((yi>lo)!==(yj>lo)&&la<(xj-xi)*(lo-yi)/(yj-yi)+xi)ins=!ins;
  }
  return ins;
}
function dseg(la,lo,la1,lo1,la2,lo2){
  const dx=la2-la1,dy=lo2-lo1,t=dx||dy?Math.max(0,Math.min(1,((la-la1)*dx+(lo-lo1)*dy)/(dx*dx+dy*dy))):0;
  return hav(la,lo,la1+t*dx,lo1+t*dy);
}
function d2poly(la,lo,cs){
  let d=Infinity;
  for(let i=0,j=cs.length-1;i<cs.length;j=i++)d=Math.min(d,dseg(la,lo,cs[j][0],cs[j][1],cs[i][0],cs[i][1]));
  return pip(la,lo,cs)?0:d;
}

// ── EXIF BUILDER WGS84 COMPLET ──
function buildEXIF(dtStr, lat, lon, alt, hdg){
  // Helper: scrie 2 bytes big-endian
  function w2(v){return [v>>8&0xFF, v&0xFF];}
  // Helper: scrie 4 bytes big-endian
  function w4(v){return [v>>24&0xFF, v>>16&0xFF, v>>8&0xFF, v&0xFF];}
  // Helper: rational (doua uint32)
  function rat(n,d){return [...w4(Math.round(n)), ...w4(Math.round(d))];}
  // Helper: GPS rational din grade decimale
  function gpsRat(deg){
    const d=Math.floor(Math.abs(deg));
    const m=Math.floor((Math.abs(deg)-d)*60);
    const s=((Math.abs(deg)-d)*60-m)*60;
    return [...rat(d,1), ...rat(m,1), ...rat(Math.round(s*1000),1000)];
  }
  // Helper: IFD entry (12 bytes)
  function ifdEntry(tag,type,count,valOrOff){
    return [...w2(tag), ...w2(type), ...w4(count), ...w4(valOrOff)];
  }
  // Helper: ASCII string ca bytes
  function ascii(s){
    const b=[];for(let i=0;i<s.length;i++)b.push(s.charCodeAt(i)&0xFF);b.push(0);
    return b;
  }

  // Layout offset-uri (relative la inceputul TIFF header)
  // TIFF header: 8 bytes
  // IFD0: 2 + 6*12 + 4 = 78 bytes  (6 entries + next IFD ptr)
  // GPS IFD: la offset 86
  const TIFF_START = 0;
  const IFD0_START = 8;
  const IFD0_ENTRIES = 4; // DateTimeOriginal, Make, GPS IFD pointer, ExifIFD
  const IFD0_SIZE = 2 + IFD0_ENTRIES*12 + 4;
  const GPS_IFD_OFF = IFD0_START + IFD0_SIZE;

  const GPS_ENTRIES = 6; // Version, LatRef, Lat, LonRef, Lon, AltRef+Alt
  const GPS_IFD_SIZE = 2 + GPS_ENTRIES*12 + 4;
  const GPS_DATA_OFF = GPS_IFD_OFF + GPS_IFD_SIZE;

  // Date/time string
  const dt = dtStr || '2026:01:01 00:00:00';
  const dtBytes = ascii(dt); // 20 bytes

  const DT_OFF = GPS_DATA_OFF + 24*3; // dupa rationale GPS (lat 24 + lon 24 + alt 8)

  // Calcule GPS
  const absLat = lat ? Math.abs(lat) : 0;
  const absLon = lon ? Math.abs(lon) : 0;
  const absAlt = alt ? Math.abs(alt) : 0;
  const latRef = (lat&&lat>=0) ? 0x4E000000 : 0x53000000; // 'N' sau 'S'
  const lonRef = (lon&&lon>=0) ? 0x45000000 : 0x57000000; // 'E' sau 'W'
  const altRef = (alt&&alt<0) ? 1 : 0; // 0=above sea, 1=below sea

  // GPS rationale
  const latRat = gpsRat(absLat); // 24 bytes
  const lonRat = gpsRat(absLon); // 24 bytes
  const altRat = [...rat(Math.round(absAlt*100), 100)]; // 8 bytes

  // GPS IFD
  const gpsLatOff  = GPS_DATA_OFF;           // offset lat rational
  const gpsLonOff  = GPS_DATA_OFF + 24;      // offset lon rational
  const gpsAltOff  = GPS_DATA_OFF + 48;      // offset alt rational

  let gpsIFD = [...w2(GPS_ENTRIES)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0000, 1, 4, 0x02020000)];           // GPSVersionID
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0001, 2, 2, latRef)];               // GPSLatitudeRef
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0002, 5, 3, gpsLatOff)];            // GPSLatitude
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0003, 2, 2, lonRef)];               // GPSLongitudeRef
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0004, 5, 3, gpsLonOff)];            // GPSLongitude
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0006, 5, 1, gpsAltOff)];            // GPSAltitude
  gpsIFD = [...gpsIFD, ...w4(0)]; // next IFD = 0

  // IFD0
  const dtOff = GPS_DATA_OFF + 56; // dupa GPS data
  let ifd0 = [...w2(IFD0_ENTRIES)];
  ifd0 = [...ifd0, ...ifdEntry(0x0132, 2, 20, dtOff)];                    // DateTime
  ifd0 = [...ifd0, ...ifdEntry(0x013B, 2, 15, dtOff+20)];                 // Artist
  ifd0 = [...ifd0, ...ifdEntry(0x8825, 4, 1, GPS_IFD_OFF)];               // GPS IFD pointer
  ifd0 = [...ifd0, ...ifdEntry(0x9003, 2, 20, dtOff)];                    // DateTimeOriginal
  ifd0 = [...ifd0, ...w4(0)]; // next IFD = 0

  const artistBytes = ascii('Cristian Farcas'); // 15 bytes

  // Asambleaza TIFF
  const tiff = [
    0x4D, 0x4D,          // Big-endian
    0x00, 0x2A,          // TIFF magic
    ...w4(IFD0_START),   // IFD0 offset = 8
    ...ifd0,
    ...gpsIFD,
    ...latRat,
    ...lonRat,
    ...altRat,
    ...dtBytes,
    ...artistBytes,
  ];

  // APP1 marker
  const exifHeader = [0x45,0x78,0x69,0x66,0x00,0x00]; // "Exif
