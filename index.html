<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1a0d">
<title>ROPhotoKml</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --g:#22c55e;--glow:rgba(34,197,94,.35);--a:#f59e0b;--r:#ef4444;
  --surf:rgba(8,18,8,.92);--bord:rgba(34,197,94,.22);
  --txt:#e8f5e8;--muted:#4a7a4a;--mono:'Courier New',monospace;
}
html,body{height:100%;overflow:hidden;background:#0d1a0d;color:var(--txt);font-family:system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:#1a2d1a!important}
.leaflet-control-zoom{display:none!important}
#top{position:fixed;top:0;left:52px;right:0;z-index:300;padding:6px 8px;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(to bottom,rgba(0,0,0,.88) 70%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
.logo{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--g);
  letter-spacing:.1em;text-shadow:0 0 8px var(--glow);flex-shrink:0}
#sb{flex:1;min-width:0;padding:5px 10px;border-radius:20px;
  border:1px solid var(--bord);background:rgba(0,0,0,.65);
  color:var(--txt);font-size:11px;outline:none;font-family:var(--mono)}
#sb::placeholder{color:var(--muted)}
#pbg{flex-shrink:0;background:rgba(34,197,94,.12);border:1px solid var(--bord);
  color:var(--g);font-family:var(--mono);font-size:9px;
  padding:2px 7px;border-radius:20px;white-space:nowrap;display:none}
#sdrop{position:fixed;top:42px;left:56px;right:8px;z-index:500;
  background:rgba(8,18,8,.97);border:1px solid var(--bord);border-radius:10px;
  max-height:180px;overflow-y:auto;display:none}
.si{padding:8px 12px;font-family:var(--mono);font-size:11px;cursor:pointer;
  border-bottom:1px solid rgba(34,197,94,.08);color:var(--txt)}
.si:last-child{border-bottom:none}
.si:active{background:rgba(34,197,94,.15);color:var(--g)}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:50px;z-index:300;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 0 12px;gap:3px;
  background:linear-gradient(to right,rgba(0,0,0,.82) 55%,transparent)}
.sb{width:40px;height:40px;border-radius:10px;border:1px solid var(--bord);
  background:var(--surf);color:var(--txt);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:all .2s;flex-shrink:0}
.sb:active{transform:scale(.91)}
.sb.on{border-color:var(--g);background:rgba(34,197,94,.18);color:var(--g);box-shadow:0 0 10px var(--glow)}
.sb.wb{border-color:var(--a)}
.sb.wb.on{background:rgba(245,158,11,.18);color:var(--a);box-shadow:0 0 10px rgba(245,158,11,.35)}
.sb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;pointer-events:none}
.sl{font-size:6.5px;color:var(--muted);font-family:var(--mono);text-align:center;line-height:1}
.sb.on .sl{color:var(--g)}
.sb.wb.on .sl{color:var(--a)}
.sp{flex:1}
#bot{position:fixed;bottom:0;left:50px;right:0;z-index:300;
  padding:6px 10px 18px;
  background:linear-gradient(to top,rgba(0,0,0,.94) 70%,transparent)}
#pills{display:flex;gap:4px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pl{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:20px;
  border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);color:var(--muted);
  white-space:nowrap;flex-shrink:0;transition:all .3s}
.pl.on{border-color:var(--g);color:var(--g);background:rgba(34,197,94,.1)}
.pl.wn{border-color:var(--a);color:var(--a)}
#pchip{display:none;background:rgba(0,0,0,.7);border:1px solid var(--bord);
  border-radius:8px;padding:5px 8px;margin-bottom:5px}
#pchip.show{display:block}
#pcid{font-family:var(--mono);font-size:11px;font-weight:700;color:#FAC775}
#pcmt{font-size:9px;color:var(--muted);margin-top:1px}
#pcfr{display:none;align-items:center;gap:4px;margin-top:4px}
#pcfr.show{display:flex}
#pcfl{font-size:9px;color:var(--muted);white-space:nowrap}
#pcfs{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--bord);
  color:var(--txt);font-family:var(--mono);font-size:10px;padding:3px 5px;
  border-radius:5px;outline:none}
#arow{display:flex;align-items:center;gap:8px}
#linfo{flex:1;font-family:var(--mono);font-size:8.5px;color:var(--muted);line-height:1.8}
#linfo .lv{color:var(--txt)}
#sht{width:54px;height:54px;border-radius:50%;flex-shrink:0;
  border:3px solid #555;background:rgba(60,60,60,.3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .35s;position:relative}
#sht.rdy{border-color:var(--g);background:rgba(34,197,94,.22);box-shadow:0 0 20px var(--glow)}
#sht.rdy::before{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:2px solid var(--g);animation:rp 1.6s infinite;opacity:.5}
@keyframes rp{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:0}}
#sdot{width:20px;height:20px;border-radius:50%;background:#666;transition:background .3s}
#sht.rdy #sdot{background:var(--g)}
#sht:disabled{opacity:.25;cursor:default}
#gbtn{width:42px;height:42px;border-radius:10px;
  border:1px solid var(--bord);background:var(--surf);
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;flex-shrink:0}
#gbtn:active{transform:scale(.91)}
#gbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
#gbtn span{font-size:7px;font-family:var(--mono);color:var(--muted)}
#prox{position:fixed;right:8px;bottom:92px;z-index:250;
  width:42px;height:42px;border-radius:50%;
  background:rgba(0,0,0,.6);border:2px solid #444;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8px;color:#666;text-align:center;line-height:1.3;
  transition:all .4s;pointer-events:none;white-space:pre-line}
#prox.near{border-color:var(--g);color:var(--g);box-shadow:0 0 14px var(--glow);background:rgba(34,197,94,.1)}
#apo{position:fixed;inset:0;z-index:590;background:rgba(0,0,0,.6);display:none}
#apo.show{display:block}
#apb{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:600;width:90%;max-width:360px;
  background:rgba(6,16,6,.98);border:1px solid var(--bord);border-radius:14px;
  overflow:hidden;display:none;box-shadow:0 8px 32px rgba(0,0,0,.7)}
#apb.show{display:block}
#aph{background:rgba(34,197,94,.1);border-bottom:1px solid var(--bord);
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
#apt{font-family:var(--mono);font-size:12px;font-weight:700;color:#FAC775}
#apc{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);
  border:none;color:var(--muted);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
#apd{padding:8px 12px;max-height:50vh;overflow-y:auto}
.ar{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid rgba(34,197,94,.07);font-size:11px}
.ar:last-child{border-bottom:none}
.ak{font-family:var(--mono);color:var(--muted);min-width:75px;flex-shrink:0;font-size:10px}
.av{font-family:var(--mono);color:var(--txt);word-break:break-all}
#apf{padding:8px 12px;border-top:1px solid var(--bord);display:flex;gap:6px}
.ab{flex:1;padding:7px;border-radius:7px;border:none;font-size:11px;font-family:var(--mono);cursor:pointer}
.ab.p{background:rgba(34,197,94,.18);border:1px solid var(--g);color:var(--g)}
.ab.s{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--muted)}
#camo{position:fixed;inset:0;z-index:700;background:#000;display:none;flex-direction:column}
#camo.show{display:flex}
#vwr{position:relative;flex:1;overflow:hidden;background:#000}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#vst{position:absolute;bottom:0;left:0;right:0;
  background:rgba(0,0,0,.50);padding:8px 11px;
  font-family:var(--mono);font-size:11px;line-height:1.75;color:#fff;
  border-top:3px solid #185FA5;pointer-events:none}
#vst .vi{font-size:13px;font-weight:700;color:#FAC775}
#vst .vk{color:#a8d5a8;font-weight:600;font-size:11px}
#logov{position:absolute;bottom:10px;right:10px;max-width:90px;max-height:54px;
  object-fit:contain;opacity:.88;display:none;pointer-events:none}
#bcc{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);
  color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
#csr{padding:11px 16px 24px;background:#000;display:flex;justify-content:center}
#csb{width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:#185FA5;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 22px rgba(24,95,165,.5);transition:transform .1s}
#csb:active{transform:scale(.91)}
#csd{width:24px;height:24px;border-radius:50%;background:#fff}
canvas{display:none}
#prevo{position:fixed;inset:0;z-index:800;background:#000;display:none;
  flex-direction:column;align-items:center;justify-content:center}
#prevo.show{display:flex}
#pimg{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain}
#pact{position:absolute;bottom:26px;display:flex;gap:28px;align-items:center}
.cb{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .15s}
.cb:active{transform:scale(.9)}
.cb.ok{background:#15803d;border:2px solid #22c55e}
.cb.no{background:#991b1b;border:2px solid #ef4444}
.cb svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.5;pointer-events:none}
.cb span{font-size:8px;color:#fff;font-family:var(--mono)}
#galo{position:fixed;inset:0;z-index:850;background:rgba(0,0,0,.96);display:none;flex-direction:column}
#galo.show{display:flex}
#galh{padding:10px 12px;background:rgba(8,18,8,.95);border-bottom:1px solid var(--bord);
  display:flex;align-items:center;justify-content:space-between}
#galh h2{font-family:var(--mono);font-size:12px;color:var(--g)}
#galh button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
#galg{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.gt{position:relative;aspect-ratio:1;cursor:pointer;border-radius:6px;overflow:hidden;border:1px solid var(--bord)}
.gt img{width:100%;height:100%;object-fit:cover}
.gt .gd{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(153,27,27,.9);border:none;color:#fff;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
#upl{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.92);
  display:flex;align-items:center;justify-content:center}
#upb{background:#0d1a0d;border:1px solid var(--bord);border-radius:16px;
  padding:22px 18px;width:88%;max-width:330px;text-align:center}
#upb h2{font-family:var(--mono);font-size:13px;color:var(--g);margin-bottom:6px}
#upb p{font-size:11px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.ub{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;
  border-radius:9px;border:1px solid var(--g);background:rgba(34,197,94,.1);
  color:var(--g);font-size:13px;cursor:pointer}
#usk{margin-top:10px;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer}
input[type=file]{display:none}
#prog{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.75);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#prog.show{display:flex}
#prog p{font-family:var(--mono);font-size:13px;color:var(--g);text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:3px solid rgba(34,197,94,.2);border-top-color:var(--g);
  border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tst{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:1200;
  font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;
  white-space:nowrap;display:none;pointer-events:none;max-width:90%;text-align:center}
#tst.ok{background:rgba(21,128,61,.94);border:1px solid var(--g);color:#d1fae5}
#tst.wn{background:rgba(146,64,14,.94);border:1px solid var(--a);color:#fef3c7}
#tst.er{background:rgba(153,27,27,.94);border:1px solid var(--r);color:#fee2e2}
.leaflet-popup-content-wrapper{background:rgba(8,18,8,.97)!important;color:var(--txt)!important;
  border:1px solid var(--bord)!important;border-radius:8px!important;font-family:var(--mono);font-size:11px!important}
.leaflet-popup-tip{background:rgba(8,18,8,.97)!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <span class="logo">ROPhotoKml</span>
  <input id="sb" type="text" placeholder="Cauta parcela..." oninput="onSrch(this.value)" autocomplete="off">
  <span id="pbg">0 foto</span>
</div>
<div id="sdrop"></div>
<div id="sidebar">
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" onclick="document.getElementById('upl').style.display='flex'">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/></svg>
      <span class="sl">KML</span>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="bgps" onclick="startGPS()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      <span class="sl">GPS</span>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="bcomp" onclick="startCompass()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="12,2 14,9 12,12 10,9"/><polygon points="12,22 14,15 12,12 10,15" opacity=".3"/></svg>
      <span class="sl">Busola</span>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="bcam" onclick="toggleCam()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span class="sl">Camera</span>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="blogo" onclick="document.getElementById('linp').click()">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
      <span class="sl">Logo</span>
    </button>
    <input type="file" id="linp" accept="image/*" onchange="loadLogo(this)">
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb wb on" id="bbuf" onclick="toggleBuf()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span class="sl">Buffer</span>
    </button>
  </div>
  <div class="sp"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" onclick="centerMap()">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg>
      <span class="sl">Centru</span>
    </button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="blyr" onclick="toggleLayer()">
      <svg viewBox="0 0 24 24"><polygon points="12,2 22,8.5 12,15 2,8.5"/><polyline points="2,15.5 12,22 22,15.5" opacity=".4"/></svg>
      <span class="sl">Strat</span>
    </button>
  </div>
</div>
<div id="bot">
  <div id="pills">
    <span class="pl" id="pgps">GPS: —</span>
    <span class="pl" id="pacc">Acc: —</span>
    <span class="pl" id="palt">Alt: —</span>
    <span class="pl" id="pdir">Dir: —</span>
    <span class="pl" id="ptim">—</span>
  </div>
  <div id="pchip"><div id="pcid">—</div><div id="pcmt"></div>
    <div id="pcfr"><span id="pcfl">Camp:</span><select id="pcfs" onchange="onFC()"></select></div>
  </div>
  <div id="arow">
    <div id="linfo">
      <span>Lat: <span class="lv" id="llat">—</span></span>
      <span>Lon: <span class="lv" id="llon">—</span></span>
      <span>Acc: <span class="lv" id="lacc">—</span> Alt: <span class="lv" id="lalt">—</span></span>
      <span>Dir: <span class="lv" id="ldir">—</span></span>
    </div>
    <button id="sht" disabled onclick="openCam()"><div id="sdot"></div></button>
    <button id="gbtn" onclick="openGallery()">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>
      <span>Galerie</span>
    </button>
  </div>
</div>
<div id="prox">—&#10;m</div>
<div id="apo" onclick="closeAP()"></div>
<div id="apb">
  <div id="aph"><span id="apt">Atribute</span><button id="apc" onclick="closeAP()">✕</button></div>
  <div id="apd"></div>
  <div id="apf">
    <button class="ab p" onclick="closeAP();openCam()">📷 Fotografiaza</button>
    <button class="ab s" onclick="closeAP()">Inchide</button>
  </div>
</div>
<div id="camo">
  <div id="vwr">
    <video id="vid" autoplay playsinline muted></video>
    <div id="vst">
      <div class="vi" id="vsi">— Parcela —</div>
      <div class="vk" id="vsk">KML: —</div>
      <div id="vsc">Lat: — | Lon: —</div>
      <div id="vsa">Acc: — | Alt: — | Azimut: —</div>
      <div id="vsd">—</div>
    </div>
    <img id="logov" alt="logo">
    <button id="bcc" onclick="closeCam()">✕</button>
  </div>
  <div id="csr"><button id="csb" onclick="doCapture()"><div id="csd"></div></button></div>
  <canvas id="cnv"></canvas>
</div>
<div id="prevo">
  <img id="pimg" alt="Preview">
  <div id="pact">
    <button class="cb no" onclick="discardP()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span>Renunta</span>
    </button>
    <button class="cb ok" onclick="saveP()">
      <svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>
      <span>Salveaza</span>
    </button>
  </div>
</div>
<div id="galo">
  <div id="galh"><h2>Galerie ROPhotoKml</h2><button onclick="closeGallery()">✕</button></div>
  <div id="galg"></div>
</div>
<div id="upl">
  <div id="upb">
    <h2>ROPhotoKml</h2>
    <p>Incarca fisierul KML cu parcelele.<br>GPS hardware — fara date GSM.</p>
    <label class="ub" for="kf">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
 
// ── Detectare Capacitor (APK nativ) ──
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
 
// ── STATE ──
let map,uMk,aCir,bufL=[];
let polyL=[];
let feats=[],kmlName='';
let selField='',allF=[];
let lat=null,lon=null,acc=null,alt=null,hdg=null;
let gpsOn=false,compOn=false,camOn=false,bufOn=true;
let curF=null,selLy=null;
let lastB64=null,lastFname='',pCnt=0;
let mStream=null,isSat=true;
let logoUrl=null;
let gallery=[];
 
// ── MAP ──
map=L.map('map',{center:[47.65,23.58],zoom:13,zoomControl:false,attributionControl:false});
const lSat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:19});
const lOSM=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19});
lSat.addTo(map);
function toggleLayer(){
  if(isSat){map.removeLayer(lSat);lOSM.addTo(map);}else{map.removeLayer(lOSM);lSat.addTo(map);}
  isSat=!isSat;document.getElementById('blyr').classList.toggle('on',!isSat);
}
function mkPin(){return L.divIcon({className:'',iconSize:[30,40],iconAnchor:[15,40],
  html:'<div style="width:30px;height:40px;position:relative"><div style="width:30px;height:30px;border-radius:50% 50% 50% 0;background:#ef4444;border:3px solid #fff;transform:rotate(-45deg);position:absolute;top:0;left:0;box-shadow:0 3px 10px rgba(0,0,0,.6)"><div style="width:10px;height:10px;border-radius:50%;background:#fff;position:absolute;top:7px;left:7px"></div></div><div style="width:4px;height:10px;background:#ef4444;position:absolute;bottom:0;left:13px;border-radius:0 0 2px 2px"></div></div>'
});}
 
// ── KML ──
function loadKML(inp){
  const f=inp.files[0];if(!f)return;
  kmlName=f.name.replace(/\.kml$/i,'');
  const r=new FileReader();
  r.onload=e=>{parseKML(e.target.result);document.getElementById('upl').style.display='none';};
  r.readAsText(f);
}
function parseKML(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  feats=[];const fs=new Set();
  doc.querySelectorAll('Placemark').forEach(pm=>{
    const f={_c:[],_ctr:null};
    pm.querySelectorAll('SimpleData').forEach(sd=>{const n=sd.getAttribute('name');f[n]=sd.textContent.trim();fs.add(n);});
    pm.querySelectorAll('Data').forEach(d=>{const n=d.getAttribute('name');const v=d.querySelector('value');if(v){f[n]=v.textContent.trim();fs.add(n);}});
    const ne=pm.querySelector('name');if(ne){f['__nm__']=ne.textContent.trim();fs.add('__nm__');}
    const cs=[];
    pm.querySelectorAll('coordinates').forEach(c=>{
      c.textContent.trim().split(/\s+/).forEach(t=>{
        const p=t.split(',');if(p.length>=2){const lo=parseFloat(p[0]),la=parseFloat(p[1]);if(!isNaN(lo)&&!isNaN(la))cs.push([la,lo]);}
      });
    });
    f._c=cs;
    if(cs.length){const las=cs.map(c=>c[0]),los=cs.map(c=>c[1]);f._ctr=[(Math.min(...las)+Math.max(...las))/2,(Math.min(...los)+Math.max(...los))/2];}
    feats.push(f);
  });
  allF=Array.from(fs);buildFS();drawAll();fitAll();
  toast('KML: '+feats.length+' parcele','ok');
}
function buildFS(){
  const s=document.getElementById('pcfs');s.innerHTML='';
  if(allF.includes('__nm__')){const o=document.createElement('option');o.value='__nm__';o.textContent='Name';s.appendChild(o);}
  allF.forEach(f=>{if(f==='__nm__')return;const o=document.createElement('option');o.value=f;o.textContent=f;s.appendChild(o);});
  selField=s.value||'';
  document.getElementById('pcfr').classList.toggle('show',allF.length>0);
}
function onFC(){selField=document.getElementById('pcfs').value;updChip();updSt();drawAll();}
function lbl(f){
  if(!selField)return f['__nm__']||'—';
  const k=selField==='__nm__'?'__nm__':selField;
  return(selField==='__nm__'?'':selField+': ')+(f[k]||'—');
}
function ex(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function drawAll(){
  polyL.forEach(p=>{map.removeLayer(p.ly);if(p.mk)map.removeLayer(p.mk);});
  bufL.forEach(l=>map.removeLayer(l));polyL=[];bufL=[];
  feats.forEach((f,i)=>{
    if(f._c.length<2)return;
    const sel=(curF===f);
    const ly=L.polygon(f._c,{color:sel?'#f59e0b':'#22c55e',weight:sel?3:2,
      fillColor:sel?'#f59e0b':'#22c55e',fillOpacity:sel?.28:.10,dashArray:sel?'7,4':null});
    if(bufOn&&f._ctr){
      const buf=L.circle(f._ctr,{radius:10,color:'#f59e0b',weight:1,
        fillColor:'#f59e0b',fillOpacity:.07,dashArray:'4,4',interactive:false}).addTo(map);
      bufL.push(buf);
    }
    let mk=null;
    if(f._ctr){
      const ico=L.divIcon({className:'',iconAnchor:[0,8],
        html:'<div style="background:rgba(0,0,0,.75);color:#FAC775;font-family:monospace;font-size:9px;padding:2px 5px;border-radius:4px;border:1px solid rgba(250,199,117,.3);white-space:nowrap;pointer-events:none">'+ex(lbl(f))+'</div>'
      });
      mk=L.marker(f._ctr,{icon:ico,interactive:false}).addTo(map);
    }
    ly.on('click',()=>selParcel(f,ly,i));ly.addTo(map);polyL.push({ly,mk,f,i});
  });
}
function fitAll(){
  const all=feats.flatMap(f=>f._c);
  if(all.length){const las=all.map(c=>c[0]),los=all.map(c=>c[1]);
    map.fitBounds([[Math.min(...las),Math.min(...los)],[Math.max(...las),Math.max(...los)]],{padding:[50,50]});}
}
function selParcel(f,ly,idx){
  if(selLy&&selLy!==ly)selLy.setStyle({color:'#22c55e',fillColor:'#22c55e',fillOpacity:.10,weight:2,dashArray:null});
  curF=f;selLy=ly;ly.setStyle({color:'#f59e0b',fillColor:'#f59e0b',fillOpacity:.28,weight:3,dashArray:'7,4'});
  map.fitBounds(ly.getBounds(),{padding:[40,40],maxZoom:18});
  updChip();updSt();chkProx();showAP(f);
}
function showAP(f){
  const body=document.getElementById('apd');body.innerHTML='';
  Object.keys(f).forEach(k=>{
    if(k.startsWith('_'))return;
    const row=document.createElement('div');row.className='ar';
    row.innerHTML='<span class="ak">'+ex(k==='__nm__'?'Name':k)+'</span><span class="av">'+ex(f[k])+'</span>';
    body.appendChild(row);
  });
  document.getElementById('apt').textContent=lbl(f);
  document.getElementById('apo').classList.add('show');
  document.getElementById('apb').classList.add('show');
}
function closeAP(){document.getElementById('apo').classList.remove('show');document.getElementById('apb').classList.remove('show');}
 
// ── GPS ──
function startGPS(){
  if(gpsOn)return;
  if(!navigator.geolocation){toast('GPS indisponibil','wn');return;}
  navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:0,timeout:60000});
  gpsOn=true;document.getElementById('bgps').classList.add('on');toast('GPS activat','ok');
}
function onPos(p){
  lat=p.coords.latitude;lon=p.coords.longitude;acc=p.coords.accuracy;alt=p.coords.altitude;
  const pd=n=>String(n).padStart(2,'0');const now=new Date();
  setPl('pgps','GPS: '+lat.toFixed(5)+', '+lon.toFixed(5),'on');
  setPl('pacc','Acc: '+acc.toFixed(1)+' m',acc<15?'on':'wn');
  setPl('palt','Alt: '+(alt!=null?alt.toFixed(1)+' m':'—'),'on');
  setPl('ptim',pd(now.getHours())+':'+pd(now.getMinutes())+':'+pd(now.getSeconds()),'on');
  document.getElementById('llat').textContent=lat.toFixed(6);
  document.getElementById('llon').textContent=lon.toFixed(6);
  document.getElementById('lacc').textContent=acc.toFixed(1)+' m';
  document.getElementById('lalt').textContent=alt!=null?alt.toFixed(1)+' m':'—';
  if(!uMk){
    uMk=L.marker([lat,lon],{icon:mkPin(),zIndexOffset:1000}).addTo(map);
    aCir=L.circle([lat,lon],{radius:acc,color:'#3b82f6',fillColor:'#3b82f6',fillOpacity:.07,weight:1}).addTo(map);
  }else{uMk.setLatLng([lat,lon]);aCir.setLatLng([lat,lon]);aCir.setRadius(acc);}
  autoSel();chkProx();updSt();
}
function onPosErr(e){toast('GPS: '+e.message,'wn');}
function setPl(id,t,c){const el=document.getElementById(id);el.textContent=t;el.className='pl '+(c||'');}
 
// ── COMPASS ──
function startCompass(){
  if(compOn)return;
  const go=()=>{
    window.addEventListener('deviceorientationabsolute',onOri,true);
    window.addEventListener('deviceorientation',onOri,true);
    compOn=true;document.getElementById('bcomp').classList.add('on');toast('Busola activata','ok');
  };
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')
    DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')go();});
  else go();
}
function onOri(e){
  let h=null;
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;
  else if(e.alpha!=null)h=(360-e.alpha)%360;
  if(h!=null){hdg=Math.round(h);setPl('pdir','Dir: '+hdg+'° '+cdir(hdg),'on');
    document.getElementById('ldir').textContent=hdg+'° '+cdir(hdg);updSt();}
}
function cdir(d){return['N','NE','E','SE','S','SV','V','NV'][Math.round(d/45)%8];}
function toggleBuf(){
  bufOn=!bufOn;document.getElementById('bbuf').classList.toggle('on',bufOn);
  drawAll();chkProx();toast(bufOn?'Buffer 10m ACTIV':'Buffer DEZACTIVAT',bufOn?'ok':'wn');
}
function autoSel(){
  if(!lat||!feats.length)return;
  let best=null,mn=Infinity;
  feats.forEach(f=>{if(f._ctr){const d=hav(lat,lon,f._ctr[0],f._ctr[1]);if(d<mn){mn=d;best=f;}}});
  if(best&&mn<400){
    const pl=polyL.find(p=>p.f===best);
    if(pl&&curF!==best){
      if(selLy)selLy.setStyle({color:'#22c55e',fillColor:'#22c55e',fillOpacity:.10,weight:2,dashArray:null});
      curF=best;selLy=pl.ly;pl.ly.setStyle({color:'#f59e0b',fillColor:'#f59e0b',fillOpacity:.28,weight:3,dashArray:'7,4'});
      updChip();updSt();
    }
  }
}
function chkProx(){
  const ring=document.getElementById('prox');const sht=document.getElementById('sht');
  if(!lat||!curF){ring.textContent='—\nm';return;}
  let d;
  if(curF._c.length>=3)d=d2poly(lat,lon,curF._c);
  else if(curF._ctr)d=hav(lat,lon,curF._ctr[0],curF._ctr[1]);
  else return;
  ring.textContent=d<1000?Math.round(d)+'\nm':(d/1000).toFixed(1)+'\nkm';
  const near=!bufOn||(d<=10);
  ring.classList.toggle('near',near);sht.classList.toggle('rdy',near&&camOn);sht.disabled=!(near&&camOn);
}
function hav(a1,o1,a2,o2){
  const R=6371000,da=(a2-a1)*Math.PI/180,doo=(o2-o1)*Math.PI/180;
  const s=Math.sin(da/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(doo/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function pip(la,lo,cs){let ins=false;for(let i=0,j=cs.length-1;i<cs.length;j=i++){const xi=cs[i][0],yi=cs[i][1],xj=cs[j][0],yj=cs[j][1];if((yi>lo)!==(yj>lo)&&la<(xj-xi)*(lo-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function dseg(la,lo,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];if(!dx&&!dy)return hav(la,lo,a[0],a[1]);const t=Math.max(0,Math.min(1,((la-a[0])*dx+(lo-a[1])*dy)/(dx*dx+dy*dy)));return hav(la,lo,a[0]+t*dx,a[1]+t*dy);}
function d2poly(la,lo,cs){if(pip(la,lo,cs))return 0;let m=Infinity;for(let i=0;i<cs.length-1;i++){const d=dseg(la,lo,cs[i],cs[i+1]);if(d<m)m=d;}return m;}
function onSrch(v){
  const box=document.getElementById('sdrop');
  if(!v.trim()||!feats.length){box.style.display='none';return;}
  const q=v.toLowerCase();
  const hits=feats.filter(f=>Object.values(f).some(val=>typeof val==='string'&&val.toLowerCase().includes(q))).slice(0,10);
  if(!hits.length){box.style.display='none';return;}
  box.innerHTML=hits.map(h=>'<div class="si" onclick="srchSel('+feats.indexOf(h)+')">'+ex(lbl(h))+'</div>').join('');
  box.style.display='block';
}
function srchSel(i){const f=feats[i];const pl=polyL.find(p=>p.f===f);if(pl)selParcel(f,pl.ly,pl.i);document.getElementById('sb').value='';document.getElementById('sdrop').style.display='none';}
document.addEventListener('click',e=>{if(!e.target.closest('#sb')&&!e.target.closest('#sdrop'))document.getElementById('sdrop').style.display='none';});
function updChip(){
  if(!curF){document.getElementById('pchip').classList.remove('show');return;}
  document.getElementById('pchip').classList.add('show');
  document.getElementById('pcid').textContent=lbl(curF);
  let meta='';
  if(lat&&curF._ctr){const d=hav(lat,lon,curF._ctr[0],curF._ctr[1]);meta='Distanta: '+(d<1000?Math.round(d)+' m':(d/1000).toFixed(2)+' km');}
  document.getElementById('pcmt').textContent=meta;
}
function updSt(){
  const pd=n=>String(n).padStart(2,'0');const now=new Date();
  const ts=pd(now.getDate())+'.'+pd(now.getMonth()+1)+'.'+now.getFullYear()+'  '+pd(now.getHours())+':'+pd(now.getMinutes())+':'+pd(now.getSeconds());
  document.getElementById('vsi').textContent=curF?lbl(curF):'— Parcela neselectata —';
  document.getElementById('vsk').textContent='KML: '+kmlName;
  document.getElementById('vsc').textContent=lat?'Lat: '+lat.toFixed(6)+'  Lon: '+lon.toFixed(6):'Lat: —  Lon: —';
  document.getElementById('vsa').textContent='Acc: '+(acc?acc.toFixed(1)+' m':'—')+'  Alt: '+(alt!=null?alt.toFixed(1)+' m':'—')+'  Azimut: '+(hdg!=null?hdg+'° '+cdir(hdg):'—');
  document.getElementById('vsd').textContent=ts;
}
setInterval(()=>{updSt();if(gpsOn)chkProx();updChip();},1000);
function loadLogo(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{logoUrl=e.target.result;document.getElementById('blogo').classList.add('on');
    const ov=document.getElementById('logov');ov.src=logoUrl;ov.style.display='block';toast('Logo incarcat','ok');};
  r.readAsDataURL(f);
}
function toggleCam(){
  const btn=document.getElementById('bcam');
  if(!camOn){
    navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:4096},height:{ideal:2160}},audio:false})
    .then(s=>{mStream=s;document.getElementById('vid').srcObject=s;camOn=true;btn.classList.add('on');chkProx();toast('Camera pornita','ok');})
    .catch(e=>{toast('Camera eroare: '+e.name,'er');});
  }else{
    if(mStream)mStream.getTracks().forEach(t=>t.stop());
    camOn=false;btn.classList.remove('on');closeCam();
    document.getElementById('sht').disabled=true;document.getElementById('sht').classList.remove('rdy');
  }
}
function openCam(){if(!camOn){toast('Porneste camera mai intai','wn');return;}document.getElementById('camo').classList.add('show');}
function closeCam(){document.getElementById('camo').classList.remove('show');}
 
// ══════════════════════════════════════════════════════════════
// EXIF GPS BUILDER — WGS84 (format 47.123456, 23.123456)
// Little-endian TIFF, GPS IFD corect
// ══════════════════════════════════════════════════════════════
function buildEXIF(dtStr, latV, lonV, altV, hdgV) {
  // All offsets are from start of TIFF header ('II')
  // We build a flat byte array directly, no dynamic patching
 
  function u16LE(v, a) { a.push(v & 0xFF, (v >> 8) & 0xFF); }
  function u32LE(v, a) { a.push(v & 0xFF, (v>>8)&0xFF, (v>>16)&0xFF, (v>>24)&0xFF); }
  function u16BE(v, a) { a.push((v>>8)&0xFF, v&0xFF); }
  function asciiZ(s, a) { for(let i=0;i<s.length;i++) a.push(s.charCodeAt(i)&0xFF); a.push(0); }
 
  // Convert decimal degrees to DMS rationals (3 RATIONAL values = 24 bytes)
  function dmsBytes(deg) {
    const a = Math.abs(deg);
    const d = Math.floor(a);
    const mf = (a - d) * 60;
    const m = Math.floor(mf);
    const sf = (mf - m) * 60;
    // Seconds stored as fraction with denominator 10000
    const sNum = Math.round(sf * 10000);
    const sDen = 10000;
    const out = [];
    u32LE(d, out); u32LE(1, out);       // degrees: d/1
    u32LE(m, out); u32LE(1, out);       // minutes: m/1
    u32LE(sNum, out); u32LE(sDen, out); // seconds: sNum/10000
    return out; // 24 bytes
  }
 
  // ── Compute exact layout ──
  // TIFF header: 8 bytes (at absolute 0)
  // IFD0: starts at 8
  //   IFD0 has 4 entries → 2 + 4*12 + 4 = 54 bytes → IFD0 ends at 62
  // IFD0 data area starts at 62:
  //   DateTime ASCII 20 bytes → 62..81
  //   padding 1 byte → 82 (to align ExifIFD to even)  [20 bytes = even, no pad needed]
  // ExifIFD starts at 82:
  //   2 entries → 2 + 2*12 + 4 = 30 bytes → ExifIFD ends at 112
  // ExifIFD data at 112:
  //   DateTimeOriginal 20 bytes → 112..131
  //   DateTimeDigitized 20 bytes → 132..151
  // GPSIFD starts at 152:
  //   We build GPS entries depending on available data
 
  const TIFF_BASE = 0;
  const IFD0_OFF = 8;
  const IFD0_ENTRIES = 4; // DateTime, ExifIFD ptr, GPSIFD ptr, Make
  const IFD0_SIZE = 2 + IFD0_ENTRIES * 12 + 4; // 54
  const IFD0_DATA_OFF = IFD0_OFF + IFD0_SIZE; // 62
 
  const DT_OFF = IFD0_DATA_OFF; // 62, length 20
  const DT_LEN = 20; // "YYYY:MM:DD HH:MM:SS\0"
 
  const EXIF_IFD_OFF = DT_OFF + DT_LEN; // 82
  const EXIF_ENTRIES = 2;
  const EXIF_IFD_SIZE = 2 + EXIF_ENTRIES * 12 + 4; // 30
  const EXIF_DATA_OFF = EXIF_IFD_OFF + EXIF_IFD_SIZE; // 112
  const DTO_OFF = EXIF_DATA_OFF;       // DateTimeOriginal 112
  const DTD_OFF = EXIF_DATA_OFF + 20;  // DateTimeDigitized 132
 
  const GPS_IFD_OFF = DTD_OFF + 20; // 152
 
  // GPS entries — built dynamically
  // Each entry: tag(2)+type(2)+count(4)+value_or_offset(4) = 12 bytes
  // Values > 4 bytes go in GPS data heap after GPS IFD
  let gpsEntryList = []; // {tag, type, count, inline:[], OR heapOff}
  let gpsHeap = [];
 
  if (latV != null && lonV != null) {
    // GPSVersionID BYTE 4 (fits inline)
    gpsEntryList.push({tag:0x0000, type:1, count:4, inline:[2,3,0,0]});
    // GPSLatitudeRef ASCII 2 (fits inline)
    gpsEntryList.push({tag:0x0001, type:2, count:2, inline:[latV>=0?78:83, 0, 0, 0]});
    // GPSLatitude RATIONAL 3 = 24 bytes → heap
    const laOff = gpsHeap.length;
    gpsHeap.push(...dmsBytes(latV));
    gpsEntryList.push({tag:0x0002, type:5, count:3, heapOff:laOff});
    // GPSLongitudeRef ASCII 2
    gpsEntryList.push({tag:0x0003, type:2, count:2, inline:[lonV>=0?69:87, 0, 0, 0]});
    // GPSLongitude RATIONAL 3 = 24 bytes → heap
    const loOff = gpsHeap.length;
    gpsHeap.push(...dmsBytes(lonV));
    gpsEntryList.push({tag:0x0004, type:5, count:3, heapOff:loOff});
  }
  if (altV != null) {
    gpsEntryList.push({tag:0x0005, type:1, count:1, inline:[altV>=0?0:1,0,0,0]});
    const aOff = gpsHeap.length;
    const aAbs = Math.round(Math.abs(altV) * 100);
    const out=[]; u32LE(aAbs,out); u32LE(100,out);
    gpsHeap.push(...out);
    gpsEntryList.push({tag:0x0006, type:5, count:1, heapOff:aOff});
  }
  if (hdgV != null) {
    gpsEntryList.push({tag:0x0010, type:2, count:2, inline:[84,0,0,0]}); // 'T\0'
    const hOff = gpsHeap.length;
    const hNum = Math.round(hdgV*100);
    const out=[]; u32LE(hNum,out); u32LE(100,out);
    gpsHeap.push(...out);
    gpsEntryList.push({tag:0x0011, type:5, count:1, heapOff:hOff});
  }
 
  const GPS_IFD_HEADER_SIZE = 2 + gpsEntryList.length * 12 + 4;
  const GPS_HEAP_BASE = GPS_IFD_OFF + GPS_IFD_HEADER_SIZE; // absolute offset of heap
 
  // ── Assemble full byte array ──
  const B = []; // the complete TIFF data
 
  // TIFF header (8 bytes)
  B.push(0x49, 0x49); // 'II' little-endian
  B.push(0x2A, 0x00); // TIFF magic
  u32LE(IFD0_OFF, B); // offset to IFD0
 
  // IFD0 (starts at 8)
  u16LE(IFD0_ENTRIES, B);
  // Entry: DateTime 0x0132 ASCII 20 bytes → offset DT_OFF
  u16LE(0x0132,B); u16LE(2,B); u32LE(DT_LEN,B); u32LE(DT_OFF,B);
  // Entry: Make 0x010F ASCII 4 bytes → inline 'RPK\0'
  u16LE(0x010F,B); u16LE(2,B); u32LE(4,B); B.push(82,80,75,0);
  // Entry: ExifIFD 0x8769 LONG 1 → EXIF_IFD_OFF
  u16LE(0x8769,B); u16LE(4,B); u32LE(1,B); u32LE(EXIF_IFD_OFF,B);
  // Entry: GPSIFD 0x8825 LONG 1 → GPS_IFD_OFF
  u16LE(0x8825,B); u16LE(4,B); u32LE(1,B); u32LE(GPS_IFD_OFF,B);
  u32LE(0, B); // next IFD = 0
 
  // IFD0 data: DateTime ASCII at DT_OFF (currently B.length should == 62)
  while(B.length < DT_OFF) B.push(0);
  asciiZ(dtStr, B); // 20 bytes (19 chars + \0)
 
  // ExifIFD at EXIF_IFD_OFF (82)
  while(B.length < EXIF_IFD_OFF) B.push(0);
  u16LE(EXIF_ENTRIES, B);
  // DateTimeOriginal 0x9003 ASCII 20
  u16LE(0x9003,B); u16LE(2,B); u32LE(DT_LEN,B); u32LE(DTO_OFF,B);
  // DateTimeDigitized 0x9291 ASCII 20
  u16LE(0x9291,B); u16LE(2,B); u32LE(DT_LEN,B); u32LE(DTD_OFF,B);
  u32LE(0, B); // next IFD = 0
  // ExifIFD data
  while(B.length < DTO_OFF) B.push(0);
  asciiZ(dtStr, B); // DateTimeOriginal
  while(B.length < DTD_OFF) B.push(0);
  asciiZ(dtStr, B); // DateTimeDigitized
 
  // GPSIFD at GPS_IFD_OFF (152)
  while(B.length < GPS_IFD_OFF) B.push(0);
  u16LE(gpsEntryList.length, B);
  gpsEntryList.forEach(e => {
    u16LE(e.tag, B); u16LE(e.type, B); u32LE(e.count, B);
    if (e.inline !== undefined) {
      B.push(...e.inline.slice(0,4));
    } else {
      // absolute offset = GPS_HEAP_BASE + e.heapOff
      u32LE(GPS_HEAP_BASE + e.heapOff, B);
    }
  });
  u32LE(0, B); // next IFD = 0
  // GPS heap data
  B.push(...gpsHeap);
 
  // ── Wrap in APP1 ──
  const exifMarker = [0x45,0x78,0x69,0x66,0x00,0x00]; // 'Exif\0\0'
  const app1Body = [...exifMarker, ...B];
  const app1Len = app1Body.length + 2;
  const app1 = [0xFF, 0xE1];
  u16BE(app1Len, app1);
  app1.push(...app1Body);
  return new Uint8Array(app1);
}
 
// ── CAPTURE ──
function doCapture() {
  const vid = document.getElementById('vid');
  if (!vid.videoWidth) { toast('Camera nu este gata','wn'); return; }
 
  showProg('Se captureaza...');
 
  const w = vid.videoWidth, h = vid.videoHeight;
  const cnv = document.getElementById('cnv');
  cnv.width = w; cnv.height = h;
  const ctx = cnv.getContext('2d');
  ctx.drawImage(vid, 0, 0, w, h);
 
  const pd = n => String(n).padStart(2,'0');
  const now = new Date();
  const ts = pd(now.getDate())+'.'+pd(now.getMonth()+1)+'.'+now.getFullYear()+
    '  '+pd(now.getHours())+':'+pd(now.getMinutes())+':'+pd(now.getSeconds());
  const dtExif = now.getFullYear()+':'+pd(now.getMonth()+1)+':'+pd(now.getDate())+
    ' '+pd(now.getHours())+':'+pd(now.getMinutes())+':'+pd(now.getSeconds());
 
  const pid = (curF && selField && curF[selField]) ?
    String(curF[selField]).replace(/[^a-zA-Z0-9_\-]/g,'_').substring(0,40) : 'parcela';
  lastFname = 'ROPhotoKml_'+pid+'_'+now.getFullYear()+pd(now.getMonth()+1)+pd(now.getDate())+
    '_'+pd(now.getHours())+pd(now.getMinutes())+pd(now.getSeconds())+'.jpg';
 
  const lines = [
    curF ? lbl(curF) : '— Parcela neselectata —',
    'KML: ' + kmlName,
    lat ? 'Lat: '+lat.toFixed(6)+'   Lon: '+lon.toFixed(6) : 'Lat: —   Lon: —',
    'Acc: '+(acc?acc.toFixed(1)+' m':'—')+
      '  Alt: '+(alt!=null?alt.toFixed(1)+' m':'—')+
      '  Azimut: '+(hdg!=null?hdg+'° '+cdir(hdg):'—'),
    ts
  ];
 
  const fs = Math.max(18, Math.round(h * 0.024));
  const pp = Math.round(fs * 0.65);
  const lh = Math.round(fs * 1.55);
  const bH = lines.length * lh + pp * 2;
  const bY = h - bH;
 
  ctx.fillStyle = 'rgba(0,0,0,0.50)';
  ctx.fillRect(0, bY, w, bH);
  ctx.fillStyle = '#185FA5';
  ctx.fillRect(0, bY, w, 3);
 
  ctx.font = 'bold '+Math.round(fs*1.1)+'px "Courier New",monospace';
  ctx.fillStyle = '#FAC775';
  ctx.fillText(lines[0], pp, bY+pp+Math.round(fs));
 
  ctx.font = 'bold '+fs+'px "Courier New",monospace';
  ctx.fillStyle = '#a8d5a8';
  ctx.fillText(lines[1], pp, bY+pp+Math.round(fs)+lh);
 
  ctx.font = fs+'px "Courier New",monospace';
  ctx.fillStyle = '#fff';
  for(let i=2;i<lines.length;i++)
    ctx.fillText(lines[i], pp, bY+pp+Math.round(fs)+i*lh);
 
  function doFinish() {
    // Get base64 from canvas directly — works in ALL environments including WebView
    showProg('Se aplica EXIF GPS...');
    try {
      const dataURL = cnv.toDataURL('image/jpeg', 0.95);
      // dataURL = "data:image/jpeg;base64,/9j/..."
      const b64 = dataURL.split(',')[1];
      // Convert base64 to Uint8Array
      const binStr = atob(b64);
      const orig = new Uint8Array(binStr.length);
      for(let i=0;i<binStr.length;i++) orig[i] = binStr.charCodeAt(i);
 
      // Strip existing APP0/APP1
      let skip = 2;
      while(skip < orig.length-3 && orig[skip]===0xFF) {
        const mType = orig[skip+1];
        if(mType===0xE0||mType===0xE1||mType===0xE2) {
          const mLen = (orig[skip+2]<<8)|orig[skip+3];
          skip += 2 + mLen;
        } else break;
      }
 
      const app1 = buildEXIF(dtExif, lat, lon, alt, hdg);
 
      // Build new JPEG
      const out = new Uint8Array(2 + app1.length + orig.length - skip);
      out[0] = 0xFF; out[1] = 0xD8;
      out.set(app1, 2);
      out.set(orig.slice(skip), 2 + app1.length);
 
      // Convert back to base64
      let outBin = '';
      for(let i=0;i<out.length;i++) outBin += String.fromCharCode(out[i]);
      lastB64 = btoa(outBin);
 
      showPreview('data:image/jpeg;base64,'+lastB64);
    } catch(err) {
      console.error('EXIF err:', err);
      // fallback: save without EXIF
      lastB64 = cnv.toDataURL('image/jpeg', 0.95).split(',')[1];
      toast('Salvat fara EXIF GPS','wn');
      showPreview('data:image/jpeg;base64,'+lastB64);
    }
  }
 
  if(logoUrl) {
    const li = new Image();
    li.onload = function() {
      const lh2 = Math.round(bH * 0.72);
      const lw2 = Math.round(lh2 * 2.2);
      ctx.globalAlpha = 0.88;
      ctx.drawImage(li, w-lw2-pp, bY+Math.round((bH-lh2)/2), lw2, lh2);
      ctx.globalAlpha = 1;
      doFinish();
    };
    li.onerror = doFinish;
    li.src = logoUrl;
  } else {
    doFinish();
  }
}
 
function showPreview(dataUrl) {
  hideProg();
  document.getElementById('pimg').src = dataUrl;
  closeCam();
  document.getElementById('prevo').classList.add('show');
}
 
// ── SAVE — funcționează atât pe web cât și pe APK Android ──
async function saveP() {
  if(!lastB64) { toast('Nu exista fotografie','er'); return; }
  showProg('Se salveaza fotografia...');
 
  try {
    if(IS_NATIVE) {
      // ── Salvare nativa Android prin Capacitor Filesystem ──
      const { Filesystem, Directory } = window.Capacitor.Plugins;
      await Filesystem.writeFile({
        path: 'Pictures/ROPhotoKml/' + lastFname,
        data: lastB64,
        directory: Directory.ExternalStorage,
        recursive: true
      });
      // Notifica galeria Android sa indexeze poza
      try {
        const { Media } = window.Capacitor.Plugins;
        if(Media) await Media.savePhoto({path: lastFname});
      } catch(e) { /* Media plugin optional */ }
      hideProg();
      toast('Salvat in Poze: '+lastFname,'ok');
    } else {
      // ── Salvare web (browser desktop/Chrome) ──
      const byteStr = atob(lastB64);
      const arr = new Uint8Array(byteStr.length);
      for(let i=0;i<byteStr.length;i++) arr[i] = byteStr.charCodeAt(i);
      const blob = new Blob([arr], {type:'image/jpeg'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = lastFname; a.style.display='none';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
      hideProg();
      toast('Descarcat: '+lastFname,'ok');
    }
    pCnt++;
    // Adauga in galeria sesiunii
    gallery.push({b64:lastB64, name:lastFname, url:'data:image/jpeg;base64,'+lastB64});
    const b=document.getElementById('pbg'); b.style.display='block'; b.textContent=pCnt+' foto';
    document.getElementById('prevo').classList.remove('show');
  } catch(err) {
    hideProg();
    console.error('Save error:', err);
    toast('Eroare salvare: '+err.message,'er');
  }
}
 
function discardP() {
  document.getElementById('prevo').classList.remove('show');
  document.getElementById('camo').classList.add('show');
}
function openGallery() {
  const g=document.getElementById('galg'); g.innerHTML='';
  if(!gallery.length) {
    g.innerHTML='<div style="padding:40px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">Nu exista fotografii in aceasta sesiune.</div>';
  } else {
    gallery.forEach((p,i)=>{
      const d=document.createElement('div'); d.className='gt';
      d.innerHTML='<img src="'+p.url+'" onclick="viewFull('+i+')">'
        +'<button class="gd" onclick="delPhoto('+i+')">✕</button>';
      g.appendChild(d);
    });
  }
  document.getElementById('galo').classList.add('show');
}
function viewFull(i) {
  const w=window.open('','_blank');
  w.document.write('<img src="'+gallery[i].url+'" style="max-width:100%;height:auto">');
}
function closeGallery(){document.getElementById('galo').classList.remove('show');}
function delPhoto(i){if(!confirm('Stergi?'))return;gallery.splice(i,1);openGallery();}
function centerMap(){if(lat)map.setView([lat,lon],18);else toast('Activeaza GPS','wn');}
function showProg(msg){document.getElementById('prog-txt').textContent=msg;document.getElementById('prog').classList.add('show');}
function hideProg(){document.getElementById('prog').classList.remove('show');}
function toast(msg,type){
  const el=document.getElementById('tst');el.textContent=msg;el.className=type;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',5000);
}
