<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1a0d">
<title>ROPhotoKml</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --g:#22c55e;--glow:rgba(34,197,94,.35);--a:#f59e0b;--r:#ef4444;
  --surf:rgba(8,18,8,.92);--bord:rgba(34,197,94,.22);
  --txt:#e8f5e8;--muted:#4a7a4a;--mono:'Courier New',monospace;
}
html,body{height:100%;overflow:hidden;background:#0d1a0d;color:var(--txt);font-family:system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:#1a2d1a!important}
.leaflet-control-zoom{display:none!important}
#top{position:fixed;top:0;left:52px;right:0;z-index:300;padding:6px 8px;pointer-events:none;
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(to bottom,rgba(0,0,0,.88) 70%,transparent);pointer-events:none}
#top>*{pointer-events:auto}
.logo{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--g);letter-spacing:.1em;text-shadow:0 0 8px var(--glow);flex-shrink:0}
#sb{flex:1;min-width:0;padding:5px 10px;border-radius:20px;border:1px solid var(--bord);background:rgba(0,0,0,.65);color:var(--txt);font-size:11px;outline:none;font-family:var(--mono)}
#sb::placeholder{color:var(--muted)}
#filter-sel{background:rgba(0,0,0,.6);border:1px solid var(--bord);color:var(--txt);font-family:var(--mono);font-size:10px;padding:4px 6px;border-radius:8px;outline:none;flex-shrink:0;cursor:pointer}
#pbg{flex-shrink:0;background:rgba(34,197,94,.12);border:1px solid var(--bord);color:var(--g);font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;white-space:nowrap;display:none}
#sdrop{position:fixed;top:42px;left:56px;right:8px;z-index:500;background:rgba(8,18,8,.97);border:1px solid var(--bord);border-radius:10px;max-height:180px;overflow-y:auto;display:none}
.si{padding:8px 12px;font-family:var(--mono);font-size:11px;cursor:pointer;border-bottom:1px solid rgba(34,197,94,.08);color:var(--txt)}
.si:last-child{border-bottom:none}
.si:active{background:rgba(34,197,94,.15);color:var(--g)}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:50px;z-index:300;display:flex;flex-direction:column;align-items:center;padding:6px 0 12px;gap:3px;background:linear-gradient(to right,rgba(0,0,0,.82) 55%,transparent)}
.sb{width:40px;height:40px;border-radius:10px;border:1px solid var(--bord);background:var(--surf);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s;flex-shrink:0}
.sb:active{transform:scale(.91)}
.sb.on{border-color:var(--g);background:rgba(34,197,94,.18);color:var(--g);box-shadow:0 0 10px var(--glow)}
.sb.wb{border-color:var(--a)}
.sb.wb.on{background:rgba(245,158,11,.18);color:var(--a);box-shadow:0 0 10px rgba(245,158,11,.35)}
.sb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;pointer-events:none}
.sl{font-size:6.5px;color:var(--muted);font-family:var(--mono);text-align:center;line-height:1}
.sb.on .sl{color:var(--g)}
.sb.wb.on .sl{color:var(--a)}
.sp{flex:1}
#bot{position:fixed;bottom:0;left:50px;right:0;z-index:300;padding:6px 10px 18px;background:linear-gradient(to top,rgba(0,0,0,.94) 70%,transparent);pointer-events:none}
#bot>*,#top>*{pointer-events:auto}
#pills{display:flex;gap:4px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
#pills::-webkit-scrollbar{display:none}
.pl{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .3s}
.pl.on{border-color:var(--g);color:var(--g);background:rgba(34,197,94,.1)}
.pl.wn{border-color:var(--a);color:var(--a)}
#pchip{display:none;background:rgba(0,0,0,.7);border:1px solid var(--bord);border-radius:8px;padding:5px 8px;margin-bottom:5px;pointer-events:auto}
#pchip.show{display:block}
#pcid{font-family:var(--mono);font-size:11px;font-weight:700;color:#FAC775}
#pcmt{font-size:9px;color:var(--muted);margin-top:1px}

#arow{display:flex;align-items:center;gap:8px;pointer-events:auto}
#linfo{flex:1;font-family:var(--mono);font-size:8.5px;color:var(--muted);line-height:1.8}
#linfo .lv{color:var(--txt)}
#sht{width:54px;height:54px;border-radius:50%;flex-shrink:0;border:3px solid #555;background:rgba(60,60,60,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s;position:relative}
#sht.rdy{border-color:var(--g);background:rgba(34,197,94,.22);box-shadow:0 0 20px var(--glow)}
#sht.rdy::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--g);animation:rp 1.6s infinite;opacity:.5}
@keyframes rp{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:0}}
#sdot{width:20px;height:20px;border-radius:50%;background:#666;transition:background .3s}
#sht.rdy #sdot{background:var(--g)}
#sht:disabled{opacity:.25;cursor:default}
#gbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--bord);background:var(--surf);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
#gbtn:active{transform:scale(.91)}
#gbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
#gbtn span{font-size:7px;font-family:var(--mono);color:var(--muted)}
#prox{position:fixed;right:8px;bottom:92px;z-index:250;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid #444;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:#666;text-align:center;line-height:1.3;transition:all .4s;pointer-events:none;white-space:pre-line}
#prox.near{border-color:var(--g);color:var(--g);box-shadow:0 0 14px var(--glow);background:rgba(34,197,94,.1)}
/* ── AL DOILEA SELECTOR CAMP ── */
#pcfr{display:none;align-items:center;gap:4px;margin-top:5px}
#pcfr.show{display:flex}
#pcfr2{display:none;align-items:center;gap:4px;margin-top:4px}
#pcfr2.show{display:flex}
#pcfl,#pcfl2{font-size:9px;color:var(--g);white-space:nowrap;font-family:var(--mono);font-weight:600;min-width:42px}
#pcfs,#pcfs2{flex:1;background:rgba(0,0,0,.6);border:1px solid var(--g);color:var(--txt);font-family:var(--mono);font-size:11px;padding:4px 6px;border-radius:6px;outline:none;cursor:pointer}
/* ── PARCEL POPUP ── */
#pp-overlay{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.5);display:none}
#pp-overlay.show{display:block}
#pp{position:fixed;bottom:0;left:0;right:0;z-index:1101;
  background:rgba(5,14,5,.98);border-top:2px solid var(--bord);
  border-radius:18px 18px 0 0;padding:0 0 30px;display:none;
  box-shadow:0 -6px 28px rgba(0,0,0,.7)}
#pp.show{display:block}
#pp-head{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;border-bottom:1px solid var(--bord)}
#pp-title{font-family:var(--mono);font-size:13px;font-weight:700;color:#FAC775;
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px}
#pp-actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:14px 14px 0}
.pp-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:13px 4px;border-radius:12px;border:1px solid var(--bord);
  background:rgba(34,197,94,.06);color:var(--txt);font-size:10px;
  font-family:system-ui;cursor:pointer;transition:all .18s;min-height:66px}
.pp-btn:active{transform:scale(.93)}
.pp-btn span:first-child{font-size:22px}
.pp-btn.pp-attr{border-color:rgba(24,95,165,.4);background:rgba(24,95,165,.08);color:#93c5fd}
.pp-btn.pp-done{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.07);color:var(--g)}
.pp-btn.pp-done.active{border-color:var(--g);background:rgba(34,197,94,.25);color:#fff;font-weight:700}
.pp-btn.pp-photo{border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.07);color:#fcd34d}
.pp-btn.pp-del{border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.07);color:#fca5a5}
/* ── ATTR WINDOW ── */
#aw-overlay{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.6);display:none}
#aw-overlay.show{display:block}
#aw{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1201;
  width:92%;max-width:380px;max-height:80vh;background:rgba(5,14,5,.99);
  border:1px solid var(--bord);border-radius:14px;overflow:hidden;
  display:none;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.8)}
#aw.show{display:flex}
#aw-head{background:rgba(34,197,94,.09);border-bottom:1px solid var(--bord);
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#aw-title{font-family:var(--mono);font-size:12px;font-weight:700;color:#FAC775}
#aw-body{flex:1;overflow-y:auto;padding:6px 0}
.aw-row{display:flex;gap:6px;padding:6px 14px;border-bottom:1px solid rgba(34,197,94,.07);font-size:11px}
.aw-row:last-child{border-bottom:none}
.aw-k{font-family:var(--mono);color:var(--muted);min-width:82px;flex-shrink:0;font-size:10px}
.aw-v{font-family:var(--mono);color:var(--txt);word-break:break-all}
#aw-foot{padding:10px 12px;border-top:1px solid var(--bord);display:flex;gap:8px;flex-shrink:0}
.aw-btn{flex:1;padding:9px;border-radius:8px;border:none;font-size:12px;font-family:var(--mono);cursor:pointer}
.aw-cam{background:rgba(34,197,94,.18);border:1px solid var(--g);color:var(--g)}
.aw-cls{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--muted)}
/* ── EXIT DIALOG ── */
#exit-overlay{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.7);display:none}
#exit-overlay.show{display:block}
#exit-dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:1600;background:rgba(5,14,5,.99);border:1px solid rgba(239,68,68,.4);
  border-radius:16px;padding:24px 22px;width:84%;max-width:300px;text-align:center;
  display:none;box-shadow:0 10px 40px rgba(0,0,0,.8)}
#exit-dialog.show{display:block}
#exit-icon{font-size:36px;margin-bottom:10px}
#exit-msg{font-family:var(--mono);font-size:14px;color:var(--txt);margin-bottom:20px;line-height:1.5}
#exit-btns{display:flex;flex-direction:column;gap:8px}
#exit-yes{padding:11px;border-radius:9px;border:1px solid var(--r);
  background:rgba(239,68,68,.15);color:#fca5a5;font-size:13px;
  cursor:pointer;font-family:var(--mono);font-weight:700}
#exit-no{padding:11px;border-radius:9px;border:1px solid var(--bord);
  background:rgba(34,197,94,.1);color:var(--g);font-size:13px;
  cursor:pointer;font-family:var(--mono)}
/* CAMERA */
#camo{position:fixed;inset:0;z-index:700;background:#000;display:none;flex-direction:column}
#camo.show{display:flex}
#vwr{position:relative;flex:1;overflow:hidden;background:#000}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#vst{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.50);padding:8px 11px;font-family:var(--mono);font-size:11px;line-height:1.75;color:#fff;border-top:3px solid #185FA5;pointer-events:none}
#vst .vi{font-size:13px;font-weight:700;color:#FAC775}
#bcc{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
#zoom-slider-wrap{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10}
#zoom-val{font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:8px;min-width:32px;text-align:center}
#zoom-slider{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:28px;height:160px;accent-color:var(--g);cursor:pointer;background:transparent}
#csr{padding:11px 16px 24px;background:#000;display:flex;justify-content:center}
#csb{width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:#185FA5;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(24,95,165,.5);transition:transform .1s}
#csb:active{transform:scale(.91)}
#csd{width:24px;height:24px;border-radius:50%;background:#fff}
canvas{display:none}
/* PREVIEW */
#prevo{position:fixed;inset:0;z-index:800;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#prevo.show{display:flex}
#pimg{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain}
#pact{position:absolute;bottom:26px;display:flex;gap:28px;align-items:center}
.cb{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .15s}
.cb:active{transform:scale(.9)}
.cb.ok{background:#15803d;border:2px solid #22c55e}
.cb.no{background:#991b1b;border:2px solid #ef4444}
.cb svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.5;pointer-events:none}
.cb span{font-size:8px;color:#fff;font-family:var(--mono)}
/* GALLERY */
#galo{position:fixed;inset:0;z-index:850;background:rgba(0,0,0,.97);display:none;flex-direction:column}
#galo.show{display:flex}
#galh{padding:10px 12px;background:rgba(8,18,8,.98);border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#galh h2{font-family:var(--mono);font-size:12px;color:var(--g)}
#galh button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px}
#galg{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}
.gt{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--bord)}
.gt img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.gt .gd{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(153,27,27,.92);border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
/* FULL VIEW */
#fullview{position:fixed;inset:0;z-index:900;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#fullview.show{display:flex}
#fullimg{max-width:100%;max-height:100vh;object-fit:contain}
#fvclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
#fvname{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
/* KML MANAGER */
#kml-manager-overlay{position:fixed;inset:0;z-index:590;background:rgba(0,0,0,.6);display:none}
#kml-manager-overlay.show{display:block}
#kml-manager{position:fixed;bottom:0;left:0;right:0;z-index:600;background:rgba(6,16,6,.98);border-top:2px solid var(--bord);border-radius:16px 16px 0 0;max-height:75vh;display:none;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.5)}
#kml-manager.show{display:flex}
#km-head{padding:12px 14px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#km-head h2{font-family:var(--mono);font-size:13px;color:var(--g)}
#km-head button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
#km-body{flex:1;overflow-y:auto;padding:10px 12px}
#km-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.km-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--bord);background:rgba(34,197,94,.05);cursor:pointer}
.km-item.active{border-color:var(--g);background:rgba(34,197,94,.12)}
.km-item-info{flex:1;min-width:0}
.km-item-name{font-family:var(--mono);font-size:12px;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.km-item-stats{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.km-item-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
.km-item-del{width:28px;height:28px;border-radius:50%;background:rgba(153,27,27,.3);border:1px solid rgba(239,68,68,.3);color:#ef4444;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.km-item-eye{width:28px;height:28px;border-radius:50%;background:rgba(34,197,94,.1);border:1px solid var(--bord);color:var(--g);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.km-item-eye.hidden{color:var(--muted);background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.1)}
.km-add-btn{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;border:1px dashed var(--bord);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;width:100%;justify-content:center}
/* REMAIN POPUP */
#remain-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:700;background:rgba(6,16,6,.98);border:1px solid var(--bord);border-radius:14px;padding:20px 22px;text-align:center;width:80%;max-width:300px;display:none;box-shadow:0 8px 32px rgba(0,0,0,.7)}
#remain-popup.show{display:block}
#remain-icon{font-size:32px;margin-bottom:8px}
#remain-text{font-family:var(--mono);font-size:13px;color:var(--txt);margin-bottom:14px;line-height:1.6}
#remain-popup button{padding:8px 20px;border-radius:8px;border:1px solid var(--g);background:rgba(34,197,94,.15);color:var(--g);font-size:13px;cursor:pointer;font-family:var(--mono)}
/* EXPORT MODAL */
#export-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;background:rgba(6,16,6,.98);border:1px solid var(--bord);border-radius:14px;padding:20px;width:88%;max-width:320px;display:none}
#export-modal.show{display:block}
#export-modal h3{font-family:var(--mono);color:var(--g);font-size:13px;margin-bottom:12px}
.exp-btn{display:block;width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--bord);background:rgba(34,197,94,.08);color:var(--txt);font-size:13px;cursor:pointer;font-family:var(--mono);text-align:left}
.exp-btn:hover{background:rgba(34,197,94,.18);border-color:var(--g);color:var(--g)}
.exp-close{background:none;border:1px solid rgba(255,255,255,.2);color:var(--muted);padding:8px;width:100%;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:12px}
/* MODAL OVERLAY */
#modal-overlay{position:fixed;inset:0;z-index:880;background:rgba(0,0,0,.6);display:none}
#modal-overlay.show{display:block}
/* SPLASH */
#splash{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:#0d1a0d;flex-direction:column}
#splash-title{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--g);letter-spacing:.15em;text-shadow:0 0 20px var(--glow);margin-bottom:6px}
#splash-sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:40px}
#splash-lens{position:relative;width:120px;height:120px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
#splash-ring1{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(34,197,94,.15)}
#splash-ring2{position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(34,197,94,.25)}
#splash-ring3{position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(34,197,94,.35);background:radial-gradient(circle, rgba(34,197,94,.1) 0%, rgba(0,0,0,.5) 100%)}
#splash-bar-wrap{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:rgba(34,197,94,.15);border-radius:2px;overflow:hidden}
#splash-bar{height:100%;width:0%;background:var(--g);border-radius:2px;box-shadow:0 0 8px var(--glow);transition:width .05s linear}
#splash-pct{position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--g)}
/* PROGRESS */
#prog{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#prog.show{display:flex}
#prog p{font-family:var(--mono);font-size:13px;color:var(--g);text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:3px solid rgba(34,197,94,.2);border-top-color:var(--g);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tst{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:1200;font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;white-space:nowrap;display:none;pointer-events:none;max-width:90%;text-align:center}
#tst.ok{background:rgba(21,128,61,.94);border:1px solid var(--g);color:#d1fae5}
#tst.wn{background:rgba(146,64,14,.94);border:1px solid var(--a);color:#fef3c7}
#tst.er{background:rgba(153,27,27,.94);border:1px solid var(--r);color:#fee2e2}
.leaflet-popup-content-wrapper{background:rgba(8,18,8,.97)!important;color:var(--txt)!important;border:1px solid var(--bord)!important;border-radius:8px!important;font-family:var(--mono);font-size:11px!important}
.leaflet-popup-tip{background:rgba(8,18,8,.97)!important}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <span class="logo">ROPhotoKml</span>
  <input id="sb" type="text" placeholder="Cauta parcela..." oninput="onSrch(this.value)" autocomplete="off">
  <select id="filter-sel" onchange="onFilterChange()" title="Filtreaza parcele">
    <option value="all">Toate</option>
    <option value="done">✓ Finalizate</option>
    <option value="todo">○ Nefinalizate</option>
  </select>
  <span id="pbg">0 foto</span>
</div>
<div id="sdrop"></div>
<div id="sidebar">
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" onclick="openKmlManager()"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9,15 12,12 15,15"/></svg><span class="sl">KML</span></button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="bgps" onclick="startGPS()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg><span class="sl">GPS</span></button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="bcomp" onclick="startCompass()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="12,2 14,9 12,12 10,9"/><polygon points="12,22 14,15 12,12 10,15" opacity=".3"/></svg><span class="sl">Busola</span></button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="bcam" onclick="toggleCam()"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="sl">Camera</span></button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb wb on" id="bbuf" onclick="toggleBuf()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span class="sl">Buffer</span></button>
  </div>
  <div class="sp"></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" onclick="centerMap()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v5M12 18v5M1 12h5M18 12h5"/></svg><span class="sl">Centru</span></button>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
    <button class="sb" id="blyr" onclick="toggleLayer()"><svg viewBox="0 0 24 24"><polygon points="12,2 22,8.5 12,15 2,8.5"/><polyline points="2,15.5 12,22 22,15.5" opacity=".4"/></svg><span class="sl">Strat</span></button>
  </div>
</div>
<div id="bot">
  <div id="pills">
    <span class="pl" id="pgps">GPS: —</span>
    <span class="pl" id="pacc">Acc: —</span>
    <span class="pl" id="palt">Alt: —</span>
    <span class="pl" id="pdir">Dir: —</span>
    <span class="pl" id="ptim">—</span>
  </div>
  <div id="pchip">
    <div id="pcid">—</div><div id="pcmt"></div>
    <div id="pcfr" class="show">
      <span id="pcfl">Camp 1:</span>
      <select id="pcfs" onchange="onFC()"></select>
    </div>
    <div id="pcfr2">
      <span id="pcfl2">Camp 2:</span>
      <select id="pcfs2" onchange="onFC2()"></select>
    </div>
  </div>
  <div id="arow">
    <div id="linfo">
      <span>Lat: <span class="lv" id="llat">—</span></span>
      <span>Lon: <span class="lv" id="llon">—</span></span>
      <span>Acc: <span class="lv" id="lacc">—</span> Alt: <span class="lv" id="lalt">—</span></span>
      <span>Dir: <span class="lv" id="ldir">—</span></span>
    </div>
    <button id="sht" disabled onclick="openCam()"><div id="sdot"></div></button>
    <button id="gbtn" onclick="openGallery()"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg><span>Galerie</span></button>
  </div>
</div>
<div id="prox">—&#10;m</div>
<!-- PARCEL POPUP — apare la tap pe poligon -->
<div id="pp-overlay" onclick="closePP()"></div>
<div id="pp">
  <div id="pp-head">
    <div id="pp-title">Parcela</div>
    <button onclick="closePP()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;line-height:1">✕</button>
  </div>
  <div id="pp-actions">
    <button class="pp-btn pp-attr"  onclick="ppShowAttr()"><span>☰</span><span>Atribute</span></button>
    <button class="pp-btn pp-done"  id="pp-done-btn" onclick="ppToggleDone()"><span id="pp-done-icon">○</span><span id="pp-done-lbl">Finalizat</span></button>
    <button class="pp-btn pp-photo" onclick="closePP();openCam()"><span>📷</span><span>Fotografie</span></button>
    <button class="pp-btn pp-del"   onclick="ppDelete()"><span>🗑</span><span>Sterge</span></button>
  </div>
</div>

<!-- ATTR WINDOW — fereastra separata cu atributele parcelei -->
<div id="aw-overlay" onclick="closeAW()"></div>
<div id="aw">
  <div id="aw-head">
    <div id="aw-title">Atribute parcela</div>
    <button onclick="closeAW()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px">✕</button>
  </div>
  <div id="aw-body"></div>
  <div id="aw-foot">
    <button onclick="closeAW();openCam()" class="aw-btn aw-cam">📷 Fotografiaza</button>
    <button onclick="closeAW()" class="aw-btn aw-cls">Inchide</button>
  </div>
</div>

<!-- DIALOG IESIRE DIN APLICATIE -->
<div id="exit-overlay"></div>
<div id="exit-dialog">
  <div id="exit-icon">🚪</div>
  <div id="exit-msg">Doriti sa iesiti din aplicatie?</div>
  <div id="exit-btns">
    <button id="exit-yes" onclick="confirmExit()">Da, iesire</button>
    <button id="exit-no"  onclick="cancelExit()">Ramane in aplicatie</button>
  </div>
</div>
<!-- CAMERA -->
<div id="camo">
  <div id="vwr">
    <video id="vid" autoplay playsinline muted></video>
    <div id="vst"><div class="vi" id="vsi">— Parcela —</div><div id="vsc">—</div><div id="vsa">—</div><div id="vsd">—</div></div>
    <button id="bcc" onclick="closeCam()">✕</button>
    <div id="zoom-slider-wrap">
      <span id="zoom-val">1×</span>
      <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1" oninput="onZoomSlider(this.value)" orient="vertical">
    </div>
  </div>
  <div id="csr"><button id="csb" onclick="doCapture()"><div id="csd"></div></button></div>
  <canvas id="cnv"></canvas>
</div>
<!-- PREVIEW -->
<div id="prevo"><img id="pimg" alt="Preview">
  <div id="pact">
    <button class="cb no" onclick="discardP()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>Renunta</span></button>
    <button class="cb ok" onclick="saveP()"><svg viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg><span>Salveaza</span></button>
  </div>
</div>
<!-- GALLERY -->
<div id="galo">
  <div id="galh"><h2>Galerie ROPhotoKml</h2><button onclick="closeGallery()">✕</button></div>
  <div id="galg"></div>
</div>
<div id="fullview"><img id="fullimg" alt=""><button id="fvclose" onclick="closeFull()">✕</button><div id="fvname"></div></div>
<!-- KML MANAGER -->
<div id="kml-manager-overlay" onclick="closeKmlManager()"></div>
<div id="kml-manager">
  <div id="km-head"><h2>Fisiere KML</h2><button onclick="closeKmlManager()">✕</button></div>
  <div id="km-body"><div id="km-list"></div>
    <label class="km-add-btn" for="kf"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Adauga KML nou</label>
    <input type="file" id="kf" accept=".kml" onchange="addKML(this)" multiple>
  </div>
</div>
<div id="remain-popup"><div id="remain-icon">📋</div><div id="remain-text"></div><button onclick="document.getElementById('remain-popup').classList.remove('show')">OK</button></div>
<!-- EXPORT MODAL -->
<div id="modal-overlay" onclick="document.getElementById('export-modal').classList.remove('show');this.classList.remove('show')"></div>
<div id="export-modal">
  <h3>Export poligoane</h3>
  <button class="exp-btn" onclick="exportFormat('kml')">📄 Export KML</button>
  <button class="exp-btn" onclick="exportFormat('geojson')">🗺 Export GeoJSON</button>
  <button class="exp-btn" onclick="exportFormat('gpx')">📍 Export GPX</button>
  <button class="exp-btn" onclick="exportFormat('shp')">🗂 Export SHP (ZIP)</button>
  <button class="exp-close" onclick="document.getElementById('export-modal').classList.remove('show');document.getElementById('modal-overlay').classList.remove('show')">Inchide</button>
</div>
<!-- SPLASH -->
<div id="splash">
  <div id="splash-lens"><div id="splash-ring1"></div><div id="splash-ring2"></div><div id="splash-ring3"></div><div id="splash-bar-wrap"><div id="splash-bar"></div></div><div id="splash-pct">0%</div></div>
  <div id="splash-title">ROPhotoKml</div>
  <div id="splash-sub">GPS · KML · APIA Maramures</div>
</div>
<div id="prog"><div class="spin"></div><p id="prog-txt">Se proceseaza...</p></div>
<div id="tst"></div>

// ── BACK BUTTON + EXIT CONFIRM ──
// Strategia multipla pentru Android WebView:
// 1. popstate (functioneaza in browser si unele WebView-uri)
// 2. JavascriptInterface onBackPressed() apelat din MainActivity.java
// 3. document.addEventListener('backbutton') pentru Capacitor/Cordova

function handleBackPress(){
  // Inchide layerul cel mai din fata
  const layers=[
    'exit-dialog','aw','fullview','prevo','camo','galo','export-modal','kml-manager','pp'
  ];
  for(const id of layers){
    const el=document.getElementById(id);
    if(el&&el.classList.contains('show')){
      if(id==='exit-dialog'){cancelExit();return true;}
      if(id==='aw'){closeAW();return true;}
      if(id==='fullview'){closeFull();return true;}
      if(id==='prevo'){discardP();return true;}
      if(id==='camo'){closeCam();return true;}
      if(id==='galo'){closeGallery();return true;}
      if(id==='export-modal'){el.classList.remove('show');const mo=document.getElementById('modal-overlay');if(mo)mo.classList.remove('show');return true;}
      if(id==='kml-manager'){closeKmlManager();return true;}
      if(id==='pp'){closePP();return true;}
    }
  }
  // Nimic deschis → dialog iesire
  showExitDialog();
  return true;
}

// Metoda 1: popstate (browser + unele WebView)
(function(){
  history.pushState({rph:1},'',location.href);
  history.pushState({rph:1},'',location.href);
  history.pushState({rph:1},'',location.href);
})();
window.addEventListener('popstate',function(e){
  history.pushState({rph:1},'',location.href);
  handleBackPress();
});

// Metoda 2: JavascriptInterface — MainActivity.java apeleaza window.onAndroidBack()
window.onAndroidBack=function(){ handleBackPress(); };

// Metoda 3: Capacitor/Cordova backbutton event
document.addEventListener('backbutton',function(e){
  e.preventDefault();
  handleBackPress();
},false);

  document.getElementById('exit-overlay').classList.add('show');
  document.getElementById('exit-dialog').classList.add('show');
}

// ── SPLASH ──
function runSplash(){
  const bar=document.getElementById('splash-bar');
  const pct=document.getElementById('splash-pct');
  const splash=document.getElementById('splash');
  let p=0;
  const iv=setInterval(()=>{
    p+=Math.random()*4+1.5;
    if(p>=100){p=100;clearInterval(iv);
      bar.style.width='100%';pct.textContent='100%';
      setTimeout(()=>{splash.style.transition='opacity 0.5s';splash.style.opacity='0';
        setTimeout(()=>{splash.style.display='none';loadState();},500);},400);
    }

  },50);
}

// ── PERSIST ──
function saveState(){
  try{
    const data={
      kmlStore:kmlStore.map(k=>({id:k.id,name:k.name,xml:k.xml,visible:k.visible!==false,
        doneIds:k.feats?k.feats.filter(f=>f._done).map(f=>f['__nm__']||f[Object.keys(f).find(kk=>!kk.startsWith('_'))]||'').filter(Boolean):[]
      })),
      activeKmlId
    };
    localStorage.setItem(LS_KEY,JSON.stringify(data));
  }catch(e){}
}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return;
    const data=JSON.parse(raw);
    if(data.kmlStore&&data.kmlStore.length){
      data.kmlStore.forEach(k=>{
        if(kmlStore.find(x=>x.id===k.id))return;
        kmlStore.push({id:k.id,name:k.name,xml:k.xml,visible:k.visible!==false,feats:null,doneIds:k.doneIds||[]});
      });
    }
    // Draw all visible KMLs
    kmlStore.filter(k=>k.visible!==false).forEach(k=>parseAndActivateKML(k,false));
    if(data.activeKmlId){
      activeKmlId=data.activeKmlId;
      const k=kmlStore.find(x=>x.id===activeKmlId);
      if(k){feats=k.feats||[];kmlName=k.name;allF=k._allF||[];buildFS();}
    }
  }catch(e){}
}

// ── EXPORT ──
function exportFormat(fmt){
  document.getElementById('export-modal').classList.remove('show');
  document.getElementById('modal-overlay').classList.remove('show');
  if(fmt==='kml') exportKML();
  else if(fmt==='geojson') exportGeoJSON();
  else if(fmt==='gpx') exportGPX();
  else if(fmt==='shp') exportSHP();
}

function featsToGeoJSON(){
  return {type:'FeatureCollection',features:feats.map((f,i)=>({
    type:'Feature',
    properties:Object.fromEntries(Object.entries(f).filter(([k])=>!k.startsWith('_'))),
    geometry:f._c.length>=3?{type:'Polygon',coordinates:[[...f._c.map(c=>[c[1],c[0]]),f._c.length?[f._c[0][1],f._c[0][0]]:[]]]}:null
  })).filter(f=>f.geometry)};
}

function exportKML(){
  const fc=featsToGeoJSON();
  let kml='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n';
  fc.features.forEach(f=>{
    const name=f.properties.__nm__||f.properties[Object.keys(f.properties)[0]]||'Parcela';
    const coords=f.geometry.coordinates[0].map(c=>c[0]+','+c[1]+',0').join('\n');
    kml+=`<Placemark><name>${name}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${coords}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n`;
  });
  kml+='</Document>\n</kml>';
  dlText(kml,kmlName+'_export.kml','application/vnd.google-earth.kml+xml');
  toast('KML exportat','ok');
}

function exportGeoJSON(){
  dlText(JSON.stringify(featsToGeoJSON(),null,2),kmlName+'_export.geojson','application/geo+json');
  toast('GeoJSON exportat','ok');
}

function exportGPX(){
  const fc=featsToGeoJSON();
  let gpx='<?xml version="1.0"?>\n<gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1">\n';
  fc.features.forEach(f=>{
    gpx+='<trk><name>'+(f.properties.__nm__||'Parcela')+'</name><trkseg>\n';
    f.geometry.coordinates[0].forEach(c=>{gpx+='<trkpt lat="'+c[1]+'" lon="'+c[0]+'"></trkpt>\n';});
    gpx+='</trkseg></trk>\n';
  });
  gpx+='</gpx>';
  dlText(gpx,kmlName+'_export.gpx','application/gpx+xml');
  toast('GPX exportat','ok');
}

function exportSHP(){
  // SHP necesita biblioteca externa — exportam GeoJSON cu nota
  toast('SHP: exportam GeoJSON (importabil in QGIS ca SHP)','wn');
  exportGeoJSON();
}

function dlText(content,filename,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
}

// ── KML MANAGER ──
function openKmlManager(){renderKmlList();document.getElementById('kml-manager').classList.add('show');document.getElementById('kml-manager-overlay').classList.add('show');}
function closeKmlManager(){document.getElementById('kml-manager').classList.remove('show');document.getElementById('kml-manager-overlay').classList.remove('show');}

function renderKmlList(){
  const list=document.getElementById('km-list');list.innerHTML='';
  if(!kmlStore.length){list.innerHTML='<div style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;padding:20px">Niciun KML incarcat</div>';return;}
  kmlStore.forEach(k=>{
    const total=k.feats?k.feats.length:0;
    const done=k.feats?k.feats.filter(f=>f._done).length:0;
    const isActive=k.id===activeKmlId;
    const isVisible=k.visible!==false;
    const div=document.createElement('div');
    div.className='km-item'+(isActive?' active':'');
    div.innerHTML=
      '<div class="km-item-info" onclick="activateKML(\''+ k.id +'\')">'
        +'<div class="km-item-name">'+ex(k.name)+'</div>'
        +'<div class="km-item-stats">'+total+' parcele · '+done+' fin. · '+(total-done)+' ramase</div>'
      +'</div>'
      +'<div class="km-item-actions">'
        +'<button class="km-item-eye'+(isVisible?'':' hidden')+'" onclick="toggleKmlVisibility(\''+ k.id +'\')" title="Vizibilitate">'+(isVisible?'👁':'🚫')+'</button>'
        +'<button class="km-item-del" onclick="deleteKML(\''+ k.id +'\')" title="Sterge">✕</button>'
      +'</div>';
    list.appendChild(div);
  });
}

function toggleKmlVisibility(id){
  const k=kmlStore.find(x=>x.id===id);
  if(!k)return;
  k.visible=!(k.visible!==false);
  // Show/hide layers
  polyL.forEach(pl=>{
    if(pl._kmlId===id){
      if(k.visible){if(!map.hasLayer(pl.ly))pl.ly.addTo(map);if(pl.mk&&!map.hasLayer(pl.mk))pl.mk.addTo(map);}
      else{if(map.hasLayer(pl.ly))map.removeLayer(pl.ly);if(pl.mk&&map.hasLayer(pl.mk))map.removeLayer(pl.mk);}
    }
  });
  saveState();renderKmlList();
  toast(k.visible?'KML vizibil':'KML ascuns','ok');
}

function addKML(inp){
  const files=Array.from(inp.files);
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      const id='kml_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
      const name=file.name.replace(/\.kml$/i,'');
      const entry={id,name,xml:e.target.result,feats:null,doneIds:[],visible:true};
      kmlStore.push(entry);
      parseAndActivateKML(entry,true);
      saveState();renderKmlList();
      toast('KML adaugat: '+name,'ok');
    };
    r.readAsText(file);
  });
  inp.value='';
}

function activateKML(id){
  const k=kmlStore.find(x=>x.id===id);
  if(!k)return;
  activeKmlId=id;
  feats=k.feats||[];kmlName=k.name;allF=k._allF||[];
  buildFS();drawActive();
  const total=feats.length,done=feats.filter(f=>f._done).length,remain=total-done;
  const el=document.getElementById('remain-popup');
  document.getElementById('remain-icon').textContent=remain===0?'✅':'📋';
  document.getElementById('remain-text').textContent=remain===0?'Toate '+total+' parcele finalizate!':'Mai aveti '+remain+' parcele de finalizat din '+total;
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),5000);
  closeKmlManager();saveState();
}

function deleteKML(id){
  if(!confirm('Stergi acest KML?'))return;
  // Remove layers
  polyL=polyL.filter(pl=>{
    if(pl._kmlId===id){map.removeLayer(pl.ly);if(pl.mk)map.removeLayer(pl.mk);return false;}
    return true;
  });
  kmlStore=kmlStore.filter(x=>x.id!==id);
  if(activeKmlId===id){activeKmlId=null;feats=[];kmlName='';allF=[];buildFS();}
  saveState();renderKmlList();toast('KML sters','ok');
}

function parseAndActivateKML(k,showRemain){
  if(!k.feats){
    const result=parseKMLXml(k.xml,k.doneIds||[]);
    k.feats=result.feats;k._allF=result.allF;
  }
  if(k.doneIds&&k.doneIds.length){
    k.feats.forEach(f=>{
      const fid=f['__nm__']||f[Object.keys(f).find(key=>!key.startsWith('_'))]||''
      if(k.doneIds.includes(fid))f._done=true;
    });
  }
  // Set active
  activeKmlId=k.id;
  feats=k.feats;kmlName=k.name;allF=k._allF||[];
  selField='';buildFS();
  // Draw this KML layers (all visible KMLs)
  drawKMLLayer(k);
  fitAll();
  if(showRemain){
    const total=feats.length,done=feats.filter(f=>f._done).length,remain=total-done;
    const el=document.getElementById('remain-popup');
    document.getElementById('remain-icon').textContent=remain===0?'✅':'📋';
    document.getElementById('remain-text').textContent=remain===0?'Toate '+total+' parcele finalizate!':'Mai aveti '+remain+' parcele\nde finalizat din total '+total;
    el.classList.add('show');setTimeout(()=>el.classList.remove('show'),5000);
  }
}

function parseKMLXml(xml,doneIds){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  const parsed=[];const fs=new Set();

  // Extrage stilurile definite in KML (color/fillColor per styleId)
  const styleMap={};
  doc.querySelectorAll('Style').forEach(s=>{
    const sid=s.getAttribute('id');
    if(!sid)return;
    // PolyStyle
    const ps=s.querySelector('PolyStyle');
    const ls=s.querySelector('LineStyle');
    let fillColor='#22c55e',strokeColor='#22c55e',fillOpacity=0.15;
    if(ps){
      const c=ps.querySelector('color');
      if(c){
        const abgr=c.textContent.trim();
        if(abgr.length===8){
          const a=parseInt(abgr.substring(0,2),16)/255;
          const b=abgr.substring(2,4);const g=abgr.substring(4,6);const r=abgr.substring(6,8);
          fillColor='#'+r+g+b;fillOpacity=Math.min(0.6,Math.max(0.05,a*0.6));
        }
      }
    }
    if(ls){
      const c=ls.querySelector('color');
      if(c){
        const abgr=c.textContent.trim();
        if(abgr.length===8){
          const b=abgr.substring(2,4);const g=abgr.substring(4,6);const r=abgr.substring(6,8);
          strokeColor='#'+r+g+b;
        }
      }
    }
    styleMap['#'+sid]={fillColor,strokeColor,fillOpacity};
  });
  // StyleMap — mapeaza normal/highlight
  const styleMappings={};
  doc.querySelectorAll('StyleMap').forEach(sm=>{
    const sid=sm.getAttribute('id');
    if(!sid)return;
    sm.querySelectorAll('Pair').forEach(pair=>{
      const key=pair.querySelector('key');
      const url=pair.querySelector('styleUrl');
      if(key&&key.textContent.trim()==='normal'&&url){
        styleMappings['#'+sid]=url.textContent.trim();
      }
    });
  });

  doc.querySelectorAll('Placemark').forEach(pm=>{
    const f={_c:[],_ctr:null,_done:false,_style:null};
    pm.querySelectorAll('SimpleData').forEach(sd=>{const n=sd.getAttribute('name');f[n]=sd.textContent.trim();fs.add(n);});
    pm.querySelectorAll('Data').forEach(d=>{const n=d.getAttribute('name');const v=d.querySelector('value');if(v){f[n]=v.textContent.trim();fs.add(n);}});
    const ne=pm.querySelector('name');if(ne){f['__nm__']=ne.textContent.trim();fs.add('__nm__');}
    // Extrage stil
    const su=pm.querySelector('styleUrl');
    if(su){
      let sid=su.textContent.trim();
      if(styleMappings[sid])sid=styleMappings[sid];
      if(styleMap[sid])f._style=styleMap[sid];
    }
    const cs=[];
    pm.querySelectorAll('coordinates').forEach(c=>{
      c.textContent.trim().split(/\s+/).forEach(t=>{
        const p=t.split(',');if(p.length>=2){const lo=parseFloat(p[0]),la=parseFloat(p[1]);if(!isNaN(lo)&&!isNaN(la))cs.push([la,lo]);}
      });
    });
    f._c=cs;
    if(cs.length){const las=cs.map(c=>c[0]),los=cs.map(c=>c[1]);f._ctr=[(Math.min(...las)+Math.max(...las))/2,(Math.min(...los)+Math.max(...los))/2];}
    parsed.push(f);
  });
  allF=Array.from(fs);
  return{feats:parsed,allF:Array.from(fs)};
}

function buildFS(){
  const s=document.getElementById('pcfs');
  const s2=document.getElementById('pcfs2');
  if(!s)return;
  s.innerHTML=''; if(s2)s2.innerHTML='<option value="">— niciunul —</option>';
  if(!allF||!allF.length){
    document.getElementById('pcfr').classList.remove('show');
    document.getElementById('pcfr2').classList.remove('show');
    document.getElementById('pchip').classList.remove('show');
    return;
  }
  const addOpts=(sel,includeNone)=>{
    if(includeNone){const o=document.createElement('option');o.value='';o.textContent='— niciunul —';sel.appendChild(o);}
    if(allF.includes('__nm__')){const o=document.createElement('option');o.value='__nm__';o.textContent='Name';sel.appendChild(o);}
    allF.forEach(f=>{if(f==='__nm__')return;const o=document.createElement('option');o.value=f;o.textContent=f;sel.appendChild(o);});
  };
  addOpts(s,false);
  if(s2)addOpts(s2,true);
  selField=s.value||'';
  document.getElementById('pcfr').classList.add('show');
  document.getElementById('pcfr2').classList.add('show');
  document.getElementById('pchip').classList.add('show');
}

function onFC2(){updSt();} // al doilea camp e folosit doar pe poza
function lbl(f){if(!selField)return f['__nm__']||'—';const k=selField==='__nm__'?'__nm__':selField;return(selField==='__nm__'?'':selField+': ')+(f[k]||'—');}
function ex(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── DRAW LAYERS ──
// Draw a single KML's layers — supports multiple KMLs visible simultaneously
function drawKMLLayer(k){
  if(!k.feats)return;
  // Remove old layers for this KML
  polyL=polyL.filter(pl=>{
    if(pl._kmlId===k.id){map.removeLayer(pl.ly);if(pl.mk)map.removeLayer(pl.mk);return false;}
    return true;
  });
  if(k.visible===false)return;
  k.feats.forEach((f,i)=>{
    if(f._c.length<2)return;
    const sel=(curF===f),done=!!f._done;
    // Culori din KML sau default
    const kmlFill=(f._style&&f._style.fillColor)||'#22c55e';
    const kmlStroke=(f._style&&f._style.strokeColor)||'#22c55e';
    const kmlOpacity=(f._style&&f._style.fillOpacity)||0.12;
    let style;
    if(done){
      // Finalizat: contur verde + hasura
      style={color:'#22c55e',fillColor:'#22c55e',fillOpacity:.35,weight:2.5,dashArray:'6,4'};
    } else if(sel){
      // Selectat: portocaliu cu fill usor
      style={color:'#f59e0b',fillColor:'#f59e0b',fillOpacity:.15,weight:3,dashArray:'7,4'};
    } else {
      // Normal: doar contur, fara fill
      style={color:kmlStroke,fillColor:kmlFill,fillOpacity:0,weight:2,dashArray:null};
    }
    // fillOpacity 0 blocheaza click-urile in Leaflet — folosim minim 0.01
    if(style.fillOpacity===0)style.fillOpacity=0.01;
    const ly=L.polygon(f._c,{...style,interactive:true,bubblingMouseEvents:false});
    // Salveaza stilul original pentru restaurare
    ly._origStyle={color:kmlStroke,fillColor:kmlFill,fillOpacity:0.01,weight:2};
    let mk=null;
    if(f._ctr){
      const ico=L.divIcon({className:'',iconAnchor:[0,8],
        html:'<div style="background:rgba(0,0,0,.82);color:#FAC775;font-family:monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;border:1px solid rgba(250,199,117,.4);white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.7)">'+ex(lbl(f))+'</div>'
      });
      mk=L.marker(f._ctr,{icon:ico,interactive:false}).addTo(map);
    }
    ly.on('click',()=>selParcel(f,ly,i));
    ly._feat=f;ly._kmlId=k.id;
    ly.addTo(map);
    polyL.push({ly,mk,f,i,_kmlId:k.id});
  });
}

function drawActive(){
  // Redraw only active KML layers
  const k=kmlStore.find(x=>x.id===activeKmlId);
  if(k)drawKMLLayer(k);
}

function fitAll(){
  const all=feats.flatMap(f=>f._c);
  if(all.length){const las=all.map(c=>c[0]),los=all.map(c=>c[1]);
    map.fitBounds([[Math.min(...las),Math.min(...los)],[Math.max(...las),Math.max(...los)]],{padding:[50,50]});}
}

function selParcel(f,ly,idx){
  if(selLy&&selLy!==ly){
    const prev=selLy._feat;
    if(prev&&prev._done){
      selLy.setStyle({color:'#22c55e',fillColor:'#22c55e',fillOpacity:.35,weight:2,dashArray:null});
    } else {
      // Restaureaza culoarea originala din KML
      const origStyle=selLy._origStyle||{color:'#22c55e',fillColor:'#22c55e',fillOpacity:0.01,weight:2};
      selLy.setStyle({...origStyle,dashArray:null});
    }
  }
  curF=f; selLy=ly; ly._feat=f;
  if(!f._done){
    // Salveaza stilul original inainte de selectare
    if(!ly._origStyle) ly._origStyle={color:ly.options.color,fillColor:ly.options.fillColor,fillOpacity:ly.options.fillOpacity,weight:ly.options.weight};
    ly.setStyle({color:'#f59e0b',fillColor:'#f59e0b',fillOpacity:.28,weight:3,dashArray:'7,4'});
  }
  map.fitBounds(ly.getBounds(),{padding:[40,40],maxZoom:18});
  updChip();updSt();chkProx();
  showPP(f);
}

  document.getElementById('pp-done-lbl').textContent=isDone?'Finalizata':'Finalizat';

  document.getElementById('pp-overlay').classList.add('show');
  document.getElementById('pp').classList.add('show');
}
function closePP(){

}

  document.getElementById('aw').classList.remove('show');
}

// Buton Finalizat
function ppToggleDone(){
  if(!curF)return;
  if(!curF._done){

function hav(a1,o1,a2,o2){
  const R=6371000,da=(a2-a1)*Math.PI/180,doo=(o2-o1)*Math.PI/180;
  const s=Math.sin(da/2)**2+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(doo/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function pip(la,lo,cs){let ins=false;for(let i=0,j=cs.length-1;i<cs.length;j=i++){const xi=cs[i][0],yi=cs[i][1],xj=cs[j][0],yj=cs[j][1];if((yi>lo)!==(yj>lo)&&la<(xj-xi)*(lo-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function dseg(la,lo,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];if(!dx&&!dy)return hav(la,lo,a[0],a[1]);const t=Math.max(0,Math.min(1,((la-a[0])*dx+(lo-a[1])*dy)/(dx*dx+dy*dy)));return hav(la,lo,a[0]+t*dx,a[1]+t*dy);}
function d2poly(la,lo,cs){if(pip(la,lo,cs))return 0;let m=Infinity;for(let i=0;i<cs.length-1;i++){const d=dseg(la,lo,cs[i],cs[i+1]);if(d<m)m=d;}return m;}

(function(){

                             e.touches[0].clientY-e.touches[1].clientY);

// ══════════════════════════════════════════════════
// EXIF BUILDER — WGS84, little-endian TIFF
// Coordonate in format decimal: 47.123456, 23.123456
// Convertite intern in DMS pentru EXIF standard
// ══════════════════════════════════════════════════
function buildEXIF(dtStr, latV, lonV, altV, hdgV) {
  const B = [];
  function u16(v){ B.push(v&0xFF,(v>>8)&0xFF); }
  function u32(v){ B.push(v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>24)&0xFF); }
  function u16be(v){ return [(v>>8)&0xFF,v&0xFF]; }
  function asc(s){ for(let i=0;i<s.length;i++)B.push(s.charCodeAt(i)&0xFF);B.push(0); }
  function pad(to){ while(B.length<to)B.push(0); }

  // Convert decimal degrees WGS84 to DMS rationals (24 bytes = 3 RATIONALs)
  function dms(deg){
    const a=Math.abs(deg);
    const d=Math.floor(a);
    const mf=(a-d)*60;
    const m=Math.floor(mf);
    const s=(mf-m)*60;
    const sN=Math.round(s*1000000); // microseconds precision
    const sD=1000000;
    // d/1, m/1, sN/sD
    return [d,1, m,1, sN,sD]; // 3 pairs → 6 u32 values → 24 bytes
  }

  // Fixed layout:
  // 0..7   TIFF header
  // 8..61  IFD0 (4 entries = 2+4*12+4 = 54 bytes)
  // 62..81 DateTime ASCII (20 bytes)
  // 82..111 ExifIFD (2 entries = 2+2*12+4 = 30 bytes)
  // 112..131 DateTimeOriginal
  // 132..151 DateTimeDigitized
  // 152..   GPS IFD

  const IFD0=8, DT_D=62, EXIF_IFD=82, DTO_D=112, DTG_D=132, GPS_IFD=152;

  // TIFF header
  B.push(0x49,0x49,0x2A,0x00);u32(IFD0); // II + magic + IFD0 offset

  // IFD0 at offset 8 — 4 entries
  u16(4); // entry count
  // DateTime 0x0132 ASCII 20
  u16(0x0132);u16(2);u32(20);u32(DT_D);
  // Make 0x010F ASCII 4 inline
  u16(0x010F);u16(2);u32(4);B.push(82,80,75,0); // 'RPK\0'
  // ExifIFD 0x8769 LONG
  u16(0x8769);u16(4);u32(1);u32(EXIF_IFD);
  // GPS IFD 0x8825 LONG
  u16(0x8825);u16(4);u32(1);u32(GPS_IFD);
  u32(0); // next IFD=0

  // DateTime at 62
  pad(DT_D); asc(dtStr); // 20 bytes

  // ExifIFD at 82
  pad(EXIF_IFD);
  u16(2);
  u16(0x9003);u16(2);u32(20);u32(DTO_D);  // DateTimeOriginal
  u16(0x9291);u16(2);u32(20);u32(DTG_D);  // DateTimeDigitized
  u32(0);

  // DateTimeOriginal at 112
  pad(DTO_D); asc(dtStr);
  // DateTimeDigitized at 132
  pad(DTG_D); asc(dtStr);

  // GPS IFD at 152 — dynamic entries
  pad(GPS_IFD);
  const gpsEntries=[];
  const gpsHeap=[];

  function heapRat(n,d){ const o=gpsHeap.length; const a=[];const push32=(v,ar)=>{ar.push(v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>24)&0xFF);};push32(n,gpsHeap);push32(d,gpsHeap);return o;}
  function heapDMS(deg){
    const vals=dms(deg);const o=gpsHeap.length;
    for(let i=0;i<6;i+=2){const n=vals[i],d=vals[i+1];gpsHeap.push(n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF,d&0xFF,(d>>8)&0xFF,(d>>16)&0xFF,(d>>24)&0xFF);}
    return o;
  }

  if(latV!=null&&lonV!=null){
    gpsEntries.push({tag:0x0000,type:1,count:4,inline:[2,3,0,0]}); // GPSVersionID
    gpsEntries.push({tag:0x0001,type:2,count:2,inline:[latV>=0?78:83,0,0,0]}); // LatRef N/S
    gpsEntries.push({tag:0x0002,type:5,count:3,heap:heapDMS(latV)}); // Lat DMS
    gpsEntries.push({tag:0x0003,type:2,count:2,inline:[lonV>=0?69:87,0,0,0]}); // LonRef E/W
    gpsEntries.push({tag:0x0004,type:5,count:3,heap:heapDMS(lonV)}); // Lon DMS
  }
  if(altV!=null){
    gpsEntries.push({tag:0x0005,type:1,count:1,inline:[altV>=0?0:1,0,0,0]});
    gpsEntries.push({tag:0x0006,type:5,count:1,heap:heapRat(Math.round(Math.abs(altV)*100),100)});
  }
  if(hdgV!=null){
    gpsEntries.push({tag:0x0010,type:2,count:2,inline:[84,0,0,0]}); // 'T\0' True heading
    gpsEntries.push({tag:0x0011,type:5,count:1,heap:heapRat(Math.round(hdgV*100),100)});
  }

  // GPS IFD size = 2 + N*12 + 4
  const GPS_HEAP_BASE = GPS_IFD + 2 + gpsEntries.length*12 + 4;

  u16(gpsEntries.length);
  gpsEntries.forEach(e=>{
    u16(e.tag);u16(e.type);u32(e.count);
    if(e.inline!==undefined){B.push(...e.inline.slice(0,4));}
    else{u32(GPS_HEAP_BASE+e.heap);}
  });
  u32(0); // next GPS IFD=0
  B.push(...gpsHeap);

  // Wrap in APP1
  const exifH=[0x45,0x78,0x69,0x66,0x00,0x00];
  const app1Body=[...exifH,...B];
  const lenBytes=u16be(app1Body.length+2);
  return new Uint8Array([0xFF,0xE1,...lenBytes,...app1Body]);
}


// ── CAPTURE — format referinta (Conota style) ──
function doCapture(){
  const vid=document.getElementById('vid');
  if(!vid.videoWidth){toast('Camera nu e gata','wn');return;}
  showProg('Se captureaza...');
  const w=vid.videoWidth,h=vid.videoHeight;
  const cnv=document.getElementById('cnv');
  cnv.width=w;cnv.height=h;
  const ctx=cnv.getContext('2d');
  ctx.drawImage(vid,0,0,w,h);

  const pd=n=>String(n).padStart(2,'0');
  const now=new Date();
  const dtExif=now.getFullYear()+':'+pd(now.getMonth()+1)+':'+pd(now.getDate())+' '+pd(now.getHours())+':'+pd(now.getMinutes())+':'+pd(now.getSeconds());

  // Parcela ID (ex: RO004648125.6.2)
  const parcelId=(curF&&selField&&curF[selField])?curF[selField]:(curF&&curF['__nm__']?curF['__nm__']:'');
  // Filename
  const pid=parcelId.replace(/[^a-zA-Z0-9_\-]/g,'_').substring(0,60);
  lastFname=pid+'_'+(pCnt+1)+'.jpg';

  // Date pentru text overlay
  const dtFmt=pd(now.getDate())+'.'+pd(now.getMonth()+1)+'.'+now.getFullYear();
  const timeFmt=pd(now.getHours())+':'+pd(now.getMinutes());
  const latStr=lat?lat.toFixed(5):'—';
  const lonStr=lon?lon.toFixed(5):'—';
  const accStr=acc?'(±'+Math.round(acc)+'m)':'';
  const altStr=alt!=null?Math.round(alt)+'m':'—';
  const orientare=hdg!=null?cdir(hdg):'—';

  // ── OVERLAY TEXT (bottom-left, stil Conota) ──
  const fs=Math.max(20,Math.round(h*0.025));
  const pp=Math.round(fs*0.6);
  const lh=Math.round(fs*1.55);

  // Al doilea camp selectat
  const s2el=document.getElementById('pcfs2');
  const field2=s2el?s2el.value:'';
  const field2val=(field2&&curF&&curF[field2]&&curF[field2]!==parcelId)?curF[field2]:'';

  const lines=[
    parcelId,
    field2val,
    kmlName||'',
    dtFmt+' '+timeFmt,
    latStr+', '+lonStr+' '+accStr,
    'Altitude: '+altStr,
    cachedUAT||'',
  ].filter(l=>l!=='');

  // Calculeaza dimensiunea box-ului de text
  ctx.font=fs+'px Arial,sans-serif';
  let maxW=0;
  lines.forEach(l=>{const m=ctx.measureText(l).width;if(m>maxW)maxW=m;});
  const boxW=maxW+pp*2;
  const boxH=lines.length*lh+pp*2;
  const boxX=pp/2;
  const boxY=h-boxH-pp/2;

  // ── LOGO APIA (stanga jos, deasupra textului) ──
  const logoSize=Math.round(h*0.14); // ~14% din inaltime
  const logoX=pp/2;
  const logoY=boxY-logoSize-pp/2;

  const finishWithLogo=(logoImg)=>{
    // Deseneaza logo
    if(logoImg){
      ctx.save();
      ctx.beginPath();
      ctx.arc(logoX+logoSize/2,logoY+logoSize/2,logoSize/2,0,Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(logoImg,logoX,logoY,logoSize,logoSize);
      ctx.restore();
    }

    // ── TEXT BOX semitransparent ──
    ctx.fillStyle='rgba(0,0,0,0.52)';
    ctx.fillRect(boxX,boxY,boxW,boxH);

    ctx.font=fs+'px Arial,sans-serif';
    ctx.fillStyle='#ffffff';
    lines.forEach((line,i)=>{
      ctx.fillText(line,boxX+pp,boxY+pp+fs+i*lh);
    });

    // ── ORIENTARE (colt dreapta jos) — sageata + text ──
    const arrowSize=Math.round(h*0.07);
    const arrowX=w-arrowSize-pp;
    const arrowY=h-arrowSize*2-pp;
    drawCompassArrow(ctx,arrowX+arrowSize/2,arrowY+arrowSize/2,arrowSize/2,hdg||0,orientare);

    finishCapture();
  };

  // Incarca logo APIA
  const logoImg=new Image();
  logoImg.onload=()=>finishWithLogo(logoImg);
  logoImg.onerror=()=>finishWithLogo(null);
  logoImg.src=APIA_LOGO;

  function drawCompassArrow(ctx,cx,cy,r,angleDeg,label){
    const rad=(angleDeg-90)*Math.PI/180;
    // Cerc fundal
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.45)';
    ctx.beginPath();ctx.arc(cx,cy,r+6,0,Math.PI*2);ctx.fill();
    // Sageata nord (alba)
    ctx.translate(cx,cy);ctx.rotate(rad);
    ctx.beginPath();
    ctx.moveTo(0,-r*0.9);
    ctx.lineTo(r*0.3,r*0.5);
    ctx.lineTo(0,r*0.2);
    ctx.lineTo(-r*0.3,r*0.5);
    ctx.closePath();
    ctx.fillStyle='#ffffff';ctx.fill();
    ctx.restore();
    // Label directie
    ctx.font='bold '+Math.round(r*0.65)+'px Arial';
    ctx.fillStyle='#ffffff';
    ctx.textAlign='center';
    ctx.fillText(label,cx,cy+r+Math.round(r*0.9));
    ctx.textAlign='left';
  }

  function finishCapture(){
    showProg('Se aplica EXIF WGS84...');
    try{
      const dataURL=cnv.toDataURL('image/jpeg',0.95);
      const b64=dataURL.split(',')[1];
      const binStr=atob(b64);
      const orig=new Uint8Array(binStr.length);
      for(let i=0;i<binStr.length;i++)orig[i]=binStr.charCodeAt(i);
      let skip=2;
      while(skip<orig.length-3&&orig[skip]===0xFF){
        const mt=orig[skip+1];
        if(mt>=0xE0&&mt<=0xEF){const ml=(orig[skip+2]<<8)|orig[skip+3];skip+=2+ml;}
        else break;
      }
      const app1=buildEXIF(dtExif,lat,lon,alt,hdg);
      const out=new Uint8Array(2+app1.length+orig.length-skip);
      out[0]=0xFF;out[1]=0xD8;out.set(app1,2);out.set(orig.slice(skip),2+app1.length);
      let bin='';const cs=8192;
      for(let i=0;i<out.length;i+=cs)bin+=String.fromCharCode(...out.slice(i,i+cs));
      lastB64=btoa(bin);
      showPreview('data:image/jpeg;base64,'+lastB64);
    }catch(err){
      lastB64=cnv.toDataURL('image/jpeg',0.95).split(',')[1];
      showPreview('data:image/jpeg;base64,'+lastB64);
    }
  }
}

function showPreview(dataUrl){hideProg();document.getElementById('pimg').src=dataUrl;closeCam();document.getElementById('prevo').classList.add('show');}


// ── SAVE ──
function saveP(){
  if(!lastB64){toast('Nu exista fotografie','er');return;}
  showProg('Se salveaza...');

  // Adauga in galeria sesiunii intotdeauna
  pCnt++;
  gallery.push({b64:lastB64,name:lastFname});
  const b=document.getElementById('pbg');
  b.style.display='block';b.textContent=pCnt+' foto';
  document.getElementById('prevo').classList.remove('show');

  // METODA 1: JavascriptInterface nativ Android (APK)
  // AndroidPhotoSaver e injectat de MainActivity.java
  if(window.AndroidPhotoSaver){
    try{
      const result = window.AndroidPhotoSaver.savePhoto(lastB64, lastFname);
      hideProg();
      if(result && result.startsWith('OK')){
        toast('✓ Salvat in DCIM/ROPhotoKml','ok');
      } else {
        toast('Eroare Android: '+(result||'necunoscuta'),'er');
      }
      return;
    }catch(e){
      console.warn('AndroidPhotoSaver err:',e);
    }
  }

  // METODA 2: download blob (browser web / fallback)
  hideProg();
  try{
    const bin=atob(lastB64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    const blob=new Blob([arr],{type:'image/jpeg'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=lastFname;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},3000);
    toast('✓ Descarcat: '+lastFname,'ok');
  }catch(e){
    toast('Eroare salvare: '+e.message,'er');
  }
}
function discardP(){document.getElementById('prevo').classList.remove('show');document.getElementById('camo').classList.add('show');}

// ── GALLERY ──
function openGallery(){
  const g=document.getElementById('galg');g.innerHTML='';
  if(!gallery.length){
    g.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">Nu exista fotografii in aceasta sesiune.</div>';
  }else{
    gallery.forEach((p,i)=>{
      const d=document.createElement('div');d.className='gt';
      d.innerHTML='<img src="data:image/jpeg;base64,'+p.b64+'" onclick="openFull('+i+')" loading="lazy">'
        +'<button class="gd" onclick="delPhoto('+i+')">✕</button>'
        +'<div class="gname">'+ex(p.name)+'</div>';
      g.appendChild(d);
    });
  }
  document.getElementById('galo').classList.add('show');
}
function closeGallery(){document.getElementById('galo').classList.remove('show');}
function openFull(i){
  document.getElementById('fullimg').src='data:image/jpeg;base64,'+gallery[i].b64;
  document.getElementById('fvname').textContent=gallery[i].name;
  document.getElementById('fullview').classList.add('show');
}
function closeFull(){document.getElementById('fullview').classList.remove('show');}
function delPhoto(i){
  if(!confirm('Stergi fotografia "'+gallery[i].name+'"?'))return;
  gallery.splice(i,1);openGallery();
}

function closeGallery(){document.getElementById('galo').classList.remove('show');}
function openFull(i){document.getElementById('fullimg').src='data:image/jpeg;base64,'+gallery[i].b64;document.getElementById('fvname').textContent=gallery[i].name;document.getElementById('fullview').classList.add('show');history.pushState(null,'',location.href);}
function closeFull(){document.getElementById('fullview').classList.remove('show');}
function delPhoto(i){if(!confirm('Stergi?'))return;gallery.splice(i,1);openGallery();}
function centerMap(){if(lat)map.setView([lat,lon],18);else toast('Activeaza GPS','wn');}
function showProg(msg){document.getElementById('prog-txt').textContent=msg;document.getElementById('prog').classList.add('show');}
function hideProg(){document.getElementById('prog').classList.remove('show');}
function toast(msg,type){const el=document.getElementById('tst');el.textContent=msg;el.className=type;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',5000);}
updSt();
