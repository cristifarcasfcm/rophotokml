<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ROPhotoKml - APIA Maramureș</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --g:#22c55e;--glow:rgba(34,197,94,.35);--a:#f59e0b;--r:#ef4444;
  --surf:rgba(8,18,8,.92);--bord:rgba(34,197,94,.22);--txt:#e8f5e8;
  --muted:#4a7a4a;--mono:'Courier New',monospace;
}
html,body{height:100%;overflow:hidden;background:#0d1a0d;color:var(--txt);font-family:system-ui,sans-serif}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:#1a2d1a!important}
.leaflet-control-zoom{display:none!important}

/* TOP BAR */
#top{
  position:fixed;top:0;left:52px;right:0;z-index:300;padding:6px 8px;
  display:flex;align-items:center;gap:6px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.88) 70%,transparent)
}
#top>*{pointer-events:auto}
.logo{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--g);letter-spacing:.1em;flex-shrink:0}
#sb{flex:1;min-width:0;padding:5px 10px;border-radius:20px;border:1px solid var(--bord);background:rgba(0,0,0,.65);color:var(--txt);font-size:11px;outline:none;font-family:var(--mono)}
#sb::placeholder{color:var(--muted)}
#filter-sel{background:rgba(0,0,0,.6);border:1px solid var(--bord);color:var(--txt);font-family:var(--mono);font-size:10px;padding:4px 6px;border-radius:8px;outline:none;cursor:pointer;flex-shrink:0}
#pbg{flex-shrink:0;background:rgba(34,197,94,.12);border:1px solid var(--bord);color:var(--g);font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:20px;white-space:nowrap;display:none}
#sdrop{position:fixed;top:42px;left:56px;right:8px;z-index:500;background:rgba(8,18,8,.97);border:1px solid var(--bord);border-radius:10px;max-height:180px;overflow-y:auto;display:none}
.si{padding:8px 12px;font-family:var(--mono);font-size:11px;cursor:pointer;border-bottom:1px solid rgba(34,197,94,.08);color:var(--txt)}
.si:active{background:rgba(34,197,94,.15);color:var(--g)}

/* SIDEBAR */
#sidebar{
  position:fixed;left:0;top:0;bottom:0;width:50px;z-index:300;
  display:flex;flex-direction:column;align-items:center;padding:6px 0 12px;gap:3px;
  background:linear-gradient(to right,rgba(0,0,0,.82) 55%,transparent)
}
.sb{width:40px;height:40px;border-radius:10px;border:1px solid var(--bord);background:var(--surf);color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .2s;flex-shrink:0}
.sb:active{transform:scale(.91)}
.sb.on{border-color:var(--g);background:rgba(34,197,94,.18);color:var(--g);box-shadow:0 0 10px var(--glow)}
.sb.wb{border-color:var(--a)}.sb.wb.on{background:rgba(245,158,11,.18);color:var(--a)}
.sb svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;pointer-events:none}
.sl{font-size:6.5px;color:var(--muted);font-family:var(--mono);text-align:center;line-height:1}
.sb.on .sl{color:var(--g)}.sb.wb.on .sl{color:var(--a)}
.sp{flex:1}

/* BOTTOM BAR */
#bot{
  position:fixed;bottom:0;left:50px;right:0;z-index:300;padding:6px 10px 18px;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.94) 70%,transparent)
}
#bot>*{pointer-events:auto}
#pills{display:flex;gap:4px;margin-bottom:5px;overflow-x:auto;scrollbar-width:none}
#pills::-webkit-scrollbar{display:none}
.pl{font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.4);color:var(--muted);white-space:nowrap;flex-shrink:0}
.pl.on{border-color:var(--g);color:var(--g)}.pl.wn{border-color:var(--a);color:var(--a)}

/* PCHIP - selector câmp atribut principal */
#pchip{display:none;background:rgba(0,0,0,.75);border:1px solid var(--bord);border-radius:8px;padding:6px 8px;margin-bottom:5px}
#pchip.show{display:block}
#pcid{font-family:var(--mono);font-size:11px;font-weight:700;color:#FAC775;margin-bottom:2px}
#pcmt{font-size:9px;color:var(--muted)}
.pcfrow{display:flex;align-items:center;gap:4px;margin-top:4px}
.pcflbl{font-size:9px;color:var(--g);white-space:nowrap;font-family:var(--mono);font-weight:600;min-width:44px}
.pcfsel{flex:1;background:rgba(0,0,0,.6);border:1px solid var(--g);color:var(--txt);font-family:var(--mono);font-size:11px;padding:4px 6px;border-radius:6px;outline:none;cursor:pointer}

/* BOTTOM ACTIONS ROW */
#arow{display:flex;align-items:center;gap:8px}
#linfo{flex:1;font-family:var(--mono);font-size:8.5px;color:var(--muted);line-height:1.8}
#linfo .lv{color:var(--txt)}
#sht{width:54px;height:54px;border-radius:50%;flex-shrink:0;border:3px solid #555;background:rgba(60,60,60,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .35s;position:relative}
#sht.rdy{border-color:var(--g);background:rgba(34,197,94,.22);box-shadow:0 0 20px var(--glow)}
#sht.rdy::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--g);animation:rp 1.6s infinite;opacity:.5}
@keyframes rp{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.12);opacity:0}}
#sdot{width:20px;height:20px;border-radius:50%;background:#666;transition:background .3s}
#sht.rdy #sdot{background:var(--g)}
#sht:disabled{opacity:.25;cursor:default}
#gbtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--bord);background:var(--surf);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
#gbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
#gbtn span{font-size:7px;font-family:var(--mono);color:var(--muted)}

#prox{position:fixed;right:8px;bottom:92px;z-index:250;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid #444;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:#666;text-align:center;line-height:1.3;transition:all .4s;pointer-events:none;white-space:pre-line}
#prox.near{border-color:var(--g);color:var(--g);box-shadow:0 0 14px var(--glow)}

/* PARCEL POPUP  — apare la tap pe parcelă */
#pp-ov{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.6)}
#pp-ov.on{display:block}
#pp-box{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:2001;
  background:#061206;border-top:2px solid var(--g);
  border-radius:18px 18px 0 0;padding:14px 14px 32px;
  box-shadow:0 -8px 30px rgba(0,0,0,.8)
}
#pp-box.on{display:block}
#pp-name{
  font-family:var(--mono);font-size:13px;font-weight:700;color:#FAC775;
  margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bord);
  display:flex;align-items:center;justify-content:space-between
}
#pp-name button{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0 2px}
#pp-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ppb{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:14px 6px;border-radius:12px;cursor:pointer;border:2px solid;
  font-size:11px;font-family:system-ui;transition:all .15s;min-height:70px;background:transparent
}
.ppb:active{transform:scale(.93)}
.ppb span:first-child{font-size:24px;line-height:1}
.ppb-attr{border-color:rgba(99,179,237,.6);color:#93c5fd}
.ppb-done{border-color:rgba(34,197,94,.5);color:var(--g)}
.ppb-done.fin{background:rgba(34,197,94,.2);border-color:var(--g);color:#fff;font-weight:700}
.ppb-del{border-color:rgba(239,68,68,.5);color:#fca5a5}

/* ATTR WINDOW - fereastra completă cu toate atributele */
#aw-ov{display:none;position:fixed;inset:0;z-index:3499;background:rgba(0,0,0,.7)}
#aw-ov.on{display:block}
#aw-box{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3500;width:92%;max-width:380px;max-height:80vh;
  background:#061206;border:1px solid var(--bord);border-radius:14px;
  overflow:hidden;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.9)
}
#aw-box.on{display:flex}
#aw-hd{
  background:rgba(34,197,94,.15);border-bottom:1px solid var(--bord);
  padding:11px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0
}
#aw-ti{font-family:var(--mono);font-size:12px;font-weight:700;color:#FAC775}
#aw-hd button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
#aw-bd{flex:1;overflow-y:auto;padding:4px 0}
.awr{display:flex;gap:8px;padding:8px 14px;border-bottom:1px solid rgba(34,197,94,.08);font-size:11px}
.awr:last-child{border-bottom:none}
.awk{font-family:var(--mono);color:#93c5fd;font-weight:700;min-width:95px;flex-shrink:0;font-size:11px}
.awv{font-family:var(--mono);color:var(--txt);word-break:break-all;flex:1}
#aw-ft{padding:10px 12px;border-top:1px solid var(--bord);display:flex;gap:8px;flex-shrink:0}
#aw-ft button{flex:1;padding:10px;border-radius:8px;font-size:12px;font-family:var(--mono);cursor:pointer;font-weight:600}
.aw-ok{background:rgba(34,197,94,.2);border:1px solid var(--g);color:var(--g)}
.aw-cl{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.15);color:var(--muted)}

/* EXIT DIALOG */
#ex-ov{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.7)}
#ex-ov.on{display:block}
#ex-box{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:3001;background:#061206;border:1px solid rgba(239,68,68,.4);
  border-radius:14px;padding:24px 20px;width:84%;max-width:290px;text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.9)
}
#ex-box.on{display:block}
#ex-box .icon{font-size:36px;margin-bottom:10px}
#ex-box p{font-family:var(--mono);font-size:13px;color:var(--txt);margin-bottom:18px;line-height:1.6}
#ex-box .yes{display:block;width:100%;padding:11px;margin-bottom:8px;border-radius:9px;border:1px solid var(--r);background:rgba(239,68,68,.15);color:#fca5a5;font-size:13px;cursor:pointer;font-family:var(--mono);font-weight:700}
#ex-box .no{display:block;width:100%;padding:11px;border-radius:9px;border:1px solid var(--bord);background:rgba(34,197,94,.1);color:var(--g);font-size:13px;cursor:pointer;font-family:var(--mono)}

/* CAMERA */
#camo{position:fixed;inset:0;z-index:700;background:#000;display:none;flex-direction:column}
#camo.show{display:flex}
#vwr{position:relative;flex:1;overflow:hidden;background:#000}
#vid{width:100%;height:100%;object-fit:cover;display:block}
#vst{
  position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);padding:8px 11px;
  font-family:var(--mono);font-size:11px;line-height:1.75;color:#fff;
  border-top:3px solid #185FA5;pointer-events:none
}
#vst .vi{font-size:13px;font-weight:700;color:#FAC775}
#bcc{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
#zoom-slider-wrap{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10}
#zoom-val{font-family:var(--mono);font-size:11px;color:#fff;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:8px;min-width:32px;text-align:center}
#zoom-slider{-webkit-appearance:slider-vertical;appearance:slider-vertical;writing-mode:vertical-lr;direction:rtl;width:28px;height:160px;accent-color:var(--g);cursor:pointer;background:transparent}
#csr{padding:11px 16px 24px;background:#000;display:flex;justify-content:center}
#csb{width:66px;height:66px;border-radius:50%;border:4px solid #fff;background:#185FA5;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 22px rgba(24,95,165,.5);transition:transform .1s}
#csb:active{transform:scale(.91)}
#csd{width:24px;height:24px;border-radius:50%;background:#fff}
canvas{display:none}

/* PREVIEW */
#prevo{position:fixed;inset:0;z-index:800;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#prevo.show{display:flex}
#pimg{max-width:100%;max-height:calc(100vh - 100px);object-fit:contain}
#pact{position:absolute;bottom:26px;display:flex;gap:28px;align-items:center}
.cb{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:transform .15s}
.cb:active{transform:scale(.9)}
.cb.ok{background:#15803d;border:2px solid #22c55e}
.cb.no{background:#991b1b;border:2px solid #ef4444}
.cb svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.5;pointer-events:none}
.cb span{font-size:8px;color:#fff;font-family:var(--mono)}

/* GALLERY */
#galo{position:fixed;inset:0;z-index:850;background:rgba(0,0,0,.97);display:none;flex-direction:column}
#galo.show{display:flex}
#galh{padding:10px 12px;background:rgba(8,18,8,.98);border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#galh h2{font-family:var(--mono);font-size:12px;color:var(--g)}
#galh button{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
#galg{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}
.gt{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--bord)}
.gt img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}
.gt .gd{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(153,27,27,.92);border:none;color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}

/* FULL VIEW */
#fullview{position:fixed;inset:0;z-index:900;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center}
#fullview.show{display:flex}
#fullimg{max-width:100%;max-height:100vh;object-fit:contain}
#fvclose{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#fvname{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.5);padding:4px 10px;border-radius:10px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}

/* KML MANAGER */
#km-ov{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6)}
#km-ov.on{display:block}
#km-box{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:601;
  background:#061206;border-top:2px solid var(--bord);
  border-radius:16px 16px 0 0;max-height:75vh;flex-direction:column;
  box-shadow:0 -4px 20px rgba(0,0,0,.5)
}
#km-box.on{display:flex}
#km-hd{padding:12px 14px;border-bottom:1px solid var(--bord);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#km-hd h2{font-family:var(--mono);font-size:13px;color:var(--g)}
#km-hd button{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
#km-bd{flex:1;overflow-y:auto;padding:10px 12px}
#km-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.kmi{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--bord);background:rgba(34,197,94,.04);cursor:pointer}
.kmi.act{border-color:var(--g);background:rgba(34,197,94,.12)}
.kmi-inf{flex:1;min-width:0}
.kmi-nm{font-family:var(--mono);font-size:12px;color:var(--g);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kmi-st{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px}
.kmi-act{display:flex;gap:4px;align-items:center;flex-shrink:0}
.kmi-eye{width:28px;height:28px;border-radius:50%;background:rgba(34,197,94,.1);border:1px solid var(--bord);color:var(--g);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.kmi-eye.off{color:var(--muted);background:rgba(0,0,0,.2)}
.kmi-del{width:28px;height:28px;border-radius:50%;background:rgba(153,27,27,.3);border:1px solid rgba(239,68,68,.3);color:#ef4444;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.km-add{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:10px;border:1px dashed var(--bord);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;width:100%;justify-content:center}

/* REMAIN POPUP */
#rem-box{
  display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:700;background:#061206;border:1px solid var(--bord);border-radius:14px;
  padding:20px 22px;text-align:center;width:80%;max-width:300px;
  box-shadow:0 8px 32px rgba(0,0,0,.7)
}
#rem-box.on{display:block}
#rem-box .ri{font-size:32px;margin-bottom:8px}
#rem-box p{font-family:var(--mono);font-size:13px;color:var(--txt);margin-bottom:14px;line-height:1.6}
#rem-box button{padding:8px 20px;border-radius:8px;border:1px solid var(--g);background:rgba(34,197,94,.15);color:var(--g);font-size:13px;cursor:pointer;font-family:var(--mono)}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:5000;background:#0d1a0d;display:flex;flex-direction:column;align-items:center;justify-content:center}
#spl-lens{position:relative;width:120px;height:120px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
#spl-r1{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(34,197,94,.15)}
#spl-r2{position:absolute;inset:8px;border-radius:50%;border:2px solid rgba(34,197,94,.25)}
#spl-r3{position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(34,197,94,.35);background:radial-gradient(circle,rgba(34,197,94,.1) 0%,rgba(0,0,0,.5) 100%)}
#spl-bw{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);width:120px;height:4px;background:rgba(34,197,94,.15);border-radius:2px;overflow:hidden}
#spl-bar{height:100%;width:0%;background:var(--g);border-radius:2px;box-shadow:0 0 8px var(--glow);transition:width .05s linear}
#spl-pct{position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--g)}
#spl-ti{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--g);letter-spacing:.15em;text-shadow:0 0 20px var(--glow);margin-bottom:6px}
#spl-su{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:40px}

/* PROGRESS / TOAST */
#prog{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#prog.show{display:flex}
#prog p{font-family:var(--mono);font-size:13px;color:var(--g);text-align:center;padding:0 20px}
.spin{width:40px;height:40px;border:3px solid rgba(34,197,94,.2);border-top-color:var(--g);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#tst{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:4100;font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:20px;white-space:nowrap;display:none;pointer-events:none;max-width:90%;text-align:center}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

// Prinde orice eroare si nu bloca splash-ul
window.onerror = function(msg, src, line, col, err) {
  console.error('App error:', msg, 'at', line, col);
  setTimeout(function(){
    var sp = document.getElementById('splash');
    if(sp && sp.style.display !== 'none'){
      sp.style.display = 'none';
      loadState();
    }
  }, 5000);
  return false;
};

// ── STATE ──
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
let map, uMk, aCir;
let polyL = [], feats = [], kmlName = '';
let kmlStore = [], activeKmlId = null;
let selField1 = '', selField2 = '', allF = [];
let lat = null, lon = null, acc = null, alt = null, hdg = null;
let gpsOn = false, compOn = false, camOn = false, bufOn = true;
let curF = null, selLy = null;
let lastB64 = null, lastFname = '', pCnt = 0;
let mStream = null, isSat = true, gallery = [], currentZoom = 1.0;
let cachedUAT = '';
const LS = 'rphkml_v1';

// ── BACK BUTTON HANDLING ──
(function(){
  history.pushState({r:1}, '', location.href);
  history.pushState({r:1}, '', location.href);
  history.pushState({r:1}, '', location.href);
})();
window.addEventListener('popstate', function(){
  history.pushState({r:1}, '', location.href);
  handleBack();
});
window.onAndroidBack = function(){ handleBack(); };

document.addEventListener('deviceready', function(){
  console.log('Capacitor ready');
}, false);
document.addEventListener('backbutton', function(e){
  e.preventDefault();
  handleBack();
}, false);

function handleBack(){
  const layers = [
    ['ex-box', 'closeExit'],
    ['fullview', 'closeFull'],
    ['prevo', 'discardP'],
    ['camo', 'closeCam'],
    ['galo', 'closeGallery'],
    ['aw-box', 'closeAW'],
    ['pp-box', 'closePP'],
    ['km-box', 'closeKM'],
  ];
  for(const [id, fn] of layers){
    const el = document.getElementById(id);
    if(el && (el.classList.contains('on') || el.classList.contains('show'))){
      window[fn] && window[fn]();
      return;
    }
  }
  showExit();
}

// ── EXIT ──
function showExit(){
  document.getElementById('ex-ov').classList.add('on');
  document.getElementById('ex-box').classList.add('on');
}
function closeExit(){
  document.getElementById('ex-ov').classList.remove('on');
  document.getElementById('ex-box').classList.remove('on');
}
function confirmExit(){
  closeExit();
  if(window.AndroidApp && window.AndroidApp.exitApp) window.AndroidApp.exitApp();
  else history.go(-10);
}

// ── SPLASH ──
let _splashStarted = false;
function runSplash(){
  if(_splashStarted) return;
  _splashStarted = true;
  const bar = document.getElementById('spl-bar'), pct = document.getElementById('spl-pct'), sp = document.getElementById('splash');
  let p = 0;
  const iv = setInterval(() => {
    p += Math.random() * 4 + 1.5;
    if(p >= 100){
      p = 100;
      clearInterval(iv);
      bar.style.width = '100%';
      pct.textContent = '100%';
      setTimeout(() => {
        sp.style.transition = 'opacity .5s';
        sp.style.opacity = '0';
        setTimeout(() => {
          sp.style.display = 'none';
          loadState();
        }, 500);
      }, 400);
    }
    bar.style.width = Math.min(p, 100) + '%';
    pct.textContent = Math.round(Math.min(p, 100)) + '%';
  }, 50);
}

document.addEventListener('DOMContentLoaded', () => setTimeout(runSplash, 300));
window.addEventListener('load', () => setTimeout(runSplash, 300));

// ── OPEN KML FROM ANDROID INTENT ──
window.openKMLFromIntent = function(fileName, fileContent) {
  try {
    const id = 'k' + Date.now();
    const name = (fileName || 'fisier.kml').replace(/\.kml$/i, '');
    const entry = { id, name, xml: fileContent, feats: null, allF: [], doneIds: [], vis: true };
    kmlStore.push(entry);
    parseKMLEntry(entry);
    activateKML(id);
    saveState();
    toast('KML deschis: ' + name, 'ok');
  } catch(e) {
    toast('Eroare KML: ' + e.message, 'er');
  }
};

// ── PERSISTENCE ──
function saveState(){
  try {
    localStorage.setItem(LS, JSON.stringify({
      kmlStore: kmlStore.map(k => ({
        id: k.id,
        name: k.name,
        xml: k.xml,
        vis: k.vis !== false,
        doneIds: (k.feats || []).filter(f => f._done).map(f => fid(f)).filter(Boolean)
      })),
      activeKmlId
    }));
  } catch(e) {}
}

function fid(f){
  return f['__nm__'] || f[Object.keys(f).find(k => !k.startsWith('_'))] || '';
}

function loadState(){
  try {
    const d = JSON.parse(localStorage.getItem(LS) || '{}');
    if(d.kmlStore){
      d.kmlStore.forEach(k => {
        if(!kmlStore.find(x => x.id === k.id)){
          kmlStore.push({ id: k.id, name: k.name, xml: k.xml, vis: k.vis !== false, feats: null, allF: [], doneIds: k.doneIds || [] });
        }
      });
      kmlStore.filter(k => k.vis !== false).forEach(k => {
        parseKMLEntry(k);
        drawKML(k);
      });
      if(d.activeKmlId){
        activeKmlId = d.activeKmlId;
        const k = kmlStore.find(x => x.id === activeKmlId);
        if(k){
          feats = k.feats || [];
          kmlName = k.name;
          allF = k.allF || [];
          buildFS();
        }
      }
      if(feats.length) fitAll();
    }
  } catch(e) {}
}

// ── MAP ──
map = L.map('map', { center: [47.65, 23.58], zoom: 13, zoomControl: false, attributionControl: false, tap: true, tapTolerance: 15 });
const lSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 19 });
const lOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 21, maxNativeZoom: 19 });
lSat.addTo(map);

function toggleLayer(){
  if(isSat){
    map.removeLayer(lSat);
    lOSM.addTo(map);
  } else {
    map.removeLayer(lOSM);
    lSat.addTo(map);
  }
  isSat = !isSat;
  document.getElementById('blyr').classList.toggle('on', !isSat);
}

function centerMap(){
  if(lat && lon) {
    map.setView([lat, lon], Math.max(map.getZoom(), 16));
  } else if(feats.length) {
    fitAll();
  } else {
    toast('Nicio locație GPS sau parcelă disponibilă', 'wn');
  }
}

function mkPin(){
  return L.divIcon({
    className: '', iconSize: [30, 40], iconAnchor: [15, 40],
    html: '<div style="width:30px;height:40px;position:relative"><div style="width:30px;height:30px;border-radius:50% 50% 50% 0;background:#ef4444;border:3px solid #fff;transform:rotate(-45deg);position:absolute;top:0;left:0;box-shadow:0 3px 10px rgba(0,0,0,.6)"><div style="width:10px;height:10px;border-radius:50%;background:#fff;position:absolute;top:7px;left:7px"></div></div><div style="width:4px;height:10px;background:#ef4444;position:absolute;bottom:0;left:13px;border-radius:0 0 2px 2px"></div></div>'
  });
}

// ── KML MANAGER ──
function openKM(){
  renderKMList();
  document.getElementById('km-ov').classList.add('on');
  document.getElementById('km-box').classList.add('on');
}
function closeKM(){
  document.getElementById('km-ov').classList.remove('on');
  document.getElementById('km-box').classList.remove('on');
}
function renderKMList(){
  const list = document.getElementById('km-list');
  list.innerHTML = '';
  if(!kmlStore.length){
    list.innerHTML = '<div style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;padding:20px">Niciun KML incarcat</div>';
    return;
  }
  kmlStore.forEach(k => {
    const total = (k.feats || []).length;
    const done = (k.feats || []).filter(f => f._done).length;
    const isAct = k.id === activeKmlId;
    const isVis = k.vis !== false;
    const d = document.createElement('div');
    d.className = 'kmi' + (isAct ? ' act' : '');
    const inf = document.createElement('div');
    inf.className = 'kmi-inf';
    inf.dataset.kid = k.id;
    inf.onclick = function(){ activateKML(this.dataset.kid); };
    inf.innerHTML = '<div class="kmi-nm">' + ex(k.name) + '</div><div class="kmi-st">' + total + ' parcele · ' + done + ' fin · ' + (total - done) + ' ramase</div>';
    const act = document.createElement('div');
    act.className = 'kmi-act';
    const eye = document.createElement('button');
    eye.className = 'kmi-eye' + (isVis ? '' : ' off');
    eye.textContent = isVis ? '👁' : '🚫';
    eye.dataset.kid = k.id;
    eye.onclick = function(e){ e.stopPropagation(); toggleKMLVis(this.dataset.kid); };
    const del2 = document.createElement('button');
    del2.className = 'kmi-del';
    del2.textContent = '✕';
    del2.dataset.kid = k.id;
    del2.onclick = function(e){ e.stopPropagation(); deleteKML(this.dataset.kid); };
    act.appendChild(eye);
    act.appendChild(del2);
    d.appendChild(inf);
    d.appendChild(act);
    list.appendChild(d);
  });
}

function addKML(inp){
  Array.from(inp.files).forEach(file => {
    const r = new FileReader();
    r.onload = e => {
      const id = 'k' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
      const name = file.name.replace(/\.kml$/i, '');
      const entry = { id, name, xml: e.target.result, feats: null, allF: [], doneIds: [], vis: true };
      kmlStore.push(entry);
      parseKMLEntry(entry);
      activateKML(id);
      saveState();
      renderKMList();
    };
    r.readAsText(file);
  });
  inp.value = '';
}

function activateKML(id){
  const k = kmlStore.find(x => x.id === id);
  if(!k) return;
  activeKmlId = id;
  feats = k.feats || [];
  kmlName = k.name;
  allF = k.allF || [];
  selField1 = ''; selField2 = '';
  buildFS();
  if(k.vis !== false) drawKML(k);
  fitAll();
  const total = feats.length, done = feats.filter(f => f._done).length, rem = total - done;
  document.getElementById('rem-ic').textContent = rem === 0 ? '✅' : '📋';
  document.getElementById('rem-tx').textContent = rem === 0 ? 'Toate ' + total + ' parcele au fost finalizate!' : 'Mai aveti ' + rem + ' parcele de controlat din totalul de ' + total;
  document.getElementById('rem-box').classList.add('on');
  setTimeout(() => document.getElementById('rem-box').classList.remove('on'), 3500);
  closeKM();
  saveState();
}

function toggleKMLVis(id){
  const k = kmlStore.find(x => x.id === id);
  if(!k) return;
  k.vis = !(k.vis !== false);
  polyL.forEach(pl => {
    if(pl._kid === id){
      if(k.vis){
        if(!map.hasLayer(pl.ly)) pl.ly.addTo(map);
        if(pl.mk && !map.hasLayer(pl.mk)) pl.mk.addTo(map);
      } else {
        map.removeLayer(pl.ly);
        if(pl.mk) map.removeLayer(pl.mk);
      }
    }
  });
  saveState();
  renderKMList();
}

function deleteKML(id){
  if(!confirm('Stergeti acest KML?')) return;
  polyL = polyL.filter(pl => {
    if(pl._kid === id){
      map.removeLayer(pl.ly);
      if(pl.mk) map.removeLayer(pl.mk);
      return false;
    }
    return true;
  });
  kmlStore = kmlStore.filter(x => x.id !== id);
  if(activeKmlId === id){
    activeKmlId = null;
    feats = [];
    kmlName = '';
    allF = [];
    buildFS();
  }
  saveState();
  renderKMList();
  toast('KML sters', 'wn');
}

// ── KML PARSER ──
function parseKMLEntry(k){
  if(k.feats) return;
  const doc = new DOMParser().parseFromString(k.xml, 'text/xml');
  const parsed = [], fs = new Set();
  const styles = {};
  Array.from(doc.getElementsByTagName('Style')).forEach(s => {
    const id = s.getAttribute('id');
    if(!id) return;
    const psa = s.getElementsByTagName('PolyStyle'), lsa = s.getElementsByTagName('LineStyle');
    let fc = '#22c55e', sc = '#22c55e', fo = 0.12;
    if(psa.length > 0){
      const ca = psa[0].getElementsByTagName('color');
      if(ca.length > 0){
        const abgr = ca[0].textContent.trim();
        if(abgr.length === 8){
          const a = parseInt(abgr.slice(0, 2), 16) / 255, b = abgr.slice(2, 4), g = abgr.slice(4, 6), rv = abgr.slice(6, 8);
          fc = '#' + rv + g + b;
          fo = Math.min(.6, Math.max(.05, a * .6));
        }
      }
    }
    if(lsa.length > 0){
      const ca = lsa[0].getElementsByTagName('color');
      if(ca.length > 0){
        const abgr = ca[0].textContent.trim();
        if(abgr.length === 8){
          const b = abgr.slice(2, 4), g = abgr.slice(4, 6), rv = abgr.slice(6, 8);
          sc = '#' + rv + g + b;
        }
      }
    }
    styles['#' + id] = { fc, sc, fo };
  });
  const smap = {};
  Array.from(doc.getElementsByTagName('StyleMap')).forEach(sm => {
    const id = sm.getAttribute('id');
    if(!id) return;
    Array.from(sm.getElementsByTagName('Pair')).forEach(p => {
      const keys = p.getElementsByTagName('key'), urls = p.getElementsByTagName('styleUrl');
      if(keys.length > 0 && keys[0].textContent.trim() === 'normal' && urls.length > 0)
        smap['#' + id] = urls[0].textContent.trim();
    });
  });

  const pms = doc.getElementsByTagName('Placemark');
  Array.from(pms).forEach(pm => {
    const f = { _c: [], _ctr: null, _done: false, _sty: null };
    // SimpleData
    Array.from(pm.getElementsByTagName('SimpleData')).forEach(sd => {
      const n = sd.getAttribute('name');
      if(n){ f[n] = sd.textContent.trim(); fs.add(n); }
    });
    // Data
    Array.from(pm.getElementsByTagName('Data')).forEach(d => {
      const n = d.getAttribute('name');
      const vs = d.getElementsByTagName('value');
      if(n && vs.length > 0){ f[n] = vs[0].textContent.trim(); fs.add(n); }
    });
    // Description (HTML table or key:value)
    const descs = pm.getElementsByTagName('description');
    if(descs.length > 0){
      const raw = descs[0].textContent || descs[0].innerHTML || '';
      const div = document.createElement('div');
      div.innerHTML = raw;
      const html = div.innerHTML;
      const re = /<b>([^<]+)<\/b>\s*:\s*([^<]*)/gi;
      let m;
      while((m = re.exec(html)) !== null){
        const key = m[1].trim();
        const val = m[2].trim();
        if(key && !f[key]){ f[key] = val; fs.add(key); }
      }
      if(Object.keys(f).filter(k => !k.startsWith('_')).length === 0){
        div.querySelectorAll && div.querySelectorAll('b').forEach(b => {
          const key = b.textContent.trim();
          let val = '';
          let next = b.nextSibling;
          while(next && next.nodeName !== 'B' && next.nodeName !== 'BR'){
            if(next.textContent) val += next.textContent;
            next = next.nextSibling;
          }
          val = val.replace(/^\s*:\s*/, '').trim();
          if(key && val && !f[key]){ f[key] = val; fs.add(key); }
        });
      }
    }
    // Name
    const names = pm.getElementsByTagName('name');
    if(names.length > 0 && names[0].parentNode === pm){
      f['__nm__'] = names[0].textContent.trim();
      fs.add('__nm__');
    }
    // StyleUrl
    const sus = pm.getElementsByTagName('styleUrl');
    if(sus.length > 0){
      let sid = sus[0].textContent.trim();
      if(smap[sid]) sid = smap[sid];
      if(styles[sid]) f._sty = styles[sid];
    }
    // Coordinates
    const cs = [];
    Array.from(pm.getElementsByTagName('coordinates')).forEach(c => {
      c.textContent.trim().split(/\s+/).forEach(t => {
        const p = t.split(',');
        if(p.length >= 2){
          const lo = parseFloat(p[0]), la = parseFloat(p[1]);
          if(!isNaN(lo) && !isNaN(la)) cs.push([la, lo]);
        }
      });
    });
    f._c = cs;
    if(cs.length){
      const las = cs.map(c => c[0]), los = cs.map(c => c[1]);
      f._ctr = [(Math.min(...las) + Math.max(...las)) / 2, (Math.min(...los) + Math.max(...los)) / 2];
    }
    if(k.doneIds && k.doneIds.includes(fid(f))) f._done = true;
    if(cs.length >= 3) parsed.push(f);
  });
  k.feats = parsed;
  k.allF = Array.from(fs);
}

function buildFS(){
  const s1 = document.getElementById('pcfs1'), s2 = document.getElementById('pcfs2');
  if(!s1) return;
  s1.innerHTML = '';
  s2.innerHTML = '<option value="">— niciunul —</option>';
  const show = allF && allF.length > 0;
  document.getElementById('pfrow1').style.display = show ? 'flex' : 'none';
  document.getElementById('pfrow2').style.display = show ? 'flex' : 'none';
  document.getElementById('pchip').style.display = show ? 'block' : 'none';
  if(!show) return;
  if(allF.includes('__nm__')){
    const o = document.createElement('option'); o.value = '__nm__'; o.textContent = 'Name'; s1.appendChild(o);
    const o2 = document.createElement('option'); o2.value = '__nm__'; o2.textContent = 'Name'; s2.appendChild(o2);
  }
  allF.forEach(f => {
    if(f === '__nm__') return;
    const o = document.createElement('option'); o.value = f; o.textContent = f; s1.appendChild(o);
    const o2 = document.createElement('option'); o2.value = f; o2.textContent = f; s2.appendChild(o2);
  });

}

function onFC1(){
  selField1 = document.getElementById('pcfs1').value;
  redrawActive();
  updChip();
}
function onFC2(){
  selField2 = document.getElementById('pcfs2').value;
}
function lbl(f){
  const k = selField1;
  if(!k) return f['__nm__'] || '—';
  return (k === '__nm__' ? '' : k + ': ') + (f[k] || '—');
}
function ex(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function drawKML(k){
  if(!k.feats) return;
  polyL = polyL.filter(pl => {
    if(pl._kid === k.id){
      map.removeLayer(pl.ly);
      if(pl.mk) map.removeLayer(pl.mk);
      return false;
    }
    return true;
  });
  if(k.vis === false) return;
  k.feats.forEach((f, i) => {
    if(f._c.length < 3) return;
    const done = f._done, sel = (curF === f);
    const sc = (f._sty && f._sty.sc) || '#22c55e';
    const fc = (f._sty && f._sty.fc) || '#22c55e';
    let style;
    if(done){
      style = { color: '#22c55e', weight: 2, fillColor: '#22c55e', fillOpacity: .35, dashArray: '7,5' };
    } else if(sel){
      style = { color: '#f59e0b', weight: 3, fillColor: '#f59e0b', fillOpacity: .15, dashArray: null };
    } else {
      style = { color: sc, weight: 2, fillColor: fc, fillOpacity: .01, dashArray: null };
    }
    const ly = L.polygon(f._c, { ...style, interactive: true, bubblingMouseEvents: false });
    ly._feat = f;
    ly._kid = k.id;
    ly._origStyle = { color: sc, weight: 2, fillColor: fc, fillOpacity: .01, dashArray: null };
    ly.on('click', function(e){
      L.DomEvent.stopPropagation(e);
      selParcel(f, ly, i);
    });
    ly.addTo(map);
    let mk = null;
    if(f._ctr){
      const ico = L.divIcon({
        className: '', iconAnchor: [0, 8],
        html: '<div style="background:rgba(0,0,0,.85);color:#FAC775;font-family:monospace;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none">' + ex(lbl(f)) + '</div>'
      });
      mk = L.marker(f._ctr, { icon: ico, interactive: false }).addTo(map);
    }
    polyL.push({ ly, mk, f, i, _kid: k.id });
  });
}

function redrawActive(){
  const k = kmlStore.find(x => x.id === activeKmlId);
  if(k) drawKML(k);
}
function fitAll(){
  const pts = feats.flatMap(f => f._c);
  if(pts.length){
    const las = pts.map(c => c[0]), los = pts.map(c => c[1]);
    map.fitBounds([[Math.min(...las), Math.min(...los)], [Math.max(...las), Math.max(...los)]], { padding: [50, 50] });
  }
}

// ── PARCEL SELECTION ──
function selParcel(f, ly, idx){
  if(selLy && selLy !== ly){
    const pf = selLy._feat;
    if(pf && pf._done){
      selLy.setStyle({ color: '#22c55e', weight: 2, fillColor: '#22c55e', fillOpacity: .35, dashArray: '7,5' });
    } else {
      const os = selLy._origStyle || { color: '#22c55e', weight: 2, fillColor: '#22c55e', fillOpacity: .01 };
      selLy.setStyle({ ...os, dashArray: null });
    }
  }
  curF = f; selLy = ly; ly._feat = f;
  if(!f._done){
    ly.setStyle({ color: '#f59e0b', weight: 3, fillColor: '#f59e0b', fillOpacity: .15, dashArray: null });
  }
  map.fitBounds(ly.getBounds(), { padding: [40, 40], maxZoom: 18 });
  updChip();
  updSt();
  chkProx();
  openPP(f);
}

function openPP(f){

}

function toggleDone(){
  if(!curF) return;
  if(!curF._done){
    const pid = (selField1 && curF[selField1]) ? curF[selField1] : (curF['__nm__'] || '');
    const hasPic = gallery.some(g => g.name && g.name.includes(String(pid).replace(/[^a-zA-Z0-9]/g, '_').slice(0, 20)));
    if(!hasPic){

      d.style.cssText = 'position:fixed;inset:0;z-index:3500;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center';
      d.innerHTML = '<div style="background:#061206;border:1px solid rgba(245,158,11,.5);border-radius:14px;padding:22px 20px;width:85%;max-width:300px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.9)">'
        + '<div style="font-size:30px;margin-bottom:10px">⚠️</div>'
        + '<div style="font-family:var(--mono);font-size:13px;color:var(--txt);margin-bottom:16px;line-height:1.6">Finalizare fară poze!<br><span style="color:var(--muted);font-size:11px">Nu au fost fotografii<br>efectuate pe această parcelă.</span></div>'
        + '<div style="display:flex;flex-direction:column;gap:8px">'
        + '<button id="fin-yes" style="padding:10px;border-radius:8px;border:1px solid var(--a);background:rgba(245,158,11,.15);color:#fcd34d;font-size:12px;cursor:pointer;font-family:var(--mono);font-weight:700">Da, finalizează oricum</button>'
        + '<button id="fin-no" style="padding:10px;border-radius:8px;border:1px solid var(--bord);background:rgba(34,197,94,.1);color:var(--g);font-size:12px;cursor:pointer;font-family:var(--mono)">Anulează</button>'
        + '</div></div>';
      document.body.appendChild(d);
      document.getElementById('fin-yes').onclick = function(){ document.body.removeChild(d); doFinalize(); };
      document.getElementById('fin-no').onclick = function(){ document.body.removeChild(d); };

    }
  }
  doFinalize();
}

function doFinalize(){
  if(!curF) return;
  curF._done = !curF._done;
  const done = curF._done;
  if(selLy){
    if(done){
      selLy.setStyle({ color: '#22c55e', weight: 2.5, fillColor: '#22c55e', fillOpacity: .35, dashArray: '7,5' });
    } else {
      const os = selLy._origStyle || { color: '#22c55e', weight: 2, fillColor: '#22c55e', fillOpacity: .01 };
      selLy.setStyle({ ...os, dashArray: null });
    }
  }
  document.getElementById('ppb-done-ic').textContent = done ? '✓' : '○';
  document.getElementById('ppb-done-tx').textContent = done ? 'Finalizata' : 'Finalizat';
  document.getElementById('ppb-done').classList.toggle('fin', done);
  toast(done ? '✓ Parcela finalizată' : 'Parcela marcată ca nefinalizată', done ? 'ok' : 'wn');
  const k = kmlStore.find(x => x.id === activeKmlId);
  if(k){
    k.doneIds = (k.feats || []).filter(f => f._done).map(fid).filter(Boolean);
    saveState();
  }
  updChip();
}

function openAW(){
  if(!curF){
    toast('Selectați o parcelă pe hartă', 'wn');
    return;
  }
  closePP();
  const b = document.getElementById('aw-bd');
  b.innerHTML = '';
  const titlu = curF['__nm__'] || 'Parcelă';
  document.getElementById('aw-ti').textContent = titlu;

  const r0 = document.createElement('div');
  r0.className = 'awr';
  r0.innerHTML = '<span class="awk" style="color:#a8d5a8">KML Sursă</span>'
    + '<span class="awv" style="color:#a8d5a8">' + ex(kmlName || '—') + '</span>';
  b.appendChild(r0);

  const keys = Object.keys(curF).filter(k => !k.startsWith('_'));

    b.innerHTML += '<div style="padding:20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px">Nu există atribute pentru această parcelă.</div>';
  } else {
    keys.forEach(k => {

function closeAW(){
  document.getElementById('aw-ov').classList.remove('on');
  document.getElementById('aw-box').classList.remove('on');
}
function deleteParcel(){
  if(!curF) return;
  if(!confirm('Stergeti aceasta parcela?')) return;
  const idx = polyL.findIndex(p => p.f === curF);
  if(idx >= 0){
    map.removeLayer(polyL[idx].ly);
    if(polyL[idx].mk) map.removeLayer(polyL[idx].mk);
    polyL.splice(idx, 1);
  }
  const fi = feats.indexOf(curF);
  if(fi >= 0) feats.splice(fi, 1);
  curF = null; selLy = null;
  closePP(); updChip();
  const k = kmlStore.find(x => x.id === activeKmlId);
  if(k){ k.feats = feats; saveState(); }
  toast('Parcela stearsa', 'wn');
}

// ── FILTER & SEARCH ──
function onFilter(){
  const v = document.getElementById('filter-sel').value;
  polyL.forEach(pl => {
    const show = v === 'all' ? true : v === 'done' ? !!pl.f._done : !pl.f._done;
    if(show){
      if(!map.hasLayer(pl.ly)) pl.ly.addTo(map);
      if(pl.mk && !map.hasLayer(pl.mk)) pl.mk.addTo(map);
    } else {
      map.removeLayer(pl.ly);
      if(pl.mk) map.removeLayer(pl.mk);
    }
  });
}

function onSrch(v){
  const box = document.getElementById('sdrop');
  if(!v.trim() || !feats.length){
    box.style.display = 'none';
    return;
  }
  const q = v.toLowerCase();
  const hits = feats.filter(f => Object.values(f).some(val => typeof val === 'string' && val.toLowerCase().includes(q))).slice(0, 10);
  if(!hits.length){
    box.style.display = 'none';
    return;
  }
  box.innerHTML = hits.map(h => '<div class="si" onclick="srchSel(' + feats.indexOf(h) + ')">' + ex(lbl(h)) + '</div>').join('');
  box.style.display = 'block';
}

function srchSel(i){
  const f = feats[i];
  const pl = polyL.find(p => p.f === f);
  if(pl) selParcel(f, pl.ly, pl.i);
  document.getElementById('sb').value = '';
  document.getElementById('sdrop').style.display = 'none';
}

document.addEventListener('click', e => {

    document.getElementById('sdrop').style.display = 'none';
});

// ── CHIP & STATUS ──
function updChip(){

    return;
  }
  document.getElementById('pchip').style.display = 'block';

  }

function updSt(){
  document.getElementById('vsi').textContent = curF ? lbl(curF) : '— Parcelă neselectată —';
  document.getElementById('vsc').textContent = lat ? lat.toFixed(5) + '°, ' + lon.toFixed(5) + '°' : '—';
  document.getElementById('vsa').textContent = 'Alt: ' + (alt != null ? alt.toFixed(0) + 'm' : '—') + ' Acc: ' + (acc ? '±' + acc.toFixed(0) + 'm' : '—');
  document.getElementById('vsd').textContent = (cachedUAT || 'APIA Maramureș') + ' | ' + kmlName;
}

setInterval(() => {
  updSt();
  if(gpsOn) chkProx();
}, 1000);

// ── GPS ──
function startGPS(){
  if(gpsOn) return;
  navigator.geolocation.watchPosition(onPos, e => toast('GPS: ' + e.message, 'wn'), { enableHighAccuracy: true, maximumAge: 0, timeout: 60000 });
  gpsOn = true;
  document.getElementById('bgps').classList.add('on');
  toast('GPS activat', 'ok');
}

function onPos(p){
  lat = p.coords.latitude;
  lon = p.coords.longitude;
  acc = p.coords.accuracy;
  alt = p.coords.altitude;
  const pd = n => String(n).padStart(2, '0');
  const now = new Date();
  setPl('pgps', 'GPS: ' + lat.toFixed(4) + '°, ' + lon.toFixed(4) + '°', 'on');
  setPl('pacc', 'Acc: ±' + acc.toFixed(1) + ' m', acc < 15 ? 'on' : 'wn');
  setPl('palt', 'Alt: ' + (alt != null ? alt.toFixed(0) + ' m' : '—'), 'on');
  setPl('ptim', pd(now.getHours()) + ':' + pd(now.getMinutes()) + ':' + pd(now.getSeconds()), 'on');
  document.getElementById('llat').textContent = lat.toFixed(6) + '°';
  document.getElementById('llon').textContent = lon.toFixed(6) + '°';
  document.getElementById('lacc').textContent = '±' + acc.toFixed(1) + ' m';
  document.getElementById('lalt').textContent = alt != null ? alt.toFixed(0) + ' m' : '—';
  if(!uMk){
    uMk = L.marker([lat, lon], { icon: mkPin(), zIndexOffset: 1000 }).addTo(map);
    aCir = L.circle([lat, lon], { radius: acc, color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: .08, weight: 1 }).addTo(map);
  } else {
    uMk.setLatLng([lat, lon]);
    aCir.setLatLng([lat, lon]);
    aCir.setRadius(acc);
  }
  if(!cachedUAT) getUAT(lat, lon).then(u => { if(u) toast('UAT: ' + u, 'ok'); });
  autoSel();
  chkProx();
  updSt();
}

function setPl(id, t, c){
  const el = document.getElementById(id);
  el.textContent = t;
  el.className = 'pl ' + (c || '');
}

// ── COMPASS ──
function startCompass(){
  if(compOn) return;
  const go = () => {
    window.addEventListener('deviceorientationabsolute', onOri, true);
    window.addEventListener('deviceorientation', onOri, true);
    compOn = true;
    document.getElementById('bcomp').classList.add('on');
    toast('Busola activata', 'ok');
  };
  if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(r => { if(r === 'granted') go(); });
  } else {
    go();
  }
}

function onOri(e){
  let h = null;
  if(e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if(e.alpha != null) h = (360 - e.alpha) % 360;
  if(h != null){
    hdg = Math.round(h);
    setPl('pdir', 'Dir: ' + hdg + '° ' + cdir(hdg), 'on');
    document.getElementById('ldir').textContent = hdg + '° ' + cdir(hdg);
  }
}
function cdir(d){
  return ['N','NE','E','SE','S','SV','V','NV'][Math.round(d / 45) % 8];
}

function toggleBuf(){
  bufOn = !bufOn;
  document.getElementById('bbuf').classList.toggle('on', bufOn);
  chkProx();
  toast(bufOn ? 'Buffer 10m ACTIV' : 'Buffer DEZACTIVAT', bufOn ? 'ok' : 'wn');
}

function autoSel(){
  if(!lat || !feats.length) return;
  let best = null, mn = Infinity;
  feats.forEach(f => {
    if(f._ctr){
      const d = hav(lat, lon, f._ctr[0], f._ctr[1]);
      if(d < mn){ mn = d; best = f; }
    }
  });
  if(best && mn < 400){
    const pl = polyL.find(p => p.f === best);
    if(pl && curF !== best) selParcel(best, pl.ly, pl.i);
  }
}

function chkProx(){
  const ring = document.getElementById('prox'), sht = document.getElementById('sht');
  if(!lat || !curF){
    ring.textContent = '—\nm';
    ring.classList.remove('near');
    sht.classList.remove('rdy');
    sht.disabled = true;
    return;
  }
  let d;
  if(curF._c.length >= 3) d = d2poly(lat, lon, curF._c);
  else if(curF._ctr) d = hav(lat, lon, curF._ctr[0], curF._ctr[1]);
  else return;
  ring.textContent = d < 1000 ? Math.round(d) + '\nm' : (d / 1000).toFixed(1) + '\nkm';
  const near = !bufOn || (d <= 10);
  ring.classList.toggle('near', near);
  sht.classList.toggle('rdy', near && camOn);
  sht.disabled = !(near && camOn);
}

// ── GEOCODING UAT ──
async function getUAT(la, lo){
  if(cachedUAT) return cachedUAT;
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?lat=' + la + '&lon=' + lo + '&format=json&accept-language=ro');
    const d = await r.json();
    const a = d.address || {};
    cachedUAT = (a.city || a.town || a.village || a.municipality || a.county || '').toUpperCase();
    return cachedUAT;
  } catch(e) {
    return '';
  }
}

// ── CAMERA ──
function toggleCam(){
  const btn = document.getElementById('bcam');
  if(!camOn){
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 4096 }, height: { ideal: 2160 } }, audio: false })
      .then(s => {
        mStream = s;
        document.getElementById('vid').srcObject = s;
        camOn = true;
        btn.classList.add('on');
        chkProx();
        toast('Camera pornită', 'ok');
      })
      .catch(e => toast('Camera: ' + e.name, 'er'));
  } else {
    if(mStream) mStream.getTracks().forEach(t => t.stop());
    camOn = false;
    btn.classList.remove('on');
    closeCam();
    document.getElementById('sht').disabled = true;
    document.getElementById('sht').classList.remove('rdy');
  }
}

function openCam(){
  if(!camOn){
    toast('Porniți camera mai întâi (butonul Camera)', 'wn');
    return;
  }
  document.getElementById('camo').classList.add('show');
}
function closeCam(){
  document.getElementById('camo').classList.remove('show');
}

function onZoom(v){
  currentZoom = parseFloat(v);
  document.getElementById('zoom-val').textContent = currentZoom.toFixed(1) + '×';
  if(!mStream) return;
  const t = mStream.getVideoTracks()[0];
  if(t && t.getCapabilities){
    const caps = t.getCapabilities();
    if(caps.zoom){
      const sl = document.getElementById('zoom-slider');
      if(sl) sl.max = caps.zoom.max || 10;
      t.applyConstraints({ advanced: [{ zoom: Math.max(caps.zoom.min || 1, Math.min(caps.zoom.max || 10, currentZoom)) }] }).catch(() => applyZoomCSS());
      return;
    }
  }
  applyZoomCSS();
}
function applyZoomCSS(){
  const v = document.getElementById('vid');
  v.style.transform = 'scale(' + currentZoom + ')';
  v.style.transformOrigin = 'center center';
}

(function(){
  let id = 0, iz = 1;
  document.getElementById('vid').addEventListener('touchstart', e => {
    if(e.touches.length === 2){
      id = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      iz = currentZoom;
    }
  }, { passive: true });
  document.getElementById('vid').addEventListener('touchmove', e => {
    if(e.touches.length === 2){
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const z = Math.max(1, Math.min(10, iz * (d / id)));
      currentZoom = z;
      const sl = document.getElementById('zoom-slider');
      if(sl) sl.value = z;
      document.getElementById('zoom-val').textContent = z.toFixed(1) + '×';
      applyZoomCSS();
    }
  }, { passive: false });
})();

// ── CAPTURE & STAMPING (INSCRIPȚIONARE AUTOMATĂ PE IMAGINE) ──
function doCapture(){
  const vid = document.getElementById('vid'), cnv = document.getElementById('cnv');
  if(!vid || !vid.videoWidth){
    toast('Flux video indisponibil', 'er');
    return;
  }
  const w = vid.videoWidth, h = vid.videoHeight;
  cnv.width = w; cnv.height = h;
  const ctx = cnv.getContext('2d');
  ctx.drawImage(vid, 0, 0, w, h);

  // ── DESENARE BANNER METADATE APIA PE FOTOGRAFIE ──
  const bh = Math.max(160, Math.round(h * 0.16));
  ctx.fillStyle = 'rgba(6, 18, 6, 0.85)';
  ctx.fillRect(0, h - bh, w, bh);

  // Linia superioară APIA verde / portocaliu
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(0, h - bh, w, 6);

  const pd = n => String(n).padStart(2, '0');
  const now = new Date();
  const dateStr = pd(now.getDate()) + '.' + pd(now.getMonth() + 1) + '.' + now.getFullYear() + ' ' + pd(now.getHours()) + ':' + pd(now.getMinutes()) + ':' + pd(now.getSeconds());

  const parcelTxt = curF ? (lbl(curF)) : 'PARCELA NECONTROLATĂ';
  const gpsTxt = 'GPS: ' + (lat ? lat.toFixed(6) + '°, ' + lon.toFixed(6) + '°' : 'N/A');
  const accTxt = 'Acuratețe: ' + (acc ? '±' + acc.toFixed(1) + 'm' : '—') + ' | Altitudine: ' + (alt != null ? alt.toFixed(0) + 'm' : '—');
  const dirTxt = 'Direcție: ' + (hdg != null ? hdg + '° ' + cdir(hdg) : '—');
  const uatTxt = 'UAT: ' + (cachedUAT || 'APIA MARAMUREȘ - CONTROL PE TEREN');

  // Rândul 1: Parcel ID / Nume (Mare, auriu)
  ctx.fillStyle = '#FAC775';
  ctx.font = 'bold ' + Math.round(bh * 0.22) + 'px monospace';
  ctx.fillText(parcelTxt, Math.round(w * 0.03), h - bh + Math.round(bh * 0.32));

  // Rândul 2: Coordonate GPS & Dată / Oră
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + Math.round(bh * 0.16) + 'px monospace';
  ctx.fillText(gpsTxt, Math.round(w * 0.03), h - bh + Math.round(bh * 0.56));
  ctx.textAlign = 'right';
  ctx.fillText(dateStr, w - Math.round(w * 0.03), h - bh + Math.round(bh * 0.56));
  ctx.textAlign = 'left';

  // Rândul 3: Acuratețe, Altitudine, Direcție, UAT
  ctx.fillStyle = '#93c5fd';
  ctx.font = Math.round(bh * 0.14) + 'px monospace';
  ctx.fillText(accTxt + ' | ' + dirTxt, Math.round(w * 0.03), h - bh + Math.round(bh * 0.82));
  ctx.textAlign = 'right';
  ctx.fillText(uatTxt, w - Math.round(w * 0.03), h - bh + Math.round(bh * 0.82));
  ctx.textAlign = 'left';

  // Salvează Base64
  let b64 = cnv.toDataURL('image/jpeg', 0.92);

  // Nume fisier
  const cleanId = (curF && ((selField1 && curF[selField1]) || curF['__nm__'])) ? String((selField1 && curF[selField1]) || curF['__nm__']).replace(/[^a-zA-Z0-9]/g, '_') : 'parcela';
  const fname = cleanId + '_' + now.getFullYear() + pd(now.getMonth() + 1) + pd(now.getDate()) + '_' + pd(now.getHours()) + pd(now.getMinutes()) + pd(now.getSeconds()) + '.jpg';

  lastB64 = b64;
  lastFname = fname;

  document.getElementById('pimg').src = b64;
  document.getElementById('prevo').classList.add('show');
}

function discardP(){
  document.getElementById('prevo').classList.remove('show');
}

function saveP(){
  document.getElementById('prevo').classList.remove('show');
  closeCam();
  if(!lastB64) return;

  const rawB64 = lastB64.split(',')[1];
  const now = new Date();
  const pd = n => String(n).padStart(2, '0');
  const dtExif = now.getFullYear() + ':' + pd(now.getMonth() + 1) + ':' + pd(now.getDate()) + ' ' + pd(now.getHours()) + ':' + pd(now.getMinutes()) + ':' + pd(now.getSeconds());

  // Inserare EXIF GPS metadata in Base64 JPEG
  const finalB64 = injectEXIFInJPEG(rawB64, lat || 0, lon || 0, alt || 0, hdg || 0, dtExif);

  // Apelare NativeBridge Android sau salvare browser download
  if(window.AndroidApp && window.AndroidApp.savePhoto){
    const res = window.AndroidApp.savePhoto(finalB64, lastFname);
    if(res && res.startsWith('OK:')){
      toast('✓ Poză geolocalizată salvată în DCIM/ROPhotoKml', 'ok');
    } else {
      toast('Eroare salvare Android: ' + res, 'er');
    }
  } else {
    // Fallback browser download
    const a = document.createElement('a');
    a.href = 'data:image/jpeg;base64,' + finalB64;
    a.download = lastFname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast('Poză salvată (download browser)', 'ok');
  }

  // Adaugă în galeria sesiunii
  pCnt++;
  document.getElementById('pbg').style.display = 'inline-block';
  document.getElementById('pbg').textContent = pCnt + ' foto';
  gallery.push({ b64: 'data:image/jpeg;base64,' + finalB64, name: lastFname, dt: dtExif, lat, lon });
  renderGallery();
}

// ── INSERARE EXIF GPS METADATA IN JPEG ──
function injectEXIFInJPEG(base64Raw, lat, lon, alt, hdg, dtStr){
  try {
    const bin = atob(base64Raw);
    const len = bin.length;
    const buf = new Uint8Array(len);
    for(let i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);

    // Verifică header JPEG (0xFF 0xD8)
    if(buf[0] !== 0xFF || buf[1] !== 0xD8) return base64Raw;

    const exifBytes = buildEXIFBytes(dtStr, lat, lon, alt, hdg);
    const app1Len = exifBytes.length + 2;
    const app1Segment = new Uint8Array(exifBytes.length + 4);
    app1Segment[0] = 0xFF;
    app1Segment[1] = 0xE1;
    app1Segment[2] = (app1Len >> 8) & 0xFF;
    app1Segment[3] = app1Len & 0xFF;
    app1Segment.set(exifBytes, 4);

    // Găsim poziția după SOI și APP0 (dacă există)
    let pos = 2;
    if(buf[2] === 0xFF && buf[3] === 0xE0){
      const app0Len = (buf[4] << 8) | buf[5];
      pos = 2 + 2 + app0Len;
    }

    const newBuf = new Uint8Array(len + app1Segment.length);
    newBuf.set(buf.subarray(0, pos), 0);
    newBuf.set(app1Segment, pos);
    newBuf.set(buf.subarray(pos), pos + app1Segment.length);

    // Encode înapoi la Base64
    let res = '';
    const chunk = 8192;
    for(let i = 0; i < newBuf.length; i += chunk){
      res += String.fromCharCode.apply(null, newBuf.subarray(i, i + chunk));
    }
    return btoa(res);
  } catch(e) {
    console.warn('EXIF injection failed:', e);
    return base64Raw;
  }
}

function buildEXIFBytes(dtStr, lat, lon, alt, hdg){
  function w2(v){ return [v >> 8 & 0xFF, v & 0xFF]; }
  function w4(v){ return [v >> 24 & 0xFF, v >> 16 & 0xFF, v >> 8 & 0xFF, v & 0xFF]; }
  function rat(n, d){ return [...w4(Math.round(n)), ...w4(Math.round(d))]; }
  function gpsRat(deg){
    const d = Math.floor(Math.abs(deg));
    const m = Math.floor((Math.abs(deg) - d) * 60);
    const s = ((Math.abs(deg) - d) * 60 - m) * 60;
    return [...rat(d, 1), ...rat(m, 1), ...rat(Math.round(s * 1000), 1000)];
  }
  function ifdEntry(tag, type, count, valOrOff){
    return [...w2(tag), ...w2(type), ...w4(count), ...w4(valOrOff)];
  }
  function ascii(s){
    const b = [];
    for(let i = 0; i < s.length; i++) b.push(s.charCodeAt(i) & 0xFF);
    b.push(0);
    return b;
  }

  const IFD0_START = 8;
  const IFD0_ENTRIES = 4;
  const IFD0_SIZE = 2 + IFD0_ENTRIES * 12 + 4;
  const GPS_IFD_OFF = IFD0_START + IFD0_SIZE;
  const GPS_ENTRIES = 6;
  const GPS_IFD_SIZE = 2 + GPS_ENTRIES * 12 + 4;
  const GPS_DATA_OFF = GPS_IFD_OFF + GPS_IFD_SIZE;
  const DT_OFF = GPS_DATA_OFF + 24 * 3;

  const dt = dtStr || '2026:01:01 00:00:00';
  const dtBytes = ascii(dt);
  const absLat = lat ? Math.abs(lat) : 0;
  const absLon = lon ? Math.abs(lon) : 0;
  const absAlt = alt ? Math.abs(alt) : 0;
  const latRef = (lat && lat >= 0) ? 0x4E000000 : 0x53000000; // 'N' sau 'S'
  const lonRef = (lon && lon >= 0) ? 0x45000000 : 0x57000000; // 'E' sau 'W'

  const latRat = gpsRat(absLat);
  const lonRat = gpsRat(absLon);
  const altRat = [...rat(Math.round(absAlt * 100), 100)];

  const gpsLatOff = GPS_DATA_OFF;
  const gpsLonOff = GPS_DATA_OFF + 24;
  const gpsAltOff = GPS_DATA_OFF + 48;

  let gpsIFD = [...w2(GPS_ENTRIES)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0000, 1, 4, 0x02020000)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0001, 2, 2, latRef)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0002, 5, 3, gpsLatOff)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0003, 2, 2, lonRef)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0004, 5, 3, gpsLonOff)];
  gpsIFD = [...gpsIFD, ...ifdEntry(0x0006, 5, 1, gpsAltOff)];
  gpsIFD = [...gpsIFD, ...w4(0)];

  const dtOff = GPS_DATA_OFF + 56;
  let ifd0 = [...w2(IFD0_ENTRIES)];
  ifd0 = [...ifd0, ...ifdEntry(0x0132, 2, 20, dtOff)];
  ifd0 = [...ifd0, ...ifdEntry(0x013B, 2, 22, dtOff + 20)];
  ifd0 = [...ifd0, ...ifdEntry(0x8825, 4, 1, GPS_IFD_OFF)];
  ifd0 = [...ifd0, ...ifdEntry(0x9003, 2, 20, dtOff)];
  ifd0 = [...ifd0, ...w4(0)];

  const artistBytes = ascii('APIA Maramures Control');

  const exifHeader = [0x45, 0x78, 0x69, 0x66, 0x00, 0x00];
  const tiff = [
    0x4D, 0x4D, 0x00, 0x2A,
    ...w4(IFD0_START),
    ...ifd0,
    ...gpsIFD,
    ...latRat,
    ...lonRat,
    ...altRat,
    ...dtBytes,
    ...artistBytes
  ];
  return new Uint8Array([...exifHeader, ...tiff]);
}

// ── GALLERY ──
function openGallery(){
  renderGallery();
  document.getElementById('galo').classList.add('show');
}
function closeGallery(){
  document.getElementById('galo').classList.remove('show');
}
function renderGallery(){
  const g = document.getElementById('galg');
  g.innerHTML = '';
  if(!gallery.length){
    g.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;padding:30px">Nicio poză efectuată în această sesiune</div>';
    return;
  }
  gallery.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'gt';
    d.innerHTML = '<img src="' + it.b64 + '" onclick="openFull(' + i + ')">'
      + '<button class="gd" onclick="delPic(' + i + ')">✕</button>';
    g.appendChild(d);
  });
}
function openFull(i){
  const it = gallery[i];
  document.getElementById('fullimg').src = it.b64;
  document.getElementById('fvname').textContent = it.name;
  document.getElementById('fullview').classList.add('show');
}
function closeFull(){
  document.getElementById('fullview').classList.remove('show');
}
function delPic(i){
  gallery.splice(i, 1);
  pCnt = gallery.length;
  if(pCnt === 0){
    document.getElementById('pbg').style.display = 'none';
  } else {
    document.getElementById('pbg').textContent = pCnt + ' foto';
  }
  renderGallery();
}

// ── GEO MATH ──
function hav(la1, lo1, la2, lo2){
  const R = 6371000, dLa = (la2 - la1) * Math.PI / 180, dLo = (lo2 - lo1) * Math.PI / 180;
  const a = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(la1 * Math.PI / 180) * Math.cos(la2 * Math.PI / 180) * Math.sin(dLo / 2) * Math.sin(dLo / 2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function pip(la, lo, cs){
  let ins = false;
  for(let i = 0, j = cs.length - 1; i < cs.length; j = i++){
    const xi = cs[i][0], yi = cs[i][1], xj = cs[j][0], yj = cs[j][1];
    if((yi > lo) !== (yj > lo) && la < (xj - xi) * (lo - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function dseg(la, lo, la1, lo1, la2, lo2){
  const dx = la2 - la1, dy = lo2 - lo1, t = dx || dy ? Math.max(0, Math.min(1, ((la - la1) * dx + (lo - lo1) * dy) / (dx * dx + dy * dy))) : 0;
  return hav(la, lo, la1 + t * dx, lo1 + t * dy);
}
function d2poly(la, lo, cs){
  let d = Infinity;
  for(let i = 0, j = cs.length - 1; i < cs.length; j = i++) d = Math.min(d, dseg(la, lo, cs[j][0], cs[j][1], cs[i][0], cs[i][1]));
  return pip(la, lo, cs) ? 0 : d;
}

// ── TOAST NOTIFICATION ──
function toast(m, c){
  const t = document.getElementById('tst');
  t.textContent = m;
  t.className = c || 'ok';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
